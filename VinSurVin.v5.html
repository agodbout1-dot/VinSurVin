<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vin sur Vin — Gestion de Cave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif']
                    },
                    colors: {
                        cream: '#FBF9F5',
                        sand: '#F3EFE6',
                        card: '#FFFFFF',
                        borderline: '#E6DFD3',
                        ink: '#1E1A18',
                        inkmuted: '#6E655F',
                        bordeaux: '#6B1422',
                        gold: '#D4AF37',
                        'gold-dark': '#9E7B1C'
                    }
                }
            }
        };
    </script>

    <style>
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
        body {
            background-color: #FBF9F5;
            color: #1E1A18;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(92px + env(safe-area-inset-bottom));
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            background: rgba(251, 249, 245, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }
        .bottom-nav {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        @media (max-width: 380px) {
            html { font-size: 15px; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.22s ease-out forwards; }
    </style>
</head>
<body class="antialiased selection:bg-bordeaux selection:text-white">

    <!-- EN-TÊTE -->
    <header class="sticky top-0 z-30 glass-header border-b border-borderline px-4 pb-3">
        <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
            <button onclick="switchTab('home')" class="flex items-center gap-2.5 text-left min-w-0 active:opacity-80">
                <div class="w-9 h-9 rounded-xl bg-bordeaux text-white flex items-center justify-center shadow-sm shrink-0">
                    <i class="ph-fill ph-wine text-xl text-gold"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-serif text-2xl font-bold leading-none text-bordeaux tracking-tight truncate">Vin sur Vin</h1>
                </div>
            </button>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="exportCellarToExcelCsv()" title="Exporter en Excel (.csv)" class="px-3 h-9 rounded-full bg-emerald-50 border border-emerald-200 flex items-center gap-1.5 text-emerald-800 text-xs font-semibold active:scale-95 transition">
                    <i class="ph-bold ph-file-xls text-base"></i>
                    <span>Excel</span>
                </button>
                <button onclick="openSettingsModal()" title="Paramètres & Clé API" class="w-9 h-9 rounded-full bg-sand border border-borderline flex items-center justify-center text-ink active:scale-95 transition relative">
                    <i class="ph ph-gear text-lg"></i>
                    <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 border-2 border-cream absolute -top-0.5 -right-0.5"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main id="app-content" class="max-w-lg mx-auto px-4 pt-4 space-y-5"></main>

    <!-- ENTRÉES FICHIERS CACHÉES -->
    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
    <input type="file" id="gallery-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
    <input type="file" id="csv-import-input" accept=".csv,text/csv" class="hidden" onchange="handleExcelCsvImport(event)">

    <!-- NAVIGATION BASSE -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bottom-nav border-t border-borderline px-2 pt-2">
        <div class="max-w-lg mx-auto grid grid-cols-5 items-center text-center">
            <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-bordeaux">
                <i class="ph-fill ph-house text-xl"></i>
                <span class="text-[10px] font-semibold">Accueil</span>
            </button>
            <button onclick="switchTab('cellar')" id="nav-cellar" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-inkmuted">
                <i class="ph ph-wine text-xl"></i>
                <span class="text-[10px] font-medium">Ma Cave</span>
            </button>
            <div class="flex justify-center -mt-6">
                <button onclick="openScanChoiceModal()" aria-label="Scanner une bouteille" class="w-14 h-14 rounded-full bg-bordeaux text-white shadow-lg shadow-bordeaux/30 border-4 border-cream flex items-center justify-center active:scale-95 transition">
                    <i class="ph-bold ph-camera text-2xl text-gold"></i>
                </button>
            </div>
            <button onclick="switchTab('sommelier')" id="nav-sommelier" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-inkmuted">
                <i class="ph ph-sparkle text-xl"></i>
                <span class="text-[10px] font-medium">Sommelier</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-inkmuted">
                <i class="ph ph-clock-counter-clockwise text-xl"></i>
                <span class="text-[10px] font-medium">Historique</span>
            </button>
        </div>
    </nav>

    <!-- MODALE GÉNÉRIQUE -->
    <div id="modal-overlay" onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-box" style="padding-bottom: max(1.75rem, env(safe-area-inset-bottom));" class="bg-cream w-full max-w-lg rounded-t-3xl sm:rounded-3xl border border-borderline shadow-2xl max-h-[88dvh] overflow-y-auto p-5 animate-fade-up"></div>
    </div>

    <!-- ZOOM PHOTO PLEIN ÉCRAN -->
    <div id="photo-zoom-overlay" onclick="closePhotoZoom()" class="fixed inset-0 z-[60] bg-black/90 hidden flex-col items-center justify-center p-4">
        <button onclick="closePhotoZoom()" class="self-end mb-3 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center text-xl">✕</button>
        <img id="photo-zoom-img" src="" alt="Photo bouteille" class="max-h-[80vh] max-w-full rounded-2xl object-contain shadow-2xl">
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[70] bg-ink text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90vw] text-center"></div>

    <script>
        // =========================================================================
        // 1. CONSTANTES, UTILITAIRES & STOCKAGE INDEXEDDB + MIROIR LOCALSTORAGE
        // =========================================================================
        const STORAGE_KEY = 'vin_sur_vin_state_v1';
        const IDB_NAME = 'VinSurVinDB';
        const IDB_STORE = 'appStateStore';
        const IDB_KEY = 'primaryState';
        const CURRENT_YEAR = new Date().getFullYear();

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatEuro(amount) {
            const num = Math.round(Number(amount) || 0);
            return num.toLocaleString('fr-FR') + ' €';
        }

        function showToast(message) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = message;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 3000);
        }

        function openModal(html) {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.innerHTML = html;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function openPhotoZoom(src) {
            if (!src) return;
            document.getElementById('photo-zoom-img').src = src;
            const ov = document.getElementById('photo-zoom-overlay');
            ov.classList.remove('hidden');
            ov.classList.add('flex');
        }

        function closePhotoZoom() {
            const ov = document.getElementById('photo-zoom-overlay');
            ov.classList.add('hidden');
            ov.classList.remove('flex');
        }

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error('IndexedDB indisponible'));
                    return;
                }
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function readFromIndexedDB() {
            try {
                const db = await openIndexedDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readonly');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.get(IDB_KEY);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (_) {
                return null;
            }
        }

        async function writeToIndexedDB(payload) {
            try {
                const db = await openIndexedDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.put(payload, IDB_KEY);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
                return true;
            } catch (_) {
                return false;
            }
        }

        // =========================================================================
        // 2. DONNÉES INITIALES & ÉTAT GLOBAL
        // =========================================================================
        function createDefaultState() {
            return {
                activeTab: 'home',
                apiKey: '',
                cachedWorkingModel: '',
                selectedCaveFilter: 'all',
                selectedColorFilter: 'all',
                searchQuery: '',
                sortBy: 'maturity',
                caves: [
                    { id: 'cave_sc', name: 'Saint-Cloud', subtitle: 'Cave principale' },
                    { id: 'cave_cq', name: 'Carqueiranne', subtitle: 'Cave d’été' }
                ],
                wines: [
                    {
                        id: 'wine_demo_1',
                        name: 'Château Léoville Barton',
                        domain: 'Famille Barton',
                        vintage: 2016,
                        color: 'Rouge',
                        appellation: 'Saint-Julien (2e Cru Classé)',
                        estimatedPrice: 115,
                        parkerScore: '96/100',
                        vivinoScore: '4.4/5',
                        drinkFrom: 2024,
                        drinkTo: 2042,
                        notes: 'Grande structure tannique, cèdre et cassis noir. À carafer 2h avant service.',
                        photo: ''
                    },
                    {
                        id: 'wine_demo_2',
                        name: 'Puligny-Montrachet 1er Cru Les Folatières',
                        domain: 'Domaine Leflaive',
                        vintage: 2020,
                        color: 'Blanc',
                        appellation: 'Puligny-Montrachet 1er Cru',
                        estimatedPrice: 280,
                        parkerScore: '95/100',
                        vivinoScore: '4.6/5',
                        drinkFrom: 2024,
                        drinkTo: 2033,
                        notes: 'Tension minérale remarquable, fleurs blanches et noisette grillée.',
                        photo: ''
                    },
                    {
                        id: 'wine_demo_3',
                        name: 'Clos Cibonne Cuvée Spéciale des Vignettes',
                        domain: 'Château Cibonne',
                        vintage: 2022,
                        color: 'Rosé',
                        appellation: 'Côtes de Provence Cru Classé',
                        estimatedPrice: 36,
                        parkerScore: '92/100',
                        vivinoScore: '4.2/5',
                        drinkFrom: 2023,
                        drinkTo: 2028,
                        notes: 'Tibouren élevé sous voile, gastronomie méditerranéenne.',
                        photo: ''
                    },
                    {
                        id: 'wine_demo_4',
                        name: 'Cristal Brut',
                        domain: 'Champagne Louis Roederer',
                        vintage: 2015,
                        color: 'Champagne',
                        appellation: 'Champagne',
                        estimatedPrice: 295,
                        parkerScore: '96/100',
                        vivinoScore: '4.6/5',
                        drinkFrom: 2024,
                        drinkTo: 2038,
                        notes: 'Bulle crayeuse d’une grande finesse, brioche fine et agrumes confits.',
                        photo: ''
                    }
                ],
                stockEntries: [
                    { id: 'st_1', wineId: 'wine_demo_1', caveId: 'cave_sc', quantity: 6 },
                    { id: 'st_2', wineId: 'wine_demo_2', caveId: 'cave_sc', quantity: 3 },
                    { id: 'st_3', wineId: 'wine_demo_3', caveId: 'cave_cq', quantity: 6 },
                    { id: 'st_4', wineId: 'wine_demo_4', caveId: 'cave_sc', quantity: 2 }
                ],
                historyEntries: [
                    {
                        id: 'hist_demo_1',
                        date: '2025-12-24',
                        reason: 'Bu / Dégusté',
                        wineName: 'Château Lynch-Bages',
                        vintage: 2015,
                        color: 'Rouge',
                        caveName: 'Saint-Cloud',
                        quantity: 1,
                        unitPrice: 135,
                        parkerScore: '95/100',
                        vivinoScore: '4.4/5',
                        note: 'Réveillon de Noël — magnifique équilibre.'
                    }
                ],
                chatMessages: [
                    {
                        role: 'assistant',
                        text: 'Bonjour ! Je suis votre Sommelier personnel. Je connais chaque bouteille de vos caves de Saint-Cloud et Carqueiranne. Quel plat préparez-vous ou quelle bouteille souhaitez-vous ouvrir ?'
                    }
                ],
                pendingScanBatch: null
            };
        }

        function normalizeLoadedState(raw) {
            const def = createDefaultState();
            if (!raw || typeof raw !== 'object') return def;
            const merged = { ...def, ...raw };
            merged.caves = Array.isArray(raw.caves) && raw.caves.length ? raw.caves : def.caves;
            merged.wines = Array.isArray(raw.wines) ? raw.wines : def.wines;
            merged.stockEntries = Array.isArray(raw.stockEntries) ? raw.stockEntries : def.stockEntries;
            merged.historyEntries = Array.isArray(raw.historyEntries) ? raw.historyEntries : def.historyEntries;
            merged.chatMessages = Array.isArray(raw.chatMessages) && raw.chatMessages.length ? raw.chatMessages : def.chatMessages;
            merged.pendingScanBatch = null;
            return merged;
        }

        function loadInitialStateSync() {
            try {
                const rawStr = localStorage.getItem(STORAGE_KEY);
                if (rawStr) return normalizeLoadedState(JSON.parse(rawStr));
            } catch (_) {}
            return createDefaultState();
        }

        let state = loadInitialStateSync();

        function saveState() {
            const cleanToSave = { ...state, pendingScanBatch: null };
            writeToIndexedDB(cleanToSave);
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanToSave));
            } catch (_) {
                try {
                    const lightMirror = {
                        ...cleanToSave,
                        wines: cleanToSave.wines.map(w => ({ ...w, photo: '' }))
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(lightMirror));
                } catch (__) {}
            }
        }

        // =========================================================================
        // 3. MÉTRIQUES, MATURITÉ, OUVERTURE EN AVANCE & RÉPARTITION COULEURS
        // =========================================================================
        function getCaveName(caveId) {
            const c = state.caves.find(x => x.id === caveId);
            return c ? c.name : 'Saint-Cloud';
        }

        function getWineStockEntries(wineId) {
            return state.stockEntries.filter(s => s.wineId === wineId && Number(s.quantity) > 0);
        }

        function getWineTotalBottles(wineId) {
            return getWineStockEntries(wineId).reduce((acc, s) => acc + (Number(s.quantity) || 0), 0);
        }

        function getMaturityInfo(wine) {
            const from = Number(wine.drinkFrom) || CURRENT_YEAR;
            const to = Number(wine.drinkTo) || (from + 5);
            if (CURRENT_YEAR > to) {
                return {
                    status: 'past',
                    priority: 0,
                    label: `À boire vite (avant ${to})`,
                    badgeClass: 'bg-red-100 text-red-800 border-red-200'
                };
            }
            if (CURRENT_YEAR >= from && CURRENT_YEAR <= to) {
                const urgent = (to - CURRENT_YEAR) <= 1;
                return {
                    status: 'ready',
                    priority: urgent ? 1 : 2,
                    label: urgent ? `Apogée fin (${from}–${to})` : `À son apogée (${from}–${to})`,
                    badgeClass: urgent ? 'bg-amber-100 text-amber-900 border-amber-200' : 'bg-emerald-100 text-emerald-800 border-emerald-200'
                };
            }
            return {
                status: 'young',
                priority: 3,
                label: `À garder (${from}–${to})`,
                badgeClass: 'bg-stone-100 text-stone-700 border-stone-200'
            };
        }

        function getOpeningAdvice(wine) {
            const color = wine.color || 'Rouge';
            const vintageNum = Number(wine.vintage) || 0;
            const age = vintageNum > 0 ? Math.max(0, CURRENT_YEAR - vintageNum) : 0;
            const appText = `${wine.appellation || ''} ${wine.name || ''} ${wine.domain || ''}`.toLowerCase();

            if (color === 'Champagne') {
                if (age >= 12 || appText.includes('millésimé') || appText.includes('cuvée')) {
                    return {
                        shortLabel: 'Ouvrir 10–15 min avant',
                        detail: 'Laisser respirer 10 à 15 min dans un verre tulipe ou blanc à 10–12 °C ; éviter la carafe.'
                    };
                }
                return {
                    shortLabel: 'Ouvrir au service',
                    detail: 'À ouvrir au moment du service à 8–10 °C sans ouverture prolongée.'
                };
            }

            if (color === 'Rosé') {
                return {
                    shortLabel: 'Ouvrir au service',
                    detail: 'À ouvrir au moment du service bien frais (8–10 °C).'
                };
            }

            if (color === 'Blanc') {
                const isRichWhite = age >= 6 || /bourgogne|meursault|puligny|chassagne|corton|pessac|hermitage|condrieu|grand cru|1er cru/i.test(appText);
                if (isRichWhite) {
                    return {
                        shortLabel: 'Ouvrir 30–45 min avant',
                        detail: 'Ouvrir 30 à 45 min avant (ou carafer doucement si très jeune) à 11–13 °C.'
                    };
                }
                return {
                    shortLabel: 'Ouvrir 10–15 min avant',
                    detail: 'Ouvrir 10 à 15 min avant le service à 9–11 °C.'
                };
            }

            const mat = getMaturityInfo(wine);
            const isStructuredRed = /bordeaux|pauillac|saint-julien|margaux|saint-estèphe|pomerol|saint-émilion|pessac|rhône|côte-rôtie|hermitage|cornas|châteauneuf|barolo|rioja reserva|gran reserva/i.test(appText);

            if (mat.status === 'past' || age >= 18) {
                return {
                    shortLabel: 'Ouvrir 30–45 min avant (sans carafe)',
                    detail: 'Vin mature/évolué : ouvrir 30 à 45 min avant et servir délicatement sans brusquer ni carafer longuement.'
                };
            }
            if (isStructuredRed && age <= 10) {
                return {
                    shortLabel: 'Carafer / Ouvrir 1h30–2h avant',
                    detail: 'Rouge structuré encore jeune : ouvrir 1h30 à 2h avant ou carafer pour assouplir les tanins.'
                };
            }
            if (age <= 4) {
                return {
                    shortLabel: 'Ouvrir 45–60 min avant',
                    detail: 'Rouge fruité/jeune : ouvrir 45 à 60 min avant ou passer en carafe 30 min pour l’aérer.'
                };
            }
            return {
                shortLabel: 'Ouvrir 1h avant',
                detail: 'Ouvrir environ 1h avant le service (carafage léger si dépôt) à 16–17 °C.'
            };
        }

        function getColorDotHtml(color) {
            const map = {
                'Rouge': 'bg-[#7A1626]',
                'Blanc': 'bg-[#E5C158]',
                'Rosé': 'bg-[#F29CA3]',
                'Champagne': 'bg-[#D6B872] ring-1 ring-amber-500/40'
            };
            return `<span class="inline-block w-2.5 h-2.5 rounded-full ${map[color] || 'bg-stone-400'} shrink-0"></span>`;
        }

        function computeCellarBreakdown(caveId = null) {
            const counts = { Rouge: 0, Blanc: 0, Rosé: 0, Champagne: 0, total: 0, value: 0 };
            state.stockEntries.forEach(st => {
                const qty = Number(st.quantity) || 0;
                if (qty <= 0) return;
                if (caveId && st.caveId !== caveId) return;
                const wine = state.wines.find(w => w.id === st.wineId);
                if (!wine) return;
                counts.total += qty;
                counts.value += qty * (Number(wine.estimatedPrice) || 0);
                if (counts[wine.color] !== undefined) {
                    counts[wine.color] += qty;
                } else {
                    counts.Rouge += qty;
                }
            });
            return counts;
        }

        function updateApiStatusDot() {
            const dot = document.getElementById('api-status-dot');
            if (!dot) return;
            if ((state.apiKey || '').trim().length > 10) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-cream absolute -top-0.5 -right-0.5';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 border-2 border-cream absolute -top-0.5 -right-0.5';
            }
        }

        // =========================================================================
        // 4. NAVIGATION & RENDU PRINCIPAL
        // =========================================================================
        function switchTab(tab, caveFilter = null) {
            state.activeTab = tab;
            if (caveFilter !== null) {
                state.selectedCaveFilter = caveFilter;
            }
            saveState();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderApp() {
            updateApiStatusDot();
            const tabs = ['home', 'cellar', 'sommelier', 'history'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (!btn) return;
                const icon = btn.querySelector('i');
                const label = btn.querySelector('span');
                const isActive = state.activeTab === t;
                btn.className = `nav-btn flex flex-col items-center gap-0.5 py-1 ${isActive ? 'text-bordeaux' : 'text-inkmuted'}`;
                if (icon) {
                    icon.className = icon.className.replace('ph-fill', 'ph');
                    if (isActive) icon.className = icon.className.replace('ph ', 'ph-fill ');
                }
                if (label) {
                    label.className = `text-[10px] ${isActive ? 'font-semibold' : 'font-medium'}`;
                }
            });

            const main = document.getElementById('app-content');
            if (!main) return;

            if (state.activeTab === 'home') {
                main.innerHTML = renderHomeView();
            } else if (state.activeTab === 'cellar') {
                main.innerHTML = renderCellarView();
            } else if (state.activeTab === 'sommelier') {
                main.innerHTML = renderSommelierView();
                const chatBox = document.getElementById('sommelier-messages');
                if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
            } else if (state.activeTab === 'history') {
                main.innerHTML = renderHistoryView();
            }
        }

        // =========================================================================
        // 5. VUE ACCUEIL (MES CAVES + RÉPARTITION COULEURS + MATURITÉ)
        // =========================================================================
        function renderHomeView() {
            const globalStats = computeCellarBreakdown(null);
            const total = Math.max(globalStats.total, 1);
            const pctRed = Math.round((globalStats.Rouge / total) * 100);
            const pctWhite = Math.round((globalStats.Blanc / total) * 100);
            const pctRose = Math.round((globalStats.Rosé / total) * 100);
            const pctChamp = Math.max(0, 100 - pctRed - pctWhite - pctRose);

            const priorityWines = state.wines
                .map(w => ({ wine: w, qty: getWineTotalBottles(w.id), mat: getMaturityInfo(w) }))
                .filter(x => x.qty > 0 && (x.mat.status === 'past' || x.mat.status === 'ready'))
                .sort((a, b) => a.mat.priority - b.mat.priority || (Number(a.wine.drinkTo) - Number(b.wine.drinkTo)))
                .slice(0, 4);

            return `
                <section class="space-y-4 animate-fade-up">
                    <!-- CARTE CONSOLIDÉE MES CAVES -->
                    <div onclick="switchTab('cellar', 'all')" class="bg-bordeaux text-white rounded-3xl p-5 shadow-md cursor-pointer active:scale-[0.99] transition">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <p class="text-[11px] uppercase tracking-widest text-gold font-semibold">Mes Caves</p>
                                <div class="flex items-baseline gap-2.5 mt-1">
                                    <span class="font-serif text-4xl font-bold">${globalStats.total}</span>
                                    <span class="text-sm text-white/80">bouteille${globalStats.total > 1 ? 's' : ''}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-[11px] text-white/70">Valeur estimée</p>
                                <p class="font-serif text-2xl font-bold text-gold">${formatEuro(globalStats.value)}</p>
                            </div>
                        </div>

                        <!-- BARRE DE RÉPARTITION PAR COULEURS -->
                        <div class="mt-4">
                            <div class="h-2.5 w-full rounded-full bg-black/25 overflow-hidden flex">
                                ${globalStats.Rouge > 0 ? `<div style="width:${pctRed}%" class="bg-[#C93B52] h-full"></div>` : ''}
                                ${globalStats.Blanc > 0 ? `<div style="width:${pctWhite}%" class="bg-[#F3D574] h-full"></div>` : ''}
                                ${globalStats.Rosé > 0 ? `<div style="width:${pctRose}%" class="bg-[#F6A5B0] h-full"></div>` : ''}
                                ${globalStats.Champagne > 0 ? `<div style="width:${pctChamp}%" class="bg-[#E5C88B] h-full"></div>` : ''}
                            </div>
                            <div class="grid grid-cols-4 gap-1.5 mt-2.5 text-[11px]">
                                <div class="bg-white/10 rounded-xl px-2 py-1.5 flex items-center justify-between gap-1">
                                    <span class="flex items-center gap-1 truncate"><span class="w-2 h-2 rounded-full bg-[#C93B52] shrink-0"></span>Rouge</span>
                                    <span class="font-bold">${globalStats.Rouge}</span>
                                </div>
                                <div class="bg-white/10 rounded-xl px-2 py-1.5 flex items-center justify-between gap-1">
                                    <span class="flex items-center gap-1 truncate"><span class="w-2 h-2 rounded-full bg-[#F3D574] shrink-0"></span>Blanc</span>
                                    <span class="font-bold">${globalStats.Blanc}</span>
                                </div>
                                <div class="bg-white/10 rounded-xl px-2 py-1.5 flex items-center justify-between gap-1">
                                    <span class="flex items-center gap-1 truncate"><span class="w-2 h-2 rounded-full bg-[#F6A5B0] shrink-0"></span>Rosé</span>
                                    <span class="font-bold">${globalStats.Rosé}</span>
                                </div>
                                <div class="bg-white/10 rounded-xl px-2 py-1.5 flex items-center justify-between gap-1">
                                    <span class="flex items-center gap-1 truncate"><span class="w-2 h-2 rounded-full bg-[#E5C88B] shrink-0"></span>Bulles</span>
                                    <span class="font-bold">${globalStats.Champagne}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- DÉTAIL PAR CAVE (SAINT-CLOUD / CARQUEIRANNE) -->
                    <div class="grid grid-cols-1 min-[360px]:grid-cols-2 gap-3">
                        ${state.caves.map(cave => {
                            const cs = computeCellarBreakdown(cave.id);
                            return `
                                <div onclick="switchTab('cellar', '${cave.id}')" class="bg-card rounded-2xl p-3.5 border border-borderline shadow-xs cursor-pointer active:scale-[0.98] transition min-w-0">
                                    <div class="flex items-center justify-between gap-1">
                                        <h2 class="font-serif text-lg font-bold text-ink truncate">${escapeHtml(cave.name)}</h2>
                                        <i class="ph ph-caret-right text-inkmuted text-sm shrink-0"></i>
                                    </div>
                                    <div class="flex items-baseline justify-between gap-1 mt-1">
                                        <span class="text-xl font-bold text-bordeaux whitespace-nowrap">${cs.total} <span class="text-xs font-normal text-inkmuted">btl</span></span>
                                        <span class="text-xs font-semibold text-gold-dark whitespace-nowrap">${formatEuro(cs.value)}</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-1 mt-2.5 text-[10px] text-inkmuted">
                                        <span class="px-1.5 py-0.5 rounded-md bg-sand truncate">R: <strong class="text-ink">${cs.Rouge}</strong></span>
                                        <span class="px-1.5 py-0.5 rounded-md bg-sand truncate">B: <strong class="text-ink">${cs.Blanc}</strong></span>
                                        <span class="px-1.5 py-0.5 rounded-md bg-sand truncate">Ro: <strong class="text-ink">${cs.Rosé}</strong></span>
                                        <span class="px-1.5 py-0.5 rounded-md bg-sand truncate">Ch: <strong class="text-ink">${cs.Champagne}</strong></span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- ACTIONS RAPIDES SCANNER -->
                    <div class="bg-card rounded-2xl p-4 border border-borderline shadow-xs">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div>
                                <h2 class="font-serif text-lg font-bold text-ink leading-tight">Ajouter une bouteille</h2>
                                <p class="text-xs text-inkmuted">Reconnaissance IA par photo ou saisie</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="document.getElementById('camera-input').click()" class="py-2.5 px-2 rounded-xl bg-bordeaux text-white text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition">
                                <i class="ph-bold ph-camera text-lg text-gold"></i>
                                <span>Photo</span>
                            </button>
                            <button onclick="document.getElementById('gallery-input').click()" class="py-2.5 px-2 rounded-xl bg-sand border border-borderline text-ink text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition">
                                <i class="ph-bold ph-image text-lg text-bordeaux"></i>
                                <span>Galerie</span>
                            </button>
                            <button onclick="openAddManualWineModal()" class="py-2.5 px-2 rounded-xl bg-sand border border-borderline text-ink text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition">
                                <i class="ph-bold ph-plus-circle text-lg text-bordeaux"></i>
                                <span>Manuel</span>
                            </button>
                        </div>
                    </div>

                    <!-- À DÉGUSTER EN PRIORITÉ -->
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <h2 class="font-serif text-xl font-bold text-ink">À déguster à maturité</h2>
                            <button onclick="switchTab('cellar', 'all')" class="text-xs font-semibold text-bordeaux">Tout voir →</button>
                        </div>
                        ${priorityWines.length === 0 ? `
                            <div class="bg-card rounded-2xl p-4 border border-borderline text-xs text-inkmuted text-center">
                                Aucune bouteille en cave pour le moment.
                            </div>
                        ` : priorityWines.map(({ wine, qty, mat }) => `
                            <div onclick="openWineDetailModal('${wine.id}')" class="bg-card rounded-2xl p-3.5 border border-borderline shadow-xs flex items-center justify-between gap-3 cursor-pointer active:scale-[0.99] transition">
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-1.5">
                                        ${getColorDotHtml(wine.color)}
                                        <h3 class="font-semibold text-sm text-ink truncate">${escapeHtml(wine.name)}</h3>
                                    </div>
                                    <p class="text-xs text-inkmuted truncate mt-0.5">${wine.vintage || 'NM'} • ${escapeHtml(wine.appellation || wine.domain || '')}</p>
                                    <span class="inline-block mt-1.5 text-[10px] font-semibold px-2 py-0.5 rounded-full border ${mat.badgeClass}">${mat.label}</span>
                                </div>
                                <div class="text-right shrink-0">
                                    <span class="inline-flex items-center justify-center px-2.5 py-1 rounded-xl bg-sand text-bordeaux font-bold text-xs">${qty} btl</span>
                                    <p class="text-[11px] font-semibold text-inkmuted mt-1">${formatEuro(wine.estimatedPrice)}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
        }

        // =========================================================================
        // 6. VUE MA CAVE (RECHERCHE, FILTRES, TRI & FICHES BOUTEILLES)
        // =========================================================================
        function setSearchQuery(val) {
            state.searchQuery = val;
            renderApp();
            const inp = document.getElementById('cellar-search-input');
            if (inp) {
                inp.focus();
                inp.setSelectionRange(val.length, val.length);
            }
        }

        function setCaveFilter(caveId) {
            state.selectedCaveFilter = caveId;
            renderApp();
        }

        function setColorFilter(color) {
            state.selectedColorFilter = color;
            renderApp();
        }

        function setSortBy(sortVal) {
            state.sortBy = sortVal;
            renderApp();
        }

        function renderCellarView() {
            const q = (state.searchQuery || '').toLowerCase().trim();
            let items = state.wines.map(wine => {
                const stocks = getWineStockEntries(wine.id);
                const relevantStocks = state.selectedCaveFilter === 'all'
                    ? stocks
                    : stocks.filter(s => s.caveId === state.selectedCaveFilter);
                const qty = relevantStocks.reduce((a, b) => a + (Number(b.quantity) || 0), 0);
                return { wine, qty, stocks: relevantStocks, mat: getMaturityInfo(wine) };
            }).filter(x => x.qty > 0);

            if (state.selectedColorFilter !== 'all') {
                items = items.filter(x => x.wine.color === state.selectedColorFilter);
            }

            if (q) {
                items = items.filter(x => {
                    const hay = `${x.wine.name} ${x.wine.domain} ${x.wine.appellation} ${x.wine.vintage} ${x.wine.notes}`.toLowerCase();
                    return hay.includes(q);
                });
            }

            items.sort((a, b) => {
                if (state.sortBy === 'price') return (Number(b.wine.estimatedPrice) || 0) - (Number(a.wine.estimatedPrice) || 0);
                if (state.sortBy === 'vintage') return (Number(a.wine.vintage) || 9999) - (Number(b.wine.vintage) || 9999);
                if (state.sortBy === 'parker') return (parseFloat(b.wine.parkerScore) || 0) - (parseFloat(a.wine.parkerScore) || 0);
                if (state.sortBy === 'vivino') return (parseFloat(b.wine.vivinoScore) || 0) - (parseFloat(a.wine.vivinoScore) || 0);
                return a.mat.priority - b.mat.priority || (Number(a.wine.drinkTo) - Number(b.wine.drinkTo));
            });

            const totalShown = items.reduce((acc, x) => acc + x.qty, 0);

            return `
                <section class="space-y-3.5 animate-fade-up">
                    <!-- RECHERCHE & TRI -->
                    <div class="flex flex-col min-[380px]:flex-row items-stretch min-[380px]:items-center gap-2">
                        <div class="relative flex-1 min-w-0">
                            <input id="cellar-search-input" type="text" value="${escapeHtml(state.searchQuery)}" oninput="setSearchQuery(this.value)" placeholder="Rechercher château, millésime..." class="w-full pl-3.5 pr-8 py-2.5 rounded-2xl bg-card border border-borderline text-sm focus:outline-none focus:border-bordeaux">
                            ${state.searchQuery ? `<button onclick="setSearchQuery('')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-inkmuted text-sm">✕</button>` : ''}
                        </div>
                        <select onchange="setSortBy(this.value)" class="py-2.5 px-3 rounded-2xl bg-card border border-borderline text-xs font-semibold text-ink focus:outline-none shrink-0">
                            <option value="maturity" ${state.sortBy === 'maturity' ? 'selected' : ''}>Tri : Apogée</option>
                            <option value="price" ${state.sortBy === 'price' ? 'selected' : ''}>Tri : Cote €</option>
                            <option value="vintage" ${state.sortBy === 'vintage' ? 'selected' : ''}>Tri : Millésime</option>
                            <option value="parker" ${state.sortBy === 'parker' ? 'selected' : ''}>Tri : Parker</option>
                            <option value="vivino" ${state.sortBy === 'vivino' ? 'selected' : ''}>Tri : Vivino</option>
                        </select>
                    </div>

                    <!-- FILTRE CAVES -->
                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                        <button onclick="setCaveFilter('all')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0 transition ${state.selectedCaveFilter === 'all' ? 'bg-bordeaux text-white' : 'bg-card border border-borderline text-inkmuted'}">
                            Toutes les caves
                        </button>
                        ${state.caves.map(c => `
                            <button onclick="setCaveFilter('${c.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0 transition ${state.selectedCaveFilter === c.id ? 'bg-bordeaux text-white' : 'bg-card border border-borderline text-inkmuted'}">
                                ${escapeHtml(c.name)}
                            </button>
                        `).join('')}
                    </div>

                    <!-- FILTRE COULEURS -->
                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                        ${['all', 'Rouge', 'Blanc', 'Rosé', 'Champagne'].map(col => `
                            <button onclick="setColorFilter('${col}')" class="px-3 py-1 rounded-full text-[11px] font-medium shrink-0 flex items-center gap-1.5 transition ${state.selectedColorFilter === col ? 'bg-ink text-white' : 'bg-sand text-ink'}">
                                ${col !== 'all' ? getColorDotHtml(col) : ''}
                                <span>${col === 'all' ? 'Toutes couleurs' : col}</span>
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex items-center justify-between text-xs text-inkmuted px-1">
                        <span>${items.length} cuvée${items.length > 1 ? 's' : ''} (${totalShown} bouteille${totalShown > 1 ? 's' : ''})</span>
                        <button onclick="openAddManualWineModal()" class="text-bordeaux font-semibold">+ Ajouter</button>
                    </div>

                    <!-- LISTE DES BOUTEILLES -->
                    <div class="space-y-3">
                        ${items.length === 0 ? `
                            <div class="bg-card rounded-3xl p-8 border border-borderline text-center space-y-2">
                                <i class="ph ph-wine text-3xl text-inkmuted"></i>
                                <p class="text-sm font-medium text-ink">Aucune bouteille trouvée</p>
                                <p class="text-xs text-inkmuted">Modifiez vos filtres ou scannez une nouvelle étiquette.</p>
                            </div>
                        ` : items.map(({ wine, qty, stocks, mat }) => `
                            <div class="bg-card rounded-2xl p-3.5 border border-borderline shadow-xs space-y-2.5">
                                <div onclick="openWineDetailModal('${wine.id}')" class="flex gap-3 cursor-pointer">
                                    ${wine.photo ? `
                                        <img src="${wine.photo}" alt="${escapeHtml(wine.name)}" class="w-16 h-20 rounded-xl object-cover border border-borderline shrink-0">
                                    ` : `
                                        <div class="w-16 h-20 rounded-xl bg-sand border border-borderline flex flex-col items-center justify-center shrink-0 text-bordeaux">
                                            <i class="ph-fill ph-wine text-2xl"></i>
                                            <span class="text-[10px] font-bold mt-0.5">${wine.vintage || 'NM'}</span>
                                        </div>
                                    `}
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-start justify-between gap-2">
                                            <div class="flex items-center gap-1.5 min-w-0">
                                                ${getColorDotHtml(wine.color)}
                                                <h3 class="font-serif text-lg font-bold text-ink leading-snug truncate">${escapeHtml(wine.name)}</h3>
                                            </div>
                                            <span class="px-2 py-0.5 rounded-lg bg-bordeaux/10 text-bordeaux font-bold text-xs shrink-0">${qty} btl</span>
                                        </div>
                                        <p class="text-xs text-inkmuted truncate">${wine.vintage || 'Non millésimé'} • ${escapeHtml(wine.appellation || wine.domain || '')}</p>
                                        <div class="flex flex-wrap items-center gap-1.5 mt-2">
                                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${mat.badgeClass}">${mat.label}</span>
                                            <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-sand text-ink border border-borderline">${escapeHtml(getOpeningAdvice(wine).shortLabel)}</span>
                                            ${wine.parkerScore ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200">RP ${escapeHtml(wine.parkerScore)}</span>` : ''}
                                            ${wine.vivinoScore ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-rose-50 text-rose-900 border border-rose-200">★ ${escapeHtml(wine.vivinoScore)}</span>` : ''}
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-2 border-t border-borderline/70 flex items-center justify-between gap-2 text-xs">
                                    <div class="flex flex-wrap items-center gap-1.5 text-[11px] text-inkmuted min-w-0">
                                        ${stocks.map(s => `<span class="px-2 py-0.5 rounded-md bg-sand text-ink font-medium">${escapeHtml(getCaveName(s.caveId))}: ${s.quantity}</span>`).join('')}
                                        <span class="font-semibold text-gold-dark ml-1">${formatEuro(wine.estimatedPrice)}/btl</span>
                                    </div>
                                    <div class="flex items-center gap-1.5 shrink-0">
                                        <button onclick="quickAddBottle('${wine.id}')" title="Ajouter 1 bouteille" class="w-8 h-8 rounded-xl bg-sand border border-borderline text-ink font-bold flex items-center justify-center active:scale-90 transition">+1</button>
                                        <button onclick="openConsumeModal('${wine.id}')" class="px-3 h-8 rounded-xl bg-bordeaux text-white font-semibold text-xs flex items-center gap-1 active:scale-95 transition">
                                            <span>Sortir</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
        }

        // =========================================================================
        // 7. FICHE DÉTAILLÉE, ÉDITION MULTI-CAVES, AJOUT RAPIDE & SORTIE MOTIVÉE
        // =========================================================================
        function quickAddBottle(wineId) {
            const targetCave = state.selectedCaveFilter !== 'all'
                ? state.selectedCaveFilter
                : (getWineStockEntries(wineId)[0]?.caveId || state.caves[0].id);

            let st = state.stockEntries.find(s => s.wineId === wineId && s.caveId === targetCave);
            if (st) {
                st.quantity = Number(st.quantity) + 1;
            } else {
                state.stockEntries.push({
                    id: 'st_' + Date.now(),
                    wineId,
                    caveId: targetCave,
                    quantity: 1
                });
            }
            saveState();
            renderApp();
            showToast(`+1 bouteille ajoutée (${getCaveName(targetCave)})`);
        }

        function openWineDetailModal(wineId) {
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;
            const stocks = getWineStockEntries(wineId);
            const totalQty = getWineTotalBottles(wineId);
            const mat = getMaturityInfo(wine);

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-2">
                            ${getColorDotHtml(wine.color)}
                            <span class="text-xs font-semibold uppercase tracking-wider text-bordeaux">${escapeHtml(wine.color)}</span>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-sand flex items-center justify-center text-ink">✕</button>
                    </div>

                    <div class="flex gap-3.5 items-start">
                        ${wine.photo ? `
                            <img src="${wine.photo}" onclick="openPhotoZoom('${wine.photo}')" alt="Étiquette" class="w-24 h-32 rounded-2xl object-cover border border-borderline shadow-xs cursor-zoom-in shrink-0">
                        ` : ''}
                        <div class="min-w-0 flex-1">
                            <h2 class="font-serif text-2xl font-bold text-ink leading-tight">${escapeHtml(wine.name)}</h2>
                            <p class="text-sm text-inkmuted mt-0.5">${escapeHtml(wine.domain || '')}</p>
                            <p class="text-xs font-semibold text-bordeaux mt-1">${wine.vintage || 'Non millésimé'} • ${escapeHtml(wine.appellation || '')}</p>
                            <span class="inline-block mt-2 text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${mat.badgeClass}">${mat.label}</span>
                        </div>
                    </div>

                    <div class="bg-amber-50/80 border border-amber-200/80 rounded-2xl p-3">
                        <p class="text-[11px] font-bold text-amber-950 uppercase tracking-wide">Ouverture en avance</p>
                        <p class="text-xs font-semibold text-bordeaux mt-0.5">${escapeHtml(getOpeningAdvice(wine).shortLabel)}</p>
                        <p class="text-xs text-ink mt-0.5 leading-relaxed">${escapeHtml(getOpeningAdvice(wine).detail)}</p>
                    </div>

                    <div class="grid grid-cols-3 gap-2 bg-sand/70 p-3 rounded-2xl border border-borderline text-center">
                        <div>
                            <p class="text-[10px] text-inkmuted uppercase">Cote unitaire</p>
                            <p class="text-sm font-bold text-ink mt-0.5">${formatEuro(wine.estimatedPrice)}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-inkmuted uppercase">Parker</p>
                            <p class="text-sm font-bold text-amber-800 mt-0.5">${escapeHtml(wine.parkerScore || '—')}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-inkmuted uppercase">Vivino</p>
                            <p class="text-sm font-bold text-rose-800 mt-0.5">${escapeHtml(wine.vivinoScore || '—')}</p>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <p class="text-xs font-semibold text-ink">Stock en cave (${totalQty} bouteille${totalQty > 1 ? 's' : ''})</p>
                        <div class="flex flex-wrap gap-2">
                            ${stocks.length ? stocks.map(s => `
                                <span class="px-3 py-1.5 rounded-xl bg-card border border-borderline text-xs font-semibold text-ink">
                                    ${escapeHtml(getCaveName(s.caveId))} : ${s.quantity} btl
                                </span>
                            `).join('') : '<span class="text-xs text-inkmuted">Aucune bouteille en stock</span>'}
                        </div>
                    </div>

                    ${wine.notes ? `

        async function refreshWineVintageWithAi(wineId) {
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;
            const name = document.getElementById('edit-name').value.trim();
            const vintage = document.getElementById('edit-vintage').value.trim();
            const appellation = document.getElementById('edit-appellation').value.trim();
            showToast('Actualisation IA en cours...');
            try {
                const prompt = `Donne au format JSON strict pour le vin "${name}" (${appellation}), millésime ${vintage || 'non millésimé'} : {"estimatedPrice": number, "parkerScore": "XX/100", "vivinoScore": "X.X/5", "drinkFrom": number, "drinkTo": number}.`;
                const txt = await callGeminiApi(prompt, null, true);
                const parsed = extractJsonFromText(txt);
                if (parsed) {
                    if (parsed.estimatedPrice) document.getElementById('edit-price').value = Number(parsed.estimatedPrice);
                    if (parsed.parkerScore) document.getElementById('edit-parker').value = parsed.parkerScore;
                    if (parsed.vivinoScore) document.getElementById('edit-vivino').value = parsed.vivinoScore;
                    if (parsed.drinkFrom) document.getElementById('edit-from').value = Number(parsed.drinkFrom);
                    if (parsed.drinkTo) document.getElementById('edit-to').value = Number(parsed.drinkTo);
                    showToast('Cote & notes mises à jour par IA');

                showToast(err.message || 'Erreur IA');

            const wine = state.wines.find(w => w.id === wineId);

            wine.name = document.getElementById('edit-name').value.trim() || wine.name;
            wine.domain = document.getElementById('edit-domain').value.trim();

            wine.vintage = Number(document.getElementById('edit-vintage').value) || '';
            wine.color = document.getElementById('edit-color').value;
            wine.estimatedPrice = Number(document.getElementById('edit-price').value) || 0;
            wine.parkerScore = document.getElementById('edit-parker').value.trim();

                const newQty = Math.max(0, Number(inp.value) || 0);
                let st = state.stockEntries.find(s => s.wineId === wine.id && s.caveId === c.id);
                if (st) {

                    state.stockEntries.push({
                        id: 'st_' + Date.now() + '_' + c.id,
                        wineId: wine.id,
                        caveId: c.id,
                        quantity: newQty

            });

            saveState();
            closeModal();
            renderApp();
            showToast('Fiche mise à jour');

        function createLightweightThumbnail(dataUrl, maxSide = 640, quality = 0.76) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width;
                    let h = img.height;
                    if (w > maxSide || h > maxSide) {
                        if (w > h) {
                            h = Math.round((h * maxSide) / w);
                            w = maxSide;
                        } else {
                            w = Math.round((w * maxSide) / h);
                            h = maxSide;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        async function handleImageUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';

            if (!(state.apiKey || '').trim()) {
                openSettingsModal();
                showToast('Configurez d’abord votre clé API Gemini');
                return;
            }

            openModal(`
                <div class="py-10 text-center space-y-3">
                    <div class="w-12 h-12 rounded-full border-4 border-bordeaux border-t-transparent animate-spin mx-auto"></div>
                    <p class="font-serif text-xl font-bold text-bordeaux">Analyse de l’étiquette par l’IA...</p>
                    <p class="text-xs text-inkmuted">Identification du château, millésime, cote et notes Parker/Vivino</p>
                </div>
            `);

            try {
                const rawDataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('Impossible de lire l’image'));
                    reader.readAsDataURL(file);
                });

                const compressedDataUrl = await createLightweightThumbnail(rawDataUrl, 640, 0.76);
                const base64Data = compressedDataUrl.split(',')[1];

                const prompt = `Analyse cette photo de bouteille(s) de vin. Identifie chaque cuvée visible et renvoie STRICTEMENT un objet JSON au format :
{
  "bottles": [
    {
      "name": "Nom complet de la cuvée",
      "domain": "Château ou Domaine",
      "vintage": 2018,
      "color": "Rouge" | "Blanc" | "Rosé" | "Champagne",
      "appellation": "Appellation exacte",
      "quantity": 1,
      "estimatedPrice": 45,
      "parkerScore": "92/100",
      "vivinoScore": "4.2/5",
      "drinkFrom": 2024,
      "drinkTo": 2032,
      "notes": "Courte note de dégustation"
    }
  ]
}`;

                const aiText = await callGeminiApi(prompt, { base64Data, mimeType: 'image/jpeg' }, true);
                const parsed = extractJsonFromText(aiText);
                const bottles = Array.isArray(parsed?.bottles) ? parsed.bottles : (parsed?.name ? [parsed] : []);

                if (!bottles.length) {
                    closeModal();
                    showToast('Aucune étiquette reconnue sur cette photo');
                    return;
                }

                state.pendingScanBatch = {
                    photo: compressedDataUrl,
                    caveId: state.selectedCaveFilter !== 'all' ? state.selectedCaveFilter : state.caves[0].id,
                    bottles: bottles.map(b => ({
                        name: b.name || 'Vin détecté',
                        domain: b.domain || '',
                        vintage: Number(b.vintage) || '',
                        color: ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(b.color) ? b.color : 'Rouge',
                        appellation: b.appellation || '',
                        quantity: Math.max(1, Number(b.quantity) || 1),
                        estimatedPrice: Number(b.estimatedPrice) || 0,
                        parkerScore: b.parkerScore || '',
                        vivinoScore: b.vivinoScore || '',
                        drinkFrom: Number(b.drinkFrom) || CURRENT_YEAR,
                        drinkTo: Number(b.drinkTo) || (CURRENT_YEAR + 6),
                        notes: b.notes || ''
                    }))
                };

                renderScanValidationModal();
            } catch (err) {
                closeModal();
                showToast(err.message || 'Erreur lors de l’analyse photo');
            }
        }

        function findOrCreateWineAndAddStock(wineData, caveId, qty) {
            let existing = state.wines.find(w =>
                w.name.toLowerCase() === (wineData.name || '').toLowerCase() &&
                String(w.vintage || '') === String(wineData.vintage || '')
            );

            if (!existing) {
                existing = {
                    id: 'wine_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: wineData.name,
                    domain: wineData.domain || '',
                    vintage: wineData.vintage || '',
                    color: wineData.color || 'Rouge',
                    appellation: wineData.appellation || '',
                    estimatedPrice: Number(wineData.estimatedPrice) || 0,
                    parkerScore: wineData.parkerScore || '',
                    vivinoScore: wineData.vivinoScore || '',
                    drinkFrom: Number(wineData.drinkFrom) || CURRENT_YEAR,
                    drinkTo: Number(wineData.drinkTo) || (CURRENT_YEAR + 6),
                    notes: wineData.notes || '',
                    photo: wineData.photo || ''
                };
                state.wines.unshift(existing);
            } else if (wineData.photo && !existing.photo) {
                existing.photo = wineData.photo;
            }

            let st = state.stockEntries.find(s => s.wineId === existing.id && s.caveId === caveId);
            if (st) {
                st.quantity = Number(st.quantity) + Number(qty);
            } else {
                state.stockEntries.push({
                    id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    wineId: existing.id,
                    caveId,
                    quantity: Number(qty)
                });
            }
        }

        function startVoiceInputForSommelier() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                showToast('Dictée vocale non supportée sur ce navigateur');
                return;
            }
            const rec = new SpeechRec();
            rec.lang = 'fr-FR';
            rec.onresult = (e) => {
                const transcript = e.results?.[0]?.[0]?.transcript;
                if (transcript) {
                    const inp = document.getElementById('sommelier-input');
                    if (inp) inp.value = transcript;
                    sendSommelierMessage();
                }
            };
            rec.onerror = () => showToast('Micro indisponible');
            rec.start();
            showToast('Parlez maintenant...');
        }

        async function sendSommelierMessage() {
            const inp = document.getElementById('sommelier-input');
            const text = (inp?.value || '').trim();
            if (!text) return;

            if (!(state.apiKey || '').trim()) {
                openSettingsModal();
                showToast('Ajoutez votre clé API Gemini pour utiliser le Sommelier');
                return;
            }

            inp.value = '';
            state.chatMessages.push({ role: 'user', text });
            state.chatMessages.push({ role: 'assistant', text: 'Réflexion en cours...' });
            renderApp();

            try {
                const cellarSummary = state.wines.map(w => {
                    const stocks = getWineStockEntries(w.id);
                    if (!stocks.length) return null;
                    const loc = stocks.map(s => `${getCaveName(s.caveId)}: ${s.quantity} btl`).join(', ');
                    const mat = getMaturityInfo(w);
                    const opening = getOpeningAdvice(w).shortLabel;
                    const extra = [
                        w.parkerScore ? `Parker ${w.parkerScore}` : '',
                        w.vivinoScore ? `Vivino ${w.vivinoScore}` : '',
                        w.notes ? `Note perso: "${w.notes}"` : ''
                    ].filter(Boolean).join(' | ');
                    return `- ${w.name} (${w.vintage || 'NM'}, ${w.color}, ${w.appellation || w.domain || ''}) | Stock: [${loc}] | Statut (${CURRENT_YEAR}): ${mat.label} | Service: ${opening} | Cote: ${w.estimatedPrice || 0}€${extra ? ' | ' + extra : ''}`;
                }).filter(Boolean).join('\n');

                const recentHistory = state.historyEntries.slice(0, 12).map(h =>
                    `- ${h.date} : ${h.wineName} (${h.vintage || 'NM'}, ${h.color}) [${h.reason || 'Bu'}]${h.note ? ` -> "${h.note}"` : ''}`
                ).join('\n');

                const sysPrompt = `Tu es le Chef Sommelier personnel et agent IA de l'utilisateur (année en cours : ${CURRENT_YEAR}).
RÈGLES D'INTERACTION :
1. Tiens STRICTEMENT compte de tout l'historique de la conversation en cours : si l'utilisateur écarte une bouteille, précise le nombre de convives, la cave où il se trouve (Saint-Cloud ou Carqueiranne), son budget ou un ingrédient, adapte immédiatement tes propositions sans jamais reproposer une cuvée déjà refusée.
2. Appuie-toi UNIQUEMENT sur les bouteilles réellement disponibles en stock ci-dessous (en précisant toujours dans quelle cave elles se trouvent, leur fenêtre d'apogée et s'il faut les ouvrir/carafer en avance).
3. Utilise aussi ses dégustations passées et ses notes personnelles pour cerner ses goûts.
4. Sois chaleureux, concis, précis et termine par une courte question interactive pour affiner le choix avec lui.

INVENTAIRE ACTUEL EN CAVE :
${cellarSummary || 'Cave actuellement vide.'}

DERNIÈRES BOUTEILLES DÉGUSTÉES / SORTIES :
${recentHistory || 'Aucun historique enregistré.'}`;

                const validTurns = state.chatMessages
                    .slice(1, -1)
                    .slice(-20)
                    .filter(m => m.text && !m.text.startsWith('Désolé, impossible de répondre'));

                while (validTurns.length > 0 && validTurns[0].role !== 'user') {
                    validTurns.shift();
                }

                const historyContents = validTurns.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.text }]
                }));

                const reply = await callGeminiChat(sysPrompt, historyContents);
                state.chatMessages[state.chatMessages.length - 1] = { role: 'assistant', text: reply };
                saveState();
                renderApp();
            } catch (err) {
                state.chatMessages[state.chatMessages.length - 1] = {
                    role: 'assistant',
                    text: `Désolé, impossible de répondre pour le moment : ${err.message}`
                };
                renderApp();
            }
        }

        async function detectBestGeminiModel(cleanKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`;
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) {
                throw new Error(formatGeminiApiError(res.status, data?.error?.message));
            }
            const models = (data.models || [])
                .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
                .map(m => m.name.replace(/^models\//, ''));

            const preferred = [
                'gemini-2.5-flash-lite',
                'gemini-2.5-flash',
                'gemini-3-flash-preview'
            ];
            for (const p of preferred) {
                if (models.includes(p)) return p;
            }
            const anyFlash = models.find(m => m.includes('flash') && !m.includes('image') && !m.includes('audio'));
            return anyFlash || models[0] || 'gemini-2.5-flash';
        }

                if (statusEl) {

        function extractJsonFromText(text) {
            if (!text) return null;
            const cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try { return JSON.parse(cleaned); } catch (_) {}
            const match = cleaned.match(/\{[\s\S]*\}/);
            if (match) {
                try { return JSON.parse(match[0]); } catch (_) {}
            }
            return null;
        }

        function sleepMs(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function formatGeminiApiError(status, rawMessage) {
            const msg = String(rawMessage || '');
            if (status === 429 || /quota|rate|resource_exhausted|too many/i.test(msg)) {
                return 'Quota gratuit Gemini temporairement atteint (trop de demandes/min). Patientez 30 secondes et réessayez.';
            }
            if (status === 400 && /api key/i.test(msg)) {
                return 'Clé API Gemini invalide. Vérifiez-la dans Paramètres.';
            }
            return msg || `Erreur Gemini (HTTP ${status})`;
        }

        async function callGeminiApi(prompt, imageObj = null, expectJson = false) {
            const cleanKey = (state.apiKey || '').trim().replace(/\s+/g, '');
            if (!cleanKey) throw new Error('Clé API manquante');

            if (!state.cachedWorkingModel) {
                try {
                    state.cachedWorkingModel = await detectBestGeminiModel(cleanKey);
                    saveState();
                } catch (_) {}
            }

            const modelsToTry = Array.from(new Set([
                state.cachedWorkingModel,
                'gemini-2.5-flash-lite',
                'gemini-2.5-flash',
                'gemini-3-flash-preview'
            ].filter(Boolean)));

            const parts = [{ text: prompt }];
            const imgData = imageObj?.base64Data || imageObj?.base64;
            if (imgData) {
                parts.push({
                    inlineData: {
                        mimeType: imageObj.mimeType || 'image/jpeg',
                        data: imgData
                    }
                });
            }

            let lastErr = null;
            for (const model of modelsToTry) {
                for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                        const genConfig = { temperature: 0.2 };
                        if (expectJson) genConfig.responseMimeType = 'application/json';

                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts }],
                                generationConfig: genConfig
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            const rawMsg = data?.error?.message || '';
                            lastErr = new Error(formatGeminiApiError(res.status, rawMsg));
                            if ((res.status === 429 || res.status === 503) && attempt === 0) {
                                await sleepMs(1800);
                                continue;
                            }
                            break;
                        }
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            state.cachedWorkingModel = model;
                            saveState();
                            return text;
                        }
                    } catch (e) {
                        lastErr = e;
                        if (attempt === 0) await sleepMs(1200);
                    }
                }
            }
            throw lastErr || new Error('Impossible de joindre Gemini');
        }
