        // =========================================================================
        // 13. EXPORT & IMPORT CSV EXCEL COMPLET (RFC 4180 + SYNCHRONISATION SANS DOUBLON)
        // =========================================================================
        function sanitizeCsvCell(val) {
            const str = String(val ?? '').replace(/[\r\n]+/g, ' ').replace(/"/g, '""');
            return `"${str}"`;
        }

        function parseCsvLine(line, sep) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === sep && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        function exportCellarToExcelCsv() {
            const headers = [
                'Statut', 'Cave', 'Cuvée', 'Domaine', 'Millésime', 'Couleur',
                'Appellation', 'Quantité', 'Prix Unitaire (€)', 'Valeur Totale (€)',
                'Parker', 'Vivino', 'Apogée Début', 'Apogée Fin', 'Date Sortie', 'Notes'
            ];
            const rows = [headers.map(sanitizeCsvCell).join(';')];

            state.wines.forEach(w => {
                const stocks = state.stockEntries.filter(s => s.wineId === w.id && s.quantity > 0);
                if (stocks.length === 0) {
                    rows.push([
                        'En cave (0)', getCaveName(state.caves[0].id), w.name, w.domain, w.vintage, w.color,
                        w.appellation, 0, w.estimatedPrice || 0, 0,
                        w.parkerScore, w.vivinoScore, w.drinkFrom, w.drinkTo, '', w.notes
                    ].map(sanitizeCsvCell).join(';'));
                } else {
                    stocks.forEach(st => {
                        const qty = Number(st.quantity) || 0;
                        const price = Number(w.estimatedPrice) || 0;
                        rows.push([
                            'En cave', getCaveName(st.caveId), w.name, w.domain, w.vintage, w.color,
                            w.appellation, qty, price, qty * price,
                            w.parkerScore, w.vivinoScore, w.drinkFrom, w.drinkTo, '', w.notes
                        ].map(sanitizeCsvCell).join(';'));
                    });
                }
            });

            state.historyEntries.forEach(h => {
                const qty = Number(h.quantity) || 1;
                const price = Number(h.unitPrice) || 0;
                const statusLabel = `Historique (${h.reason || 'Bu / Dégusté'})`;
                rows.push([
                    statusLabel, h.caveName, h.wineName, '', h.vintage, h.color,
                    '', qty, price, qty * price,
                    h.parkerScore, h.vivinoScore, '', '', h.date, h.note
                ].map(sanitizeCsvCell).join(';'));
            });

            const csvContent = '\uFEFFsep=;\n' + rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Vin_sur_Vin_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 800);

            showToast(`Export Excel prêt (${rows.length - 1} lignes)`);
        }

        function setOrCreateWineStockFromCsv(wineData, caveId, exactQty) {
            let existing = state.wines.find(w =>
                w.name.toLowerCase() === (wineData.name || '').toLowerCase() &&
                String(w.vintage || '') === String(wineData.vintage || '')
            );

            if (!existing) {
                existing = {
                    id: 'wine_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: wineData.name,
                    domain: wineData.domain || '',
                    vintage: wineData.vintage || '',
                    color: wineData.color || 'Rouge',
                    appellation: wineData.appellation || '',
                    estimatedPrice: Number(wineData.estimatedPrice) || 0,
                    parkerScore: wineData.parkerScore || '',
                    vivinoScore: wineData.vivinoScore || '',
                    drinkFrom: Number(wineData.drinkFrom) || CURRENT_YEAR,
                    drinkTo: Number(wineData.drinkTo) || (CURRENT_YEAR + 6),
                    notes: wineData.notes || '',
                    photo: ''
                };
                state.wines.unshift(existing);
            } else {
                if (wineData.domain) existing.domain = wineData.domain;
                if (wineData.appellation) existing.appellation = wineData.appellation;
                if (wineData.estimatedPrice) existing.estimatedPrice = Number(wineData.estimatedPrice);
                if (wineData.parkerScore) existing.parkerScore = wineData.parkerScore;
                if (wineData.vivinoScore) existing.vivinoScore = wineData.vivinoScore;
                if (wineData.drinkFrom) existing.drinkFrom = Number(wineData.drinkFrom);
                if (wineData.drinkTo) existing.drinkTo = Number(wineData.drinkTo);
                if (wineData.notes) existing.notes = wineData.notes;
            }

            let st = state.stockEntries.find(s => s.wineId === existing.id && s.caveId === caveId);
            if (st) {
                st.quantity = Math.max(0, Number(exactQty) || 0);
            } else if (exactQty > 0) {
                state.stockEntries.push({
                    id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    wineId: existing.id,
                    caveId,
                    quantity: Math.max(0, Number(exactQty) || 0)
                });
            }
        }

        function handleExcelCsvImport(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const buffer = e.target.result;
                    let text = new TextDecoder('utf-8').decode(buffer);
                    if (text.includes('\uFFFD')) {
                        text = new TextDecoder('windows-1252').decode(buffer);
                    }
                    text = text.replace(/^\uFEFF/, '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim() && !/^sep\s*=/i.test(l.trim()));
                    if (lines.length < 2) { showToast('Fichier CSV vide'); return; }

                    const sep = lines[0].includes(';') ? ';' : ',';
                    let importedCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const cols = parseCsvLine(lines[i], sep);
                        if (cols.length < 8) continue;

                        const [statut, caveName, cuvee, domaine, millesime, couleur, appellation, qtyStr, priceStr, , parker, vivino, drinkFrom, drinkTo, dateSortie, notes] = cols;
                        if (!cuvee) continue;

                        let cave = state.caves.find(c => c.name.toLowerCase() === (caveName || '').toLowerCase());
                        if (!cave && caveName) {
                            cave = { id: 'cave_' + Date.now() + '_' + i, name: caveName, subtitle: 'Importée' };
                            state.caves.push(cave);
                        }
                        const targetCaveId = cave ? cave.id : state.caves[0].id;
                        const qty = Number(qtyStr) || 0;
                        const price = Number(priceStr) || 0;

                        if ((statut || '').toLowerCase().includes('historique')) {
                            const reasonMatch = (statut || '').match(/\(([^)]+)\)/);
                            const extractedReason = reasonMatch ? reasonMatch[1] : 'Bu / Dégusté';
                            const exists = state.historyEntries.some(h => h.wineName === cuvee && h.date === dateSortie && String(h.vintage) === String(millesime));
                            if (!exists) {
                                state.historyEntries.push({
                                    id: 'hist_imp_' + Date.now() + '_' + i,
                                    date: dateSortie || new Date().toISOString().slice(0, 10),
                                    reason: extractedReason,
                                    wineName: cuvee,
                                    vintage: millesime || '',
                                    color: couleur || 'Rouge',
                                    caveName: caveName || getCaveName(targetCaveId),
                                    quantity: qty || 1,
                                    unitPrice: price,
                                    parkerScore: parker || '',
                                    vivinoScore: vivino || '',
                                    note: notes || ''
                                });
                                importedCount++;
                            }
                        } else {
                            setOrCreateWineStockFromCsv({
                                name: cuvee,
                                domain: domaine || '',
                                vintage: Number(millesime) || '',
                                color: couleur || 'Rouge',
                                appellation: appellation || '',
                                estimatedPrice: price,
                                parkerScore: parker || '',
                                vivinoScore: vivino || '',
                                drinkFrom: Number(drinkFrom) || CURRENT_YEAR,
                                drinkTo: Number(drinkTo) || (CURRENT_YEAR + 6),
                                notes: notes || ''
                            }, targetCaveId, qty);
                            importedCount++;
                        }
                    }

                    saveState();
                    closeModal();
                    renderApp();
                    showToast(`${importedCount} ligne(s) synchronisée(s) depuis Excel`);
                } catch (err) {
                    showToast('Erreur de lecture du fichier CSV');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // =========================================================================
        // 14. INITIALISATION ASYNCHRONE INDEXEDDB + RENDU IMMÉDIAT
        // =========================================================================
        async function initVinSurVinApp() {
            renderApp();
            const idbState = await readFromIndexedDB();
            if (idbState) {
                state = normalizeLoadedState(idbState);
                renderApp();
            } else {
                await writeToIndexedDB(state);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVinSurVinApp);
        } else {
            initVinSurVinApp();
        }
    </script>
