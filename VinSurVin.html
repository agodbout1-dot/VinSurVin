        // 1. CONSTANTS, ICON GENERATOR & PERSISTENT STATE

        const STORAGE_KEY = 'vin_sur_vin_ago_v2';
        const LEGACY_KEYS = ['vin_sur_vin_ago_v1', 'vinSurVinState'];
        const CURRENT_YEAR = new Date().getFullYear();
        let memoryFallbackStorage = {};

        function safeStorageGet(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (_) {
                return memoryFallbackStorage[key] || null;
            }
        }

        function safeStorageSet(key, val) {
            memoryFallbackStorage[key] = val;
            try {
                window.localStorage.setItem(key, val);
            } catch (_) {}
        }

        function applyAppIcon(overrideUrl = null, styleOverride = null) {
            try {
                const chosenStyle = styleOverride || (typeof state !== 'undefined' ? state.iconStyle : null) || 'glass-gold';
                const customUrl = overrideUrl || (typeof state !== 'undefined' ? state.customIconDataUrl : null);

                if (chosenStyle === 'custom' && customUrl) {
                    const appleIcon = document.getElementById('apple-touch-icon');
                    const favIcon = document.getElementById('favicon-link');
                    if (appleIcon) appleIcon.href = customUrl;
                    if (favIcon) favIcon.href = customUrl;
                    return customUrl;
                }

                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                if (!ctx) return '';

                const grad = ctx.createLinearGradient(0, 0, 512, 512);
                if (chosenStyle === 'ivory-bordeaux') {
                    grad.addColorStop(0, '#FBF9F5');
                    grad.addColorStop(1, '#EFE6D5');
                } else if (chosenStyle === 'noir-gold') {
                    grad.addColorStop(0, '#241E1C');
                    grad.addColorStop(1, '#120F0E');
                } else if (chosenStyle === 'champagne-gold') {
                    grad.addColorStop(0, '#DFC388');
                    grad.addColorStop(1, '#9E7B38');
                } else if (chosenStyle === 'vineyard-crest') {
                    grad.addColorStop(0, '#4A1221');
                    grad.addColorStop(1, '#260810');
                } else {
                    grad.addColorStop(0, '#6B1D32');
                    grad.addColorStop(1, '#360D18');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                const accentColor = chosenStyle === 'ivory-bordeaux'
                    ? '#5C1A2B'
                    : (chosenStyle === 'champagne-gold' ? '#1E1A18' : '#DFC388');
                const borderColor = chosenStyle === 'champagne-gold' ? '#5C1A2B' : '#C5A059';

                const drawRoundedRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 6;
                drawRoundedRect(64, 64, 384, 384, 72);
                ctx.stroke();

                ctx.lineWidth = 2;
                ctx.save();
                ctx.globalAlpha = 0.55;
                drawRoundedRect(82, 82, 348, 348, 58);
                ctx.stroke();
                ctx.restore();

                if (chosenStyle === 'monogram-ago') {
                    ctx.fillStyle = accentColor;
                    ctx.font = 'italic 700 132px "Cormorant Garamond", Georgia, serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('V·V', 256, 224);

                    ctx.fillStyle = borderColor;
                    ctx.font = '700 28px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('BY AGO', 256, 326);
                } else {
                    ctx.strokeStyle = accentColor;
                    ctx.fillStyle = accentColor;
                    ctx.lineWidth = 13;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    ctx.beginPath();
                    ctx.moveTo(182, 134);
                    ctx.lineTo(330, 134);
                    ctx.bezierCurveTo(330, 214, 294, 250, 256, 254);
                    ctx.bezierCurveTo(218, 250, 182, 214, 182, 134);
                    ctx.stroke();

                    ctx.save();
                    ctx.globalAlpha = 0.25;
                    ctx.beginPath();
                    ctx.moveTo(192, 186);
                    ctx.lineTo(320, 186);
                    ctx.bezierCurveTo(314, 226, 286, 246, 256, 250);
                    ctx.bezierCurveTo(226, 246, 198, 226, 192, 186);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    ctx.beginPath();
                    ctx.moveTo(256, 254);
                    ctx.lineTo(256, 360);
                    ctx.moveTo(204, 362);
                    ctx.lineTo(308, 362);
                    ctx.stroke();
                }

                const dataUrl = canvas.toDataURL('image/png');
                const appleIcon = document.getElementById('apple-touch-icon');
                const favIcon = document.getElementById('favicon-link');
                if (appleIcon) appleIcon.href = dataUrl;
                if (favIcon) favIcon.href = dataUrl;
                return dataUrl;
            } catch (err) {
                return '';
            }
        }

                    {

                    }
                ]

        }

        function loadState() {
            const def = createDefaultState();
            try {
                let raw = safeStorageGet(STORAGE_KEY);
                if (!raw) {
                    for (const k of LEGACY_KEYS) {
                        const legacy = safeStorageGet(k);
                        if (legacy) {
                            raw = legacy;
                            break;
                        }
                    }
                }
                if (!raw) return def;
                const parsed = JSON.parse(raw);
                return {
                    ...def,
                    ...parsed,
                    caves: Array.isArray(parsed.caves) && parsed.caves.length ? parsed.caves : def.caves,
                    wines: Array.isArray(parsed.wines) ? parsed.wines : def.wines,
                    stockEntries: Array.isArray(parsed.stockEntries) ? parsed.stockEntries : def.stockEntries,
                    historyEntries: Array.isArray(parsed.historyEntries) ? parsed.historyEntries : def.historyEntries,
                    sommelierMessages: Array.isArray(parsed.sommelierMessages) && parsed.sommelierMessages.length ? parsed.sommelierMessages : def.sommelierMessages
                };
            } catch (e) {
                return def;
            }
        }

        let state = loadState();

        function saveState() {
            try {
                safeStorageSet(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Erreur sauvegarde:', e);
            }
        }

        // =========================================================================
        // 2. HELPERS & UTILITIES
        // =========================================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const label = document.getElementById('toast-msg');
            if (!toast || !label) return;
            label.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeHtmlAttr(str) {
            return escapeHtml(str).replace(/'/g, '&#39;');
        }

        function parseNumericScore(rawScore) {
            if (!rawScore) return -1;
            const match = String(rawScore).replace(',', '.').match(/(\d+(?:\.\d+)?)/);
            return match ? parseFloat(match[1]) : -1;
        }

        function parseCsvLineSemicolon(line) {
            const cols = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === ';' && !inQuotes) {
                    cols.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            cols.push(current.trim());
            return cols;
        }

        function getColorBadgeClass(color) {
            switch (color) {
                case 'Rouge': return 'bg-bordeaux/10 text-bordeaux border-bordeaux/20';
                case 'Blanc': return 'bg-amberlight text-amberwine border-gold/40';
                case 'Rosé': return 'bg-rose-50 text-rose-700 border-rose-200';
                case 'Champagne': return 'bg-gold/15 text-amberwine border-gold/40';
                default: return 'bg-cream text-inkmuted border-sand';
            }
        }

        function getReadinessStatus(wine) {
            const from = Number(wine.drinkFrom) || CURRENT_YEAR;
            const to = Number(wine.drinkTo) || (CURRENT_YEAR + 5);
            if (CURRENT_YEAR > to) {
                return { label: `Maturité dépassée (${to}) · À boire vite`, shortLabel: 'Maturité dépassée · À boire vite', tone: 'rose', ready: true, priority: 0 };
            }
            if (CURRENT_YEAR < from) {
                return { label: `À garder (${from})`, shortLabel: `À garder (${from})`, tone: 'amber', ready: false, priority: 2 };
            }
            return { label: 'À point', shortLabel: 'À point', tone: 'sage', ready: true, priority: 1 };
        }

        function getCellarMetrics() {
            let totalBottles = 0;
            let totalValue = 0;
            let readyCount = 0;

            state.stockEntries.forEach(entry => {
                const qty = Number(entry.qty) || 0;
                if (qty <= 0) return;
                const wine = state.wines.find(w => w.id === entry.wineId);
                if (!wine) return;
                const unitPrice = Number(wine.price?.average) || Number(entry.purchasePrice) || 0;
                totalBottles += qty;
                totalValue += qty * unitPrice;
                if (getReadinessStatus(wine).ready) {
                    readyCount += qty;
                }
            });

            const totalCapacity = state.caves.reduce((sum, c) => sum + (Number(c.capacity) || 0), 0);
            return { totalBottles, totalValue, readyCount, totalCapacity };
        }

        // =========================================================================
        // 3. GEMINI AI SERVICE (VISION + TEXT + WEB GROUNDING)
        // =========================================================================
        function extractJsonFromText(rawText) {
            if (!rawText) throw new Error('Réponse vide du modèle IA');
            const cleaned = rawText.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
            try {
                return JSON.parse(cleaned);
            } catch (_) {
                const firstBrace = cleaned.indexOf('{');
                const firstBracket = cleaned.indexOf('[');
                let start = -1;
                let end = -1;
                if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
                    start = firstBracket;
                    end = cleaned.lastIndexOf(']');
                } else if (firstBrace !== -1) {
                    start = firstBrace;
                    end = cleaned.lastIndexOf('}');
                }
                if (start !== -1 && end > start) {
                    return JSON.parse(cleaned.slice(start, end + 1));
                }
                throw new Error('Format JSON non reconnu dans la réponse IA');
            }
        }

        async function callGeminiApi({ prompt, imageBase64 = null, mimeType = 'image/jpeg', useSearch = false }) {
            const key = (state.apiKey || '').trim();
            if (!key) {
                throw new Error('Clé API Gemini manquante. Ajoutez-la dans les Paramètres (en haut à droite).');
            }

            const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
            let lastError = null;

            for (const model of models) {
                try {
                    const parts = [{ text: prompt }];
                    if (imageBase64) {
                        parts.push({
                            inlineData: {
                                mimeType,
                                data: imageBase64
                            }
                        });
                    }

                    const body = {
                        contents: [{ role: 'user', parts }],
                        generationConfig: {
                            temperature: 0.25,
                            maxOutputTokens: 2048
                        }
                    };
                    if (useSearch) {
                        body.tools = [{ googleSearch: {} }];
                    }

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data?.error?.message || `Erreur HTTP ${res.status}`);
                    }
                    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n').trim();
                    if (!text) throw new Error('Réponse vide de Gemini');
                    return text;
                } catch (err) {
                    lastError = err;
                }
            }
            throw lastError || new Error('Impossible de joindre Gemini.');
        }

                const active = state.currentView === tab || (tab === 'cellar' && state.currentView === 'detail');
                btn.className = `nav-btn flex flex-col items-center justify-center gap-1 cursor-pointer transition ${active ? 'text-bordeaux font-semibold' : 'text-inkmuted font-medium'}`;

            backdrop.classList.add('flex');
        }

            const backdrop = document.getElementById('modal-backdrop');
            if (!backdrop) return;
            backdrop.classList.add('hidden');

                            <i class="ph-fill ph-microphone text-lg"></i>
                        </button>
                        <input type="text" id="sommelier-input" onkeydown="if(event.key==='Enter') sendSommelierPrompt()" placeholder="Ex : Quel vin ouvrir ce soir avec un magret ?" class="flex-1 bg-transparent text-xs px-2 py-2 focus:outline-none">
                        <button onclick="sendSommelierPrompt()" class="px-3.5 py-2.5 rounded-2xl bg-bordeaux text-ivory text-xs font-semibold cursor-pointer shrink-0">
                            Envoyer
                        </button>
                    </div>
                </div>
            `;
        }

        function resetSommelierChat() {
            state.sommelierMessages = [
                {
                    role: 'assistant',
                    text: 'Bonjour ! Quel plat préparez-vous ou quelle occasion célébrez-vous ? Je vous conseille parmi les bouteilles de votre cave.'
                }
            ];
            saveState();
            renderCurrentView();
        }

        function toggleVoiceSommelier() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                showToast('Dictée vocale non supportée sur ce navigateur');
                return;
            }
            const btn = document.getElementById('voice-btn');
            const recognition = new SpeechRec();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            if (btn) btn.classList.add('voice-pulse', 'bg-bordeaux', 'text-ivory');
            showToast('Parlez maintenant...');

            recognition.onresult = (event) => {
                const transcript = event.results?.[0]?.[0]?.transcript || '';
                const input = document.getElementById('sommelier-input');
                if (input && transcript) {
                    input.value = transcript;
                    sendSommelierPrompt();
                }
            };
            recognition.onerror = () => {
                showToast('Micro interrompu');
            };
            recognition.onend = () => {
                if (btn) btn.classList.remove('voice-pulse', 'bg-bordeaux', 'text-ivory');
            };
            recognition.start();
        }

        async function sendSommelierPrompt() {
            const input = document.getElementById('sommelier-input');
            const userText = input?.value.trim();
            if (!userText) return;

            input.value = '';
            state.sommelierMessages.push({ role: 'user', text: userText });
            state.sommelierMessages.push({ role: 'assistant', text: 'Analyse de votre cave en cours...' });
            renderCurrentView();

            const cellarSummary = state.stockEntries
                .filter(s => (Number(s.qty) || 0) > 0)
                .map(s => {
                    const w = state.wines.find(x => x.id === s.wineId);
                    const c = state.caves.find(x => x.id === s.caveId);
                    if (!w) return '';
                    return `- ${w.name} ${w.vintage} (${w.color}, ${w.appellation || w.region || ''}) | Cave: ${c?.name || ''} | Qté: ${s.qty} | Apogée: ${w.drinkFrom}-${w.drinkTo} | Parker: ${w.scores?.parker || 'N/A'} | Vivino: ${w.scores?.vivino || 'N/A'} | Prix: ${w.price?.average || 0}€`;
                })
                .filter(Boolean)
                .join('\n');

            try {
                const prompt = `Tu es un chef sommelier étoilé français. Voici l'inventaire exact des caves de l'utilisateur :\n${cellarSummary || '(Cave actuellement vide)'}\n\nDemande de l'utilisateur : "${userText}"\n\nRéponds en français de manière élégante, précise et concise en recommandant en priorité 1 à 2 bouteilles réellement présentes dans sa cave (avec température de service et temps de carafage).`;
                const reply = await callGeminiApi({ prompt });
                state.sommelierMessages[state.sommelierMessages.length - 1] = { role: 'assistant', text: reply };
            } catch (err) {
                state.sommelierMessages[state.sommelierMessages.length - 1] = { role: 'assistant', text: `Erreur : ${err.message}` };
            }
            saveState();
            renderCurrentView();
        }

        function adjustStockQty(stockEntryId, delta) {
            const entry = state.stockEntries.find(s => s.id === stockEntryId);

            if (delta < 0) {
                openConsumeModal(stockEntryId);
                return;
            }

            entry.qty = (Number(entry.qty) || 0) + delta;
            saveState();
            renderCurrentView();
            showToast('+1 bouteille ajoutée au stock');
        }

        function confirmConsumeBottle(stockEntryId) {
            const entry = state.stockEntries.find(s => s.id === stockEntryId);
            if (!entry) return;
            const wine = state.wines.find(w => w.id === entry.wineId);
            if (!wine) return;

            const reason = document.getElementById('consume-reason')?.value || 'Dégustée / Bue';
            const qtyToRemove = Math.min(Number(entry.qty) || 1, Math.max(1, Number(document.getElementById('consume-qty')?.value) || 1));
            const comment = document.getElementById('consume-comment')?.value.trim() || '';

            entry.qty = Math.max(0, (Number(entry.qty) || 0) - qtyToRemove);
            if (entry.qty === 0) {
                state.stockEntries = state.stockEntries.filter(s => s.id !== stockEntryId);
            }

            if (reason !== 'DELETE_NO_HISTORY') {
                const todayStr = new Date().toLocaleDateString('fr-FR');
                const unitPrice = Number(wine.price?.average) || Number(entry.purchasePrice) || 0;
                state.historyEntries.unshift({
                    id: 'hist-' + Date.now(),
                    wineId: wine.id,
                    wineName: `${wine.name} ${wine.vintage || ''}`.trim(),
                    producer: wine.producer || '',
                    color: wine.color || 'Rouge',
                    date: todayStr,
                    reason,
                    qtyConsumed: qtyToRemove,
                    priceAtConsumption: unitPrice,
                    parkerScore: wine.scores?.parker || '',
                    vivinoScore: wine.scores?.vivino || '',
                    comment
                });
            }

            saveState();
            closeModal();
            renderCurrentView();
            showToast(reason === 'DELETE_NO_HISTORY' ? 'Bouteille retirée' : 'Ajoutée à votre Historique');
        }

        function findOrCreateWineAndAddStock({
            name, producer, appellation, region, country, vintage, color,
            grapes, classification, alcohol, imageUrl, drinkFrom, drinkPeak, drinkTo,
            parkerScore, vivinoScore, price, pairings, caveId, qty, notes
        }) {
            const norm = (s) => String(s || '').trim().toLowerCase();
            let existingWine = state.wines.find(w =>
                norm(w.name) === norm(name) &&
                norm(w.producer) === norm(producer) &&
                norm(w.vintage) === norm(vintage)
            );

            if (existingWine) {
                if (parkerScore && !existingWine.scores?.parker) {
                    existingWine.scores = { ...(existingWine.scores || {}), parker: parkerScore };
                }
                if (vivinoScore && !existingWine.scores?.vivino) {
                    existingWine.scores = { ...(existingWine.scores || {}), vivino: vivinoScore };
                }
                if (imageUrl && !existingWine.imageUrl) {
                    existingWine.imageUrl = imageUrl;
                }
                const existingEntry = state.stockEntries.find(s => s.wineId === existingWine.id && s.caveId === caveId);
                if (existingEntry) {
                    existingEntry.qty = (Number(existingEntry.qty) || 0) + qty;
                    return { merged: true };
                }
                state.stockEntries.unshift({
                    id: 'st-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                    wineId: existingWine.id,
                    caveId,
                    shelf: '',
                    row: '',
                    qty,
                    purchaseYear: CURRENT_YEAR,
                    purchasePrice: price,
                    notes: notes || ''
                });
                return { merged: false };
            }

            const wineId = 'wine-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            state.wines.unshift({
                id: wineId,
                name: name || 'Cuvée',
                producer: producer || '',
                appellation: appellation || '',
                region: region || '',
                country: country || 'France',
                vintage: vintage || 'NV',
                color: color || 'Rouge',
                grapes: grapes || '',
                classification: classification || '',
                alcohol: alcohol || '',
                imageUrl: imageUrl || '',
                drinkFrom: Number(drinkFrom) || CURRENT_YEAR,
                drinkPeak: Number(drinkPeak) || (CURRENT_YEAR + 3),
                drinkTo: Number(drinkTo) || (CURRENT_YEAR + 8),
                scores: {
                    parker: parkerScore || '',
                    vivino: vivinoScore || ''
                },
                price: { low: Math.round(price * 0.85), average: price, high: Math.round(price * 1.2) },
                tastingNotes: { eye: '', nose: '', palate: '' },
                pairings: Array.isArray(pairings) ? pairings : []
            });
            state.stockEntries.unshift({
                id: 'st-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                wineId,
                caveId,
                shelf: '',
                row: '',
                qty,
                purchaseYear: CURRENT_YEAR,
                purchasePrice: price,
                notes: notes || ''
            });
            return { merged: false };
        }

        function resizeImageToBase64(file, maxDim = 1280) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        resolve({
                            dataUrl,
                            base64: dataUrl.split(',')[1]
                        });
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

            item.producer = document.getElementById('scan-producer')?.value.trim() || '';
            item.vintage = document.getElementById('scan-vintage')?.value.trim() || 'NV';
            item.color = document.getElementById('scan-color')?.value || 'Rouge';
            item.appellation = document.getElementById('scan-appellation')?.value.trim() || '';
            item.priceAverage = Math.max(0, Number(document.getElementById('scan-price')?.value) || 45);
            item.qty = Math.max(1, Number(document.getElementById('scan-qty')?.value) || 1);
            item.parkerScore = document.getElementById('scan-parker')?.value.trim() || '';
            item.vivinoScore = document.getElementById('scan-vivino')?.value.trim() || '';
            item.caveId = document.getElementById('scan-cave')?.value || state.caves[0]?.id || 'cave-1';
        }

        function renderMultiBottleScanModal() {
            const batch = window.__scanBatch;
            if (!batch || !batch.items.length) return;
            const idx = batch.activeIndex;
            const total = batch.items.length;
            const info = batch.items[idx];
            const progressPct = Math.round(((idx + 1) / total) * 100);

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <p class="text-[10px] uppercase tracking-[0.18em] text-gold font-bold">
                                ${total > 1 ? `Bouteille ${idx + 1} sur ${total} détectées` : 'Bouteille détectée'}
                            </p>
                            <h3 class="font-serif text-xl font-bold text-ink">Valider la fiche</h3>
                        </div>
                        <button onclick="cancelScanBatchModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-inkmuted cursor-pointer">✕</button>
                    </div>

                    ${total > 1 ? `
                        <div class="space-y-1">
                            <div class="w-full h-1.5 rounded-full bg-sand overflow-hidden">
                                <div class="h-full rounded-full bg-bordeaux transition-all" style="width: ${progressPct}%"></div>
                            </div>
                            <p class="text-[11px] text-inkmuted">Validez chaque bouteille l'une après l'autre avant de passer à la suivante.</p>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-2.5 text-xs">
                        <div class="col-span-2">
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Nom de la cuvée</label>
                            <input type="text" id="scan-name" value="${escapeHtmlAttr(info.name || '')}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand font-semibold">
                        </div>
                        <div class="col-span-2">
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Domaine / Maison</label>
                            <input type="text" id="scan-producer" value="${escapeHtmlAttr(info.producer || '')}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Millésime</label>
                            <input type="text" id="scan-vintage" value="${escapeHtmlAttr(info.vintage || 'NV')}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Couleur</label>
                            <select id="scan-color" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                                ${['Rouge', 'Blanc', 'Champagne', 'Rosé'].map(c => `<option value="${c}" ${info.color === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Appellation</label>
                            <input type="text" id="scan-appellation" value="${escapeHtmlAttr(info.appellation || '')}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Cote estimée (€)</label>
                            <input type="number" id="scan-price" value="${Number(info.priceAverage) || 45}" min="0" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Quantité</label>
                            <input type="number" id="scan-qty" value="${Number(info.qty) || 1}" min="1" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Note Parker (/100)</label>
                            <input type="text" id="scan-parker" value="${escapeHtmlAttr(info.parkerScore || '')}" placeholder="Ex : 93/100" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Note Vivino (/5)</label>
                            <input type="text" id="scan-vivino" value="${escapeHtmlAttr(info.vivinoScore || '')}" placeholder="Ex : 4.3/5" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                        </div>
                        <div class="col-span-2">
                            <label class="text-[10px] font-bold uppercase text-inkmuted block mb-1">Cave de destination</label>
                            <select id="scan-cave" class="w-full p-2.5 rounded-xl bg-ivory border border-sand font-semibold">
                                ${state.caves.map(c => `<option value="${escapeHtmlAttr(c.id)}" ${info.caveId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button onclick="skipCurrentScannedBottle()" class="px-3.5 py-2.5 rounded-xl bg-cream border border-sand text-xs font-semibold text-inkmuted cursor-pointer">
                            Ignorer
                        </button>
                        <button onclick="validateCurrentScannedBottle()" class="flex-1 py-2.5 rounded-xl bg-bordeaux text-ivory text-xs font-semibold cursor-pointer shadow-sm">
                            ${idx < total - 1 ? `Valider & suivante (${idx + 2}/${total})` : 'Valider et ajouter en cave'}
                        </button>
                    </div>
                </div>
            `);
        }

        function persistSingleScannedItem(item, imageDataUrl) {
            const price = Math.max(0, Number(item.priceAverage) || 45);
            const qty = Math.max(1, Number(item.qty) || 1);
            const caveId = item.caveId || state.caves[0]?.id || 'cave-1';

            findOrCreateWineAndAddStock({
                name: item.name || 'Cuvée Scannée',
                producer: item.producer || '',
                appellation: item.appellation || '',
                region: item.region || '',
                country: item.country || 'France',
                vintage: item.vintage || 'NV',
                color: item.color || 'Rouge',
                grapes: item.grapes || '',
                classification: item.classification || '',
                alcohol: item.alcohol || '',
                imageUrl: imageDataUrl || '',
                drinkFrom: item.drinkFrom,
                drinkPeak: item.drinkPeak,
                drinkTo: item.drinkTo,
                parkerScore: item.parkerScore || '',
                vivinoScore: item.vivinoScore || '',
                price,
                pairings: item.pairings,
                caveId,
                qty,
                notes: 'Ajouté via Scanner IA'
            });

            return qty;
        }

        function validateCurrentScannedBottle() {
            syncCurrentScanFormToBatch();
            const batch = window.__scanBatch;
            if (!batch) return;
            const idx = batch.activeIndex;
            const item = batch.items[idx];
            if (!item) return;

            const addedQty = persistSingleScannedItem(item, batch.imageDataUrl);
            item._validated = true;
            batch.totalSavedBottles = (batch.totalSavedBottles || 0) + addedQty;
            saveState();

            if (idx < batch.items.length - 1) {
                batch.activeIndex = idx + 1;
                renderMultiBottleScanModal();
                showToast(`Bouteille #${idx + 1} ajoutée — passez à la #${idx + 2}`);
            } else {
                const total = batch.totalSavedBottles || addedQty;
                window.__scanBatch = null;
                closeModal();
                renderCurrentView();
                showToast(`${total} bouteille(s) ajoutée(s) en cave`);
            }
        }

        function skipCurrentScannedBottle() {
            const batch = window.__scanBatch;
            if (!batch) return;
            const idx = batch.activeIndex;
            if (batch.items[idx]) batch.items[idx]._skipped = true;

            if (idx < batch.items.length - 1) {
                batch.activeIndex = idx + 1;
                renderMultiBottleScanModal();
                showToast(`Bouteille #${idx + 1} ignorée`);
            } else {
                const total = batch.totalSavedBottles || 0;
                window.__scanBatch = null;
                closeModal();
                renderCurrentView();
                showToast(total > 0 ? `${total} bouteille(s) ajoutée(s) en cave` : 'Scan terminé');
            }
        }

        function cancelScanBatchModal() {
            window.__scanBatch = null;
            closeModal();
            renderCurrentView();
        }

        // =========================================================================
        // 9. SETTINGS, ICON CUSTOMIZATION & EXCEL EXPORT/IMPORT
        // =========================================================================
        function selectAppIconStyle(styleId) {
            state.iconStyle = styleId;
            saveState();
            const previewUrl = applyAppIcon(null, styleId);
            const img = document.getElementById('settings-icon-preview');
            if (img && previewUrl) img.src = previewUrl;
            showToast('Style d’icône mis à jour');
        }

        function handleCustomIconUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    const minSide = Math.min(img.width, img.height);
                    const sx = (img.width - minSide) / 2;
                    const sy = (img.height - minSide) / 2;
                    ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 512, 512);
                    const squareUrl = canvas.toDataURL('image/png');
                    state.iconStyle = 'custom';
                    state.customIconDataUrl = squareUrl;
                    saveState();
                    applyAppIcon(squareUrl, 'custom');
                    const preview = document.getElementById('settings-icon-preview');
                    if (preview) preview.src = squareUrl;
                    showToast('Icône personnalisée appliquée');
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function openSettingsModal() {
            const currentIconUrl = applyAppIcon();
            const styles = [
                { id: 'glass-gold', label: 'Bordeaux & Or' },
                { id: 'ivory-bordeaux', label: 'Ivoire' },
                { id: 'noir-gold', label: 'Noir & Or' },
                { id: 'champagne-gold', label: 'Or Champagne' },
                { id: 'monogram-ago', label: 'Monogramme V·V' }
            ];

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <p class="text-[10px] uppercase tracking-[0.18em] text-gold font-bold">Configuration</p>
                            <h3 class="font-serif text-xl font-bold text-ink">Paramètres</h3>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-inkmuted cursor-pointer">✕</button>
                    </div>

                    <!-- Clé API Gemini -->
                    <div class="p-3.5 rounded-2xl bg-cream/70 border border-sand space-y-2 text-xs">
                        <label class="text-[10px] font-bold uppercase text-bordeaux block">Clé API Google Gemini</label>
                        <input type="password" id="settings-api-key" value="${escapeHtmlAttr(state.apiKey || '')}" placeholder="AIza..." class="w-full p-2.5 rounded-xl bg-ivory border border-sand font-mono">
                        <p class="text-[11px] text-inkmuted">Stockée uniquement sur cet appareil pour le scanner photo et le sommelier IA.</p>
                    </div>

                    <!-- Icône de l'application sur iPhone -->
                    <div class="p-3.5 rounded-2xl bg-cream/70 border border-sand space-y-2.5 text-xs">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase text-bordeaux">Icône écran d'accueil iPhone</span>
                            <img id="settings-icon-preview" src="${currentIconUrl}" alt="Aperçu icône" class="w-11 h-11 rounded-2xl border border-gold/50 shadow-sm object-cover">
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                            ${styles.map(st => `
                                <button onclick="selectAppIconStyle('${st.id}')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold border cursor-pointer ${state.iconStyle === st.id ? 'bg-bordeaux text-ivory border-bordeaux' : 'bg-ivory text-ink border-sand'}">
                                    ${st.label}
                                </button>
                            `).join('')}
                        </div>
                        <button onclick="document.getElementById('custom-icon-input').click()" class="w-full py-2 rounded-xl bg-ivory border border-sand text-[11px] font-semibold text-ink cursor-pointer">
                            Importer une photo depuis mon iPhone
                        </button>
                        <p class="text-[10px] text-inkmuted">Sur iOS : supprimez l'ancien raccourci puis refaites Partager → Sur l'écran d'accueil pour appliquer la nouvelle icône.</p>
                    </div>

                    <!-- Gestion des Caves & Sauvegarde Excel -->
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button onclick="openManageCavesModal()" class="py-2.5 px-3 rounded-xl bg-cream border border-sand font-semibold text-ink cursor-pointer">
                            Gérer mes caves
                        </button>
                        <button onclick="document.getElementById('excel-import-input').click()" class="py-2.5 px-3 rounded-xl bg-sagelight border border-sage/30 font-semibold text-sage cursor-pointer">
                            Importer CSV Excel
                        </button>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-cream border border-sand text-xs font-semibold text-ink cursor-pointer">Fermer</button>
                        <button onclick="saveSettings()" class="flex-1 py-2.5 rounded-xl bg-bordeaux text-ivory text-xs font-semibold cursor-pointer">Enregistrer</button>
                    </div>
                </div>
            `);
        }

        function saveSettings() {
            const keyInput = document.getElementById('settings-api-key');
            if (keyInput) {
                state.apiKey = keyInput.value.trim();
            }
            saveState();
            closeModal();
            renderCurrentView();
            showToast('Paramètres enregistrés');
        }

        function exportCellarToExcelCsv() {
            try {
                const headers = ['Type', 'Nom / Cuvée', 'Domaine / Maison', 'Appellation', 'Millésime', 'Couleur', 'Cave', 'Quantité', 'Prix Unitaire (€)', 'Note Parker', 'Note Vivino', 'Date / Commentaire'];
                const rows = [headers];

                state.stockEntries.forEach(entry => {
                    const wine = state.wines.find(w => w.id === entry.wineId);
                    if (!wine) return;
                    const cave = state.caves.find(c => c.id === entry.caveId);
                    rows.push([
                        'En cave',
                        wine.name || '',
                        wine.producer || '',
                        wine.appellation || '',
                        wine.vintage || '',
                        wine.color || '',
                        cave ? cave.name : '',
                        entry.qty || 0,
                        wine.price?.average || entry.purchasePrice || 0,
                        wine.scores?.parker || '',
                        wine.scores?.vivino || '',
                        entry.notes || ''
                    ]);
                });

                (state.historyEntries || []).forEach(h => {
                    const linkedWine = state.wines.find(w => w.id === h.wineId);
                    rows.push([
                        h.reason || 'Sortie de cave',
                        h.wineName || '',
                        h.producer || '',
                        '',
                        '',
                        h.color || '',
                        'Historique',
                        h.qtyConsumed || 1,
                        h.priceAtConsumption || 0,
                        h.parkerScore || linkedWine?.scores?.parker || '',
                        h.vivinoScore || linkedWine?.scores?.vivino || '',
                        `${h.date || ''} ${h.comment || ''}`.trim()
                    ]);
                });

                const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `VinSurVin_Cave_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('Export Excel CSV téléchargé');
            } catch (err) {
                showToast('Erreur lors de l’export CSV');
            }
        }

        function handleExcelCsvImport(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const text = String(reader.result || '').replace(/^\uFEFF/, '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) {
                        showToast('Fichier CSV vide');
                        return;
                    }
                    const defaultCaveId = state.caves[0]?.id || 'cave-1';
                    let importedCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const cols = parseCsvLineSemicolon(lines[i]);
                        const typeRow = cols[0] || 'En cave';
                        const name = cols[1];
                        if (!name) continue;

                        const priceNum = parseFloat(cols[8]) || 35;
                        const qtyNum = Math.max(1, parseInt(cols[7]) || 1);
                        const hasExtendedCols = cols.length >= 12;
                        const parkerScore = hasExtendedCols ? (cols[9] || '') : '';
                        const vivinoScore = hasExtendedCols ? (cols[10] || '') : '';
                        const noteText = hasExtendedCols ? (cols[11] || '') : (cols[10] || '');
                        const colorVal = ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(cols[5]) ? cols[5] : 'Rouge';

                        if (typeRow.toLowerCase().includes('cave')) {
                            const caveNameRaw = (cols[6] || '').trim();
                            let matchedCave = state.caves.find(c => c.name.toLowerCase() === caveNameRaw.toLowerCase());
                            if (!matchedCave && caveNameRaw && caveNameRaw.toLowerCase() !== 'historique') {
                                matchedCave = {
                                    id: 'cave-' + Date.now() + '-' + i,
                                    name: caveNameRaw,
                                    location: '',
                                    capacity: 100
                                };
                                state.caves.push(matchedCave);
                            }
                            findOrCreateWineAndAddStock({
                                name,
                                producer: cols[2] || '',
                                appellation: cols[3] || '',
                                vintage: cols[4] || 'NV',
                                color: colorVal,
                                parkerScore,
                                vivinoScore,
                                price: priceNum,
                                qty: qtyNum,
                                caveId: matchedCave ? matchedCave.id : defaultCaveId,
                                notes: noteText
                            });
                            importedCount++;
                        } else {
                            const dateMatch = noteText.match(/^(\d{2}\/\d{2}\/\d{4})\s*(.*)$/);
                            state.historyEntries.push({
                                id: 'hist-' + Date.now() + '-' + i,
                                wineId: '',
                                wineName: name,
                                producer: cols[2] || '',
                                color: colorVal,
                                date: dateMatch ? dateMatch[1] : new Date().toLocaleDateString('fr-FR'),
                                reason: typeRow,
                                qtyConsumed: qtyNum,
                                priceAtConsumption: priceNum,
                                parkerScore,
                                vivinoScore,
                                comment: dateMatch ? dateMatch[2] : noteText
                            });
                            importedCount++;
                        }
                    }

                    saveState();
                    closeModal();
                    renderCurrentView();
                    showToast(`${importedCount} ligne(s) importée(s)`);
                } catch (err) {
                    showToast('Erreur lecture CSV');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Initialisation immédiate ou au chargement DOM
        function initVinSurVinApp() {
            applyAppIcon();
            renderCurrentView();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVinSurVinApp);
        } else {
            initVinSurVinApp();
        }
    </script>
