    <script>
        // =========================================================================
        // 1. APP ICON GENERATOR & INITIAL STATE

        const STORAGE_KEY = 'vin_sur_vin_ago_v25_state';
        const CURRENT_YEAR = new Date().getFullYear();

        function applyAppIcon(customDataUrl = null, stylePreset = null) {
            try {
                const chosenStyle = stylePreset || (typeof state !== 'undefined' && state?.iconStyle) || 'glass-gold';
                const savedCustom = customDataUrl || (typeof state !== 'undefined' && state?.customIconDataUrl) || '';

                if (chosenStyle === 'custom' && savedCustom) {
                    const appleIcon = document.getElementById('apple-touch-icon');
                    const favIcon = document.getElementById('favicon-link');
                    if (appleIcon) appleIcon.href = savedCustom;
                    if (favIcon) favIcon.href = savedCustom;
                    return savedCustom;
                }

                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                const grad = ctx.createLinearGradient(0, 0, 512, 512);
                if (chosenStyle === 'ivory-bordeaux') {
                    grad.addColorStop(0, '#FBF9F5');
                    grad.addColorStop(1, '#EFE6D5');
                } else if (chosenStyle === 'noir-gold') {
                    grad.addColorStop(0, '#241E1C');
                    grad.addColorStop(1, '#120F0E');
                } else if (chosenStyle === 'champagne-gold') {
                    grad.addColorStop(0, '#DFC388');
                    grad.addColorStop(1, '#9E7B38');
                } else if (chosenStyle === 'vineyard-crest') {
                    grad.addColorStop(0, '#4A1221');
                    grad.addColorStop(1, '#260810');
                } else {
                    grad.addColorStop(0, '#6B1D32');
                    grad.addColorStop(1, '#360D18');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                const accentColor = chosenStyle === 'ivory-bordeaux'
                    ? '#5C1A2B'
                    : (chosenStyle === 'champagne-gold' ? '#1E1A18' : '#DFC388');
                const borderColor = chosenStyle === 'champagne-gold' ? '#5C1A2B' : '#C5A059';

                const drawRoundedRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 6;
                drawRoundedRect(64, 64, 384, 384, 72);
                ctx.stroke();

                ctx.lineWidth = 2;
                ctx.save();
                ctx.globalAlpha = 0.55;
                drawRoundedRect(82, 82, 348, 348, 58);
                ctx.stroke();
                ctx.restore();

                if (chosenStyle === 'monogram-ago') {
                    ctx.fillStyle = accentColor;
                    ctx.font = 'italic 700 132px "Cormorant Garamond", Georgia, serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('V·V', 256, 224);

                    ctx.fillStyle = borderColor;
                    ctx.font = '700 28px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('BY AGO', 256, 326);
                } else {
                    ctx.strokeStyle = accentColor;
                    ctx.fillStyle = accentColor;
                    ctx.lineWidth = 13;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    ctx.beginPath();
                    ctx.moveTo(182, 134);
                    ctx.lineTo(330, 134);
                    ctx.bezierCurveTo(330, 214, 294, 250, 256, 254);
                    ctx.bezierCurveTo(218, 250, 182, 214, 182, 134);
                    ctx.stroke();

                    ctx.save();
                    ctx.globalAlpha = 0.25;
                    ctx.beginPath();
                    ctx.moveTo(192, 186);
                    ctx.lineTo(320, 186);
                    ctx.bezierCurveTo(314, 226, 286, 246, 256, 250);
                    ctx.bezierCurveTo(226, 246, 198, 226, 192, 186);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    ctx.beginPath();
                    ctx.moveTo(256, 254);
                    ctx.lineTo(256, 360);
                    ctx.moveTo(204, 362);
                    ctx.lineTo(308, 362);
                    ctx.stroke();
                }

                const dataUrl = canvas.toDataURL('image/png');
                const appleIcon = document.getElementById('apple-touch-icon');
                const favIcon = document.getElementById('favicon-link');
                if (appleIcon) appleIcon.href = dataUrl;
                if (favIcon) favIcon.href = dataUrl;
                return dataUrl;
            } catch (err) {
                return '';
            }
        }

                    { id: 'st-1', wineId: 'wine-1', caveId: 'cave-1', shelf: 'A', row: '2', qty: 3, purchaseYear: CURRENT_YEAR - 1, purchasePrice: 78, notes: 'Achat primeur / cave' },
                    { id: 'st-2', wineId: 'wine-2', caveId: 'cave-1', shelf: 'B', row: '1', qty: 2, purchaseYear: CURRENT_YEAR - 2, purchasePrice: 225, notes: 'À garder en cave fraîche' },
                    { id: 'st-3', wineId: 'wine-3', caveId: 'cave-2', shelf: 'C', row: '4', qty: 2, purchaseYear: CURRENT_YEAR, purchasePrice: 89, notes: 'Prêt à servir à 12°C' }
                ],
                historyEntries: [
                    {

        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return createDefaultState();
                const parsed = JSON.parse(raw);
                const def = createDefaultState();
                return {
                    ...def,
                    ...parsed,
                    caves: Array.isArray(parsed.caves) && parsed.caves.length ? parsed.caves : def.caves,
                    wines: Array.isArray(parsed.wines) ? parsed.wines : def.wines,
                    stockEntries: Array.isArray(parsed.stockEntries) ? parsed.stockEntries : def.stockEntries,
                    historyEntries: Array.isArray(parsed.historyEntries) ? parsed.historyEntries : def.historyEntries,
                    sommelierHistory: Array.isArray(parsed.sommelierHistory) ? parsed.sommelierHistory : []
                };
            } catch (e) {
                return createDefaultState();
            }
        }

        let state = loadState();

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                showToast('Espace de stockage local saturé');
            }
        }

        // =========================================================================
        // 2. HELPERS & READINESS LOGIC
        // =========================================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const label = document.getElementById('toast-msg');
            if (!toast || !label) return;
            label.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2600);
        }

        function getReadinessStatus(wine) {
            const from = Number(wine.drinkFrom) || CURRENT_YEAR;
            const peak = Number(wine.drinkPeak) || (from + 2);
            const to = Number(wine.drinkTo) || (peak + 5);
            if (CURRENT_YEAR < from) {
                return { label: 'À garder', badgeClass: 'bg-amberlight text-amberwine border-amberwine/20', code: 'keep' };
            }
            if (CURRENT_YEAR > to) {
                return { label: 'Fenêtre finale', badgeClass: 'bg-bordeaux/10 text-bordeaux border-bordeaux/20', code: 'late' };
            }
            if (CURRENT_YEAR >= peak - 1 && CURRENT_YEAR <= peak + 2) {
                return { label: 'À son apogée', badgeClass: 'bg-sagelight text-sage border-sage/20', code: 'peak' };
            }
            return { label: 'Prêt à boire', badgeClass: 'bg-sagelight text-sage border-sage/20', code: 'ready' };
        }

        function getColorBadgeStyle(color) {
            switch (color) {
                case 'Rouge': return 'bg-bordeaux/10 text-bordeaux border-bordeaux/20';
                case 'Blanc': return 'bg-[#F8F3DC] text-[#8A6D1B] border-[#DFC388]/50';
                case 'Rosé': return 'bg-[#FCECEF] text-[#A83852] border-[#F2C2CE]';
                case 'Champagne': return 'bg-[#FDF6E3] text-[#8E691E] border-gold/40';
                default: return 'bg-cream text-inkmuted border-sand';
            }
        }

        function getTotalBottles() {
            return state.stockEntries.reduce((sum, s) => sum + (Number(s.qty) || 0), 0);
        }

        function getTotalValuation() {
            return state.stockEntries.reduce((sum, s) => {
                const wine = state.wines.find(w => w.id === s.wineId);
                const unitPrice = Number(wine?.price?.average) || Number(s.purchasePrice) || 0;
                return sum + (Number(s.qty) || 0) * unitPrice;
            }, 0);
        }

        function getReadyToDrinkCount() {
            return state.stockEntries.reduce((sum, s) => {
                const wine = state.wines.find(w => w.id === s.wineId);
                if (!wine) return sum;
                const st = getReadinessStatus(wine);
                return (st.code === 'ready' || st.code === 'peak') ? sum + (Number(s.qty) || 0) : sum;
            }, 0);
        }

        function getColorBreakdown() {
            const counts = { Rouge: 0, Blanc: 0, Champagne: 0, Rosé: 0 };
            state.stockEntries.forEach(s => {
                const wine = state.wines.find(w => w.id === s.wineId);
                if (!wine) return;
                const c = counts[wine.color] !== undefined ? wine.color : 'Rouge';
                counts[c] += Number(s.qty) || 0;
            });
            return counts;
        }

        // =========================================================================
        // 3. GEMINI API CLIENT (VISION + SEARCH + TEXT WITH FALLBACK)
        // =========================================================================
        const GEMINI_MODELS = ['gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-2.0-flash'];

        async function fetchWithRetry(url, payload, retries = 2) {
            let lastError = null;
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) {
                        const errText = await res.text().catch(() => '');
                        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 140)}`);
                    }
                    return await res.json();
                } catch (err) {
                    lastError = err;
                    if (attempt < retries) {
                        await new Promise(r => setTimeout(r, 900 * Math.pow(2, attempt)));
                    }
                }
            }
            throw lastError || new Error('Erreur réseau Gemini');
        }

        async function callGeminiWithModelFallback(buildPayloadFn, useSearch = false) {
            const apiKey = (state.apiKey || '').trim();
            let lastErr = null;
            for (const model of GEMINI_MODELS) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
                    const payload = buildPayloadFn(model, useSearch);
                    const json = await fetchWithRetry(url, payload, 1);
                    const text = json?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
                    if (text.trim()) return text;
                } catch (err) {
                    lastErr = err;
                }
            }
            throw lastErr || new Error('Aucune réponse des modèles Gemini');
        }

        async function callGeminiText(prompt, systemInstruction = '', useSearch = false) {
            return await callGeminiWithModelFallback(() => {
                const payload = {
                    contents: [{ role: 'user', parts: [{ text: prompt }] }]
                };
                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }
                if (useSearch) {
                    payload.tools = [{ google_search: {} }];
                }
                return payload;
            }, useSearch);
        }

        function extractJsonFromText(raw) {
            if (!raw) return null;
            const cleaned = raw.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
            try {
                return JSON.parse(cleaned);
            } catch (e) {
                const startObj = cleaned.indexOf('{');
                const endObj = cleaned.lastIndexOf('}');
                if (startObj !== -1 && endObj > startObj) {
                    try {
                        return JSON.parse(cleaned.slice(startObj, endObj + 1));
                    } catch (_) {}
                }
                const startArr = cleaned.indexOf('[');
                const endArr = cleaned.lastIndexOf(']');
                if (startArr !== -1 && endArr > startArr) {
                    try {
                        return JSON.parse(cleaned.slice(startArr, endArr + 1));
                    } catch (_) {}
                }
                return null;
            }
        }

        async function resizeImageForVision(dataUrl, maxDim = 1280) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width >= height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        async function analyzeWinePhotoWithGemini(imageDataUrl) {
            const resizedUrl = await resizeImageForVision(imageDataUrl, 1280);
            const base64Data = resizedUrl.split(',')[1] || '';

            const visionPrompt = `Analyse cette photo d'étiquette de vin ou de bouteille(s).
Identifie avec précision le domaine/maison, la cuvée, le millésime (ou "NV"), la couleur ("Rouge", "Blanc", "Rosé", "Champagne"), l'appellation, la région, le pays, les cépages, le classement, le degré d'alcool, une estimation réaliste de cote moyenne en euros (nombre), la fenêtre de garde (drinkFrom, drinkPeak, drinkTo en années), et 3 accords mets-vins.
Réponds UNIQUEMENT avec un objet JSON valide de la forme :
{"name":"","producer":"","vintage":"NV","color":"Rouge","appellation":"","region":"","country":"France","grapes":"","classification":"","alcohol":"","priceAverage":45,"drinkFrom":${CURRENT_YEAR},"drinkPeak":${CURRENT_YEAR + 3},"drinkTo":${CURRENT_YEAR + 8},"pairings":[]}`;

            const rawText = await callGeminiWithModelFallback(() => ({
                contents: [{
                    role: 'user',
                    parts: [
                        { text: visionPrompt },
                        { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                    ]
                }]
            }), false);

            const parsed = extractJsonFromText(rawText) || {};
            return {
                name: parsed.name || 'Cuvée Identifiée',
                producer: parsed.producer || '',
                vintage: String(parsed.vintage || 'NV'),
                color: ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(parsed.color) ? parsed.color : 'Rouge',
                appellation: parsed.appellation || '',
                region: parsed.region || '',
                country: parsed.country || 'France',
                grapes: parsed.grapes || '',
                classification: parsed.classification || '',
                alcohol: parsed.alcohol || '',
                priceAverage: Number(parsed.priceAverage) || 45,
                drinkFrom: Number(parsed.drinkFrom) || CURRENT_YEAR,
                drinkPeak: Number(parsed.drinkPeak) || (CURRENT_YEAR + 3),
                drinkTo: Number(parsed.drinkTo) || (CURRENT_YEAR + 8),
                pairings: Array.isArray(parsed.pairings) ? parsed.pairings : []
            };
        }

        async function enrichWineWithWebSearch(wineInfo) {
            const queryText = `${wineInfo.producer || ''} ${wineInfo.name || ''} ${wineInfo.vintage || ''} ${wineInfo.appellation || ''}`.trim();
            const prompt = `Recherche sur Internet les informations fiables pour ce vin : "${queryText}".
Complète ou affine uniquement les champs manquants ou approximatifs : producer, name, vintage, color ("Rouge","Blanc","Rosé","Champagne"), appellation, region, country, grapes, classification, alcohol, priceAverage (prix moyen en €), drinkFrom, drinkPeak, drinkTo, et pairings (3 accords).
Réponds UNIQUEMENT en JSON valide.`;

            const raw = await callGeminiText(prompt, 'Tu es un sommelier expert et analyste du marché du vin.', true);
            const extra = extractJsonFromText(raw) || {};
            return {
                ...wineInfo,
                name: extra.name || wineInfo.name,
                producer: extra.producer || wineInfo.producer,
                vintage: extra.vintage ? String(extra.vintage) : wineInfo.vintage,
                color: ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(extra.color) ? extra.color : wineInfo.color,
                appellation: extra.appellation || wineInfo.appellation,
                region: extra.region || wineInfo.region,
                country: extra.country || wineInfo.country,
                grapes: extra.grapes || wineInfo.grapes,
                classification: extra.classification || wineInfo.classification,
                alcohol: extra.alcohol || wineInfo.alcohol,
                priceAverage: Number(extra.priceAverage) || wineInfo.priceAverage || 45,
                drinkFrom: Number(extra.drinkFrom) || wineInfo.drinkFrom || CURRENT_YEAR,
                drinkPeak: Number(extra.drinkPeak) || wineInfo.drinkPeak || (CURRENT_YEAR + 3),
                drinkTo: Number(extra.drinkTo) || wineInfo.drinkTo || (CURRENT_YEAR + 8),
                pairings: Array.isArray(extra.pairings) && extra.pairings.length ? extra.pairings : (wineInfo.pairings || [])
            };
        }

        function renderCellarView() {
            const search = (state.cellarSearch || '').toLowerCase().trim();
            const filteredEntries = state.stockEntries.filter(entry => {
                const wine = state.wines.find(w => w.id === entry.wineId);
                if (!wine || (Number(entry.qty) || 0) <= 0) return false;
                if (state.cellarFilterColor !== 'Toutes' && wine.color !== state.cellarFilterColor) return false;
                if (state.cellarFilterCave !== 'Toutes' && entry.caveId !== state.cellarFilterCave) return false;
                if (state.cellarFilterReadiness !== 'Toutes') {
                    const st = getReadinessStatus(wine).code;
                    if (state.cellarFilterReadiness === 'ready' && st !== 'ready' && st !== 'peak') return false;
                    if (state.cellarFilterReadiness === 'keep' && st !== 'keep') return false;
                }
                if (search) {
                    const hay = `${wine.name} ${wine.producer} ${wine.appellation} ${wine.region} ${wine.vintage}`.toLowerCase();
                    if (!hay.includes(search)) return false;
                }
                return true;
            });

            return `
                <div class="space-y-4 animate-view">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <span class="text-[10px] uppercase tracking-[0.2em] text-gold font-bold">Inventaire &amp; Garde</span>
                            <h2 class="font-serif text-2xl font-semibold text-ink">Ma Cave (${getTotalBottles()} blles)</h2>
                        </div>
                        <button onclick="openAddWineManualModal()" class="px-3 py-2 rounded-xl bg-bordeaux text-ivory text-xs font-semibold flex items-center gap-1.5 shadow-sm cursor-pointer">
                            <i class="ph ph-plus"></i>
                            <span>Ajouter</span>
                        </button>
                    </div>

                    <!-- Search & Filters -->
                    <div class="card-glass rounded-2xl p-3 space-y-2.5">
                        <div class="relative">
                            <i class="ph ph-magnifying-glass text-inkmuted absolute left-3 top-1/2 -translate-y-1/2"></i>
                            <input type="text" value="${state.cellarSearch || ''}" oninput="state.cellarSearch=this.value; saveState(); renderCurrentView();" placeholder="Rechercher cuvée, domaine, millésime…" class="w-full pl-9 pr-3 py-2 rounded-xl bg-ivory border border-sand text-xs text-ink focus:outline-none focus:border-bordeaux">
                        </div>
                        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                            ${['Toutes', 'Rouge', 'Blanc', 'Champagne', 'Rosé'].map(col => `
                                <button onclick="state.cellarFilterColor='${col}'; saveState(); renderCurrentView();" class="px-2.5 py-1 rounded-xl text-[11px] font-semibold shrink-0 cursor-pointer ${state.cellarFilterColor === col ? 'bg-bordeaux text-ivory' : 'bg-cream text-inkmuted'}">${col}</button>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <select onchange="state.cellarFilterCave=this.value; saveState(); renderCurrentView();" class="p-2 rounded-xl bg-ivory border border-sand text-xs text-ink">
                                <option value="Toutes">Toutes les caves</option>
                                ${state.caves.map(c => `<option value="${c.id}" ${state.cellarFilterCave === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                            </select>
                            <select onchange="state.cellarFilterReadiness=this.value; saveState(); renderCurrentView();" class="p-2 rounded-xl bg-ivory border border-sand text-xs text-ink">
                                <option value="Toutes" ${state.cellarFilterReadiness === 'Toutes' ? 'selected' : ''}>Toutes maturités</option>
                                <option value="ready" ${state.cellarFilterReadiness === 'ready' ? 'selected' : ''}>Prêt / Apogée</option>
                                <option value="keep" ${state.cellarFilterReadiness === 'keep' ? 'selected' : ''}>À garder</option>
                            </select>
                        </div>
                    </div>

                    <!-- Bottle List -->
                    ${filteredEntries.length === 0 ? `
                        <div class="card-glass rounded-3xl p-8 text-center space-y-2">
                            <p class="font-serif text-lg font-semibold text-ink">Aucune bouteille correspondante</p>
                            <p class="text-xs text-inkmuted">Modifiez vos filtres ou scannez une nouvelle étiquette depuis l’accueil.</p>
                        </div>
                    ` : filteredEntries.map(entry => {
                        const wine = state.wines.find(w => w.id === entry.wineId);
                        const cave = state.caves.find(c => c.id === entry.caveId);
                        const readiness = getReadinessStatus(wine);
                        const unitPrice = Number(wine.price?.average) || Number(entry.purchasePrice) || 0;

                        return `
                            <div class="card-glass rounded-2xl p-3.5 flex items-center justify-between gap-3">
                                <div onclick="navigateTo('detail', '${wine.id}')" class="flex-1 min-w-0 cursor-pointer">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${getColorBadgeStyle(wine.color)}">${wine.color}</span>
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${readiness.badgeClass}">${readiness.label}</span>
                                        <span class="text-[10px] text-inkmuted font-medium">${wine.vintage}</span>
                                    </div>
                                    <h3 class="font-serif text-lg font-semibold text-ink truncate mt-1">${wine.name}</h3>
                                    <p class="text-[11px] text-inkmuted truncate">${wine.producer || 'Domaine'} • ${wine.appellation || wine.region || ''}</p>
                                    <p class="text-[10px] text-gold font-semibold mt-0.5">${cave ? cave.name : 'Cave'} ${unitPrice ? '• ~' + unitPrice + ' €/blle' : ''}</p>
                                </div>

                                    <div class="flex items-center gap-1 bg-cream rounded-xl p-1 border border-sand">
                                        <button onclick="adjustStockQty('${entry.id}', -1)" class="w-7 h-7 rounded-lg bg-ivory text-ink font-bold text-xs flex items-center justify-center cursor-pointer">-</button>
                                        <span class="px-2 text-xs font-bold text-ink">${entry.qty}</span>
                                        <button onclick="adjustStockQty('${entry.id}', 1)" class="w-7 h-7 rounded-lg bg-ivory text-ink font-bold text-xs flex items-center justify-center cursor-pointer">+</button>
                                    </div>
                                    <button onclick="openConsumeModal('${entry.id}')" class="px-2.5 py-1 rounded-lg bg-bordeaux/10 text-bordeaux text-[10px] font-semibold cursor-pointer hover:bg-bordeaux hover:text-ivory transition">Boire / Sortir</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderWineDetailView() {
            const wine = state.wines.find(w => w.id === state.selectedWineId) || state.wines[0];
            if (!wine) return renderCellarView();
            const readiness = getReadinessStatus(wine);
            const entries = state.stockEntries.filter(s => s.wineId === wine.id && (Number(s.qty) || 0) > 0);
            const totalQty = entries.reduce((sum, e) => sum + (Number(e.qty) || 0), 0);

            return `
                <div class="space-y-4 animate-view">
                    <button onclick="navigateTo('cellar')" class="text-xs font-semibold text-bordeaux flex items-center gap-1 cursor-pointer">

                        <span>Retour à Ma Cave</span>
                    </button>

                    <section class="card-glass rounded-3xl p-5 space-y-3">
                        <div class="flex items-center gap-2 flex-wrap">

                            <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full border ${readiness.badgeClass}">${readiness.label}</span>
                            <span class="text-xs font-bold text-ink">${wine.vintage}</span>
                        </div>
                        <h2 class="font-serif text-2xl font-bold text-ink">${wine.name}</h2>
                        <p class="text-xs text-inkmuted font-medium">${wine.producer || ''} ${wine.appellation ? '— ' + wine.appellation : ''} ${wine.region ? '(' + wine.region + ')' : ''}</p>

                        <div class="gold-hairline"></div>

                        <div class="grid grid-cols-2 gap-2.5 text-xs">
                            <div class="p-3 rounded-2xl bg-cream/70">
                                <p class="text-[10px] uppercase text-inkmuted font-semibold">Fenêtre de garde</p>
                                <p class="font-semibold text-ink mt-0.5">${wine.drinkFrom || '—'} – ${wine.drinkTo || '—'} <span class="text-sage">(Pic ${wine.drinkPeak || '—'})</span></p>
                            </div>
                            <div class="p-3 rounded-2xl bg-cream/70">
                                <p class="text-[10px] uppercase text-inkmuted font-semibold">Cote estimée</p>
                                <p class="font-semibold text-bordeaux mt-0.5">~${wine.price?.average || 0} € / bouteille</p>
                            </div>
                        </div>

                        ${wine.grapes ? `<p class="text-xs text-ink"><span class="font-semibold text-inkmuted">Cépages :</span> ${wine.grapes}</p>` : ''}
                        ${wine.classification ? `<p class="text-xs text-ink"><span class="font-semibold text-inkmuted">Classement :</span> ${wine.classification}</p>` : ''}

                        ${Array.isArray(wine.pairings) && wine.pairings.length ? `
                            <div class="space-y-1.5 pt-1">
                                <p class="text-[10px] uppercase tracking-wider text-inkmuted font-semibold">Accords mets &amp; vins</p>
                                <div class="flex flex-wrap gap-1.5">
                                    ${wine.pairings.map(p => `<span class="px-2.5 py-1 rounded-xl bg-ivory border border-sand text-[11px] text-ink">${p}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <div class="pt-2 flex items-center justify-between text-xs">
                            <span class="font-semibold text-ink">En stock : ${totalQty} bouteille(s)</span>
                            ${entries[0] ? `<button onclick="openConsumeModal('${entries[0].id}')" class="px-3.5 py-2 rounded-xl bg-bordeaux text-ivory font-semibold cursor-pointer">Enregistrer une sortie</button>` : ''}
                        </div>
                    </section>
                </div>
            `;
        }

        // =========================================================================
        // 6. STOCK, CONSUMPTION, SCANNER & MODALS
        // =========================================================================
        function adjustStockQty(entryId, delta) {
            const idx = state.stockEntries.findIndex(e => e.id === entryId);
            if (idx === -1) return;
            const current = Number(state.stockEntries[idx].qty) || 0;
            const next = Math.max(0, current + delta);
            if (next === 0) {
                state.stockEntries.splice(idx, 1);
                showToast('Bouteille retirée de la cave');
            } else {
                state.stockEntries[idx].qty = next;
                showToast(`Quantité mise à jour : ${next}`);
            }
            saveState();
            renderCurrentView();
        }

        function openConsumeModal(entryId) {
            const entry = state.stockEntries.find(e => e.id === entryId);
            if (!entry) return;
            const wine = state.wines.find(w => w.id === entry.wineId);
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-serif text-xl font-bold text-ink">Sortie de cave</h3>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-inkmuted cursor-pointer"><i class="ph ph-x"></i></button>
                    </div>
                    <p class="text-xs font-semibold text-bordeaux">${wine ? wine.name + ' (' + wine.vintage + ')' : 'Cuvée'}</p>
                    <div class="space-y-2 text-xs">
                        <label class="text-[10px] font-bold uppercase text-inkmuted block">Occasion / Motif</label>
                        <input type="text" id="consume-reason" placeholder="Ex : Dîner en famille, anniversaire…" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                    </div>
                    <div class="space-y-2 text-xs">
                        <label class="text-[10px] font-bold uppercase text-inkmuted block">Note de dégustation (optionnel, /100)</label>
                        <input type="number" id="consume-rating" min="50" max="100" placeholder="92" class="w-full p-2.5 rounded-xl bg-ivory border border-sand">
                    </div>
                    <div class="space-y-2 text-xs">
                        <label class="text-[10px] font-bold uppercase text-inkmuted block">Commentaire</label>
                        <textarea id="consume-comment" rows="2" placeholder="Arômes, garde, impressions…" class="w-full p-2.5 rounded-xl bg-ivory border border-sand"></textarea>
                    </div>
                    <button onclick="confirmConsumeBottle('${entry.id}')" class="w-full py-3 rounded-xl bg-bordeaux text-ivory text-xs font-semibold cursor-pointer">Valider la sortie (1 bouteille)</button>
                </div>
            `);
        }

        function confirmConsumeBottle(entryId) {
            const idx = state.stockEntries.findIndex(e => e.id === entryId);
            if (idx === -1) return;
            const entry = state.stockEntries[idx];
            const wine = state.wines.find(w => w.id === entry.wineId);
            const reason = document.getElementById('consume-reason')?.value.trim() || 'Dégustation';
            const ratingRaw = document.getElementById('consume-rating')?.value.trim();
            const rating = ratingRaw ? Math.min(100, Math.max(0, Number(ratingRaw))) : null;
            const comment = document.getElementById('consume-comment')?.value.trim() || '';

            state.historyEntries.unshift({
                id: 'his-' + Date.now(),
                wineId: entry.wineId,
                wineName: wine ? `${wine.name} (${wine.vintage})` : 'Cuvée',
                color: wine?.color || 'Rouge',
                date: new Date().toISOString().slice(0, 10),
                reason,
                rating,
                comment,
                priceAtConsumption: Number(wine?.price?.average) || Number(entry.purchasePrice) || 0
            });

            if ((Number(entry.qty) || 1) <= 1) {
                state.stockEntries.splice(idx, 1);
            } else {
                state.stockEntries[idx].qty = Number(entry.qty) - 1;
            }

            saveState();
            closeModal();
            renderCurrentView();
            showToast('Sortie enregistrée dans l’historique');
        }

        function openAddCaveModal() {

                <div class="space-y-4">

                        <h3 class="font-serif text-xl font-bold text-ink">Nouvelle cave</h3>

            openModal(`
                <div class="space-y-3.5">
                    <div class="flex items-center justify-between">

                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-inkmuted cursor-pointer"><i class="ph ph-x"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5 text-xs">

                    <button onclick="saveManualWine()" class="w-full py-3 rounded-xl bg-bordeaux text-ivory text-xs font-semibold cursor-pointer">Enregistrer en cave</button>
                </div>
            `);

        function saveManualWine() {
            const name = document.getElementById('manual-name')?.value.trim();
            if (!name) {
                showToast('Veuillez saisir le nom de la cuvée');
                return;
            }
            const producer = document.getElementById('manual-producer')?.value.trim() || '';
            const vintage = document.getElementById('manual-vintage')?.value.trim() || 'NV';
            const color = document.getElementById('manual-color')?.value || 'Rouge';
            const appellation = document.getElementById('manual-appellation')?.value.trim() || '';
            const qty = Math.max(1, Number(document.getElementById('manual-qty')?.value) || 1);
            const price = Math.max(0, Number(document.getElementById('manual-price')?.value) || 40);
            const caveId = document.getElementById('manual-cave')?.value || state.caves[0]?.id || 'cave-1';

            const wineId = 'wine-' + Date.now();
            state.wines.unshift({
                id: wineId,
                name,
                producer,
                appellation,
                region: '',
                country: 'France',
                vintage,
                color,
                grapes: '',
                classification: '',
                alcohol: '',
                imageUrl: '',
                drinkFrom: CURRENT_YEAR,
                drinkPeak: CURRENT_YEAR + 3,
                drinkTo: CURRENT_YEAR + 8,
                price: { low: Math.round(price * 0.85), average: price, high: Math.round(price * 1.2) },
                tastingNotes: { eye: '', nose: '', palate: '' },
                pairings: []
            });
            state.stockEntries.unshift({
                id: 'st-' + Date.now(),
                wineId,
                caveId,
                shelf: '',
                row: '',
                qty,
                purchaseYear: CURRENT_YEAR,
                purchasePrice: price,
                notes: ''
            });
            saveState();
            closeModal();
            renderCurrentView();
            showToast(`${qty} bouteille(s) ajoutée(s)`);
        }

        async function handleImageUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';

            const reader = new FileReader();
            reader.onload = async (e) => {
                const dataUrl = String(e.target.result || '');
                if (!(state.apiKey || '').trim()) {
                    openModal(`
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-serif text-xl font-bold text-ink">Clé API Gemini requise</h3>
                                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-inkmuted cursor-pointer"><i class="ph ph-x"></i></button>
                            </div>
                            <p class="text-xs text-inkmuted leading-relaxed">Collez votre clé API Google Gemini (gratuite sur <strong>aistudio.google.com/apikey</strong>) pour analyser vos étiquettes avec l’IA :</p>
                            <input type="password" id="quick-scan-api-key" placeholder="AIzaSy..." class="w-full p-3 rounded-xl bg-ivory border border-sand text-xs">
                            <button onclick="activateKeyAndResumeScan('${encodeURIComponent(dataUrl)}')" class="w-full py-3 rounded-xl bg-bordeaux text-ivory text-xs font-semibold cursor-pointer">Activer &amp; analyser l’étiquette</button>
                        </div>
                    `);
                    return;
                }
                await runWineScanFlow(dataUrl);
            };
            reader.readAsDataURL(file);
        }

        async function activateKeyAndResumeScan(encodedDataUrl) {
            const val = document.getElementById('quick-scan-api-key')?.value.trim() || '';
            if (!val) {
                showToast('Collez votre clé API AIza...');
                return;
            }
            state.apiKey = val;
            saveState();
            const dataUrl = decodeURIComponent(encodedDataUrl);
            await runWineScanFlow(dataUrl);
        }

        async function runWineScanFlow(dataUrl) {
            openModal(`
                <div class="py-8 text-center space-y-3">
                    <i class="ph ph-spinner animate-spin text-3xl text-bordeaux"></i>
                    <p class="font-serif text-xl font-semibold text-ink">Analyse de l’étiquette en cours…</p>
                    <p class="text-xs text-inkmuted">Lecture IA Vision &amp; enrichissement Web</p>
                </div>
            `);

            try {
                let info = await analyzeWinePhotoWithGemini(dataUrl);
                try {
                    info = await enrichWineWithWebSearch(info);
                } catch (_) {}

                openScanValidationModal(info, dataUrl);
            } catch (err) {

        async function triggerWebEnrichFromModal() {
            const btn = document.getElementById('enrich-web-btn');
            const current = {
                ...(window.__pendingScannedWine || {}),
                name: document.getElementById('scan-name')?.value.trim() || '',
                producer: document.getElementById('scan-producer')?.value.trim() || '',
                vintage: document.getElementById('scan-vintage')?.value.trim() || 'NV',
                color: document.getElementById('scan-color')?.value || 'Rouge',
                appellation: document.getElementById('scan-appellation')?.value.trim() || '',
                priceAverage: Number(document.getElementById('scan-price')?.value) || 45
            };
            if (btn) btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i><span>Recherche…</span>';
            try {
                const enriched = await enrichWineWithWebSearch(current);
                window.__pendingScannedWine = enriched;
                if (document.getElementById('scan-name')) document.getElementById('scan-name').value = enriched.name || '';
                if (document.getElementById('scan-producer')) document.getElementById('scan-producer').value = enriched.producer || '';
                if (document.getElementById('scan-vintage')) document.getElementById('scan-vintage').value = enriched.vintage || 'NV';
                if (document.getElementById('scan-color')) document.getElementById('scan-color').value = enriched.color || 'Rouge';
                if (document.getElementById('scan-appellation')) document.getElementById('scan-appellation').value = enriched.appellation || '';
                if (document.getElementById('scan-price')) document.getElementById('scan-price').value = enriched.priceAverage || 45;
                showToast('Informations Web complétées');
            } catch (e) {
                showToast('Recherche Web indisponible');
            } finally {
                if (btn) btn.innerHTML = '<i class="ph ph-globe"></i><span>Compléter Web</span>';
            }
        }

        function confirmSaveScannedWine() {
            const base = window.__pendingScannedWine || {};
            const name = document.getElementById('scan-name')?.value.trim() || 'Cuvée Scannée';
            const producer = document.getElementById('scan-producer')?.value.trim() || '';
            const vintage = document.getElementById('scan-vintage')?.value.trim() || 'NV';
            const color = document.getElementById('scan-color')?.value || 'Rouge';
            const appellation = document.getElementById('scan-appellation')?.value.trim() || '';
            const price = Math.max(0, Number(document.getElementById('scan-price')?.value) || 45);
            const qty = Math.max(1, Number(document.getElementById('scan-qty')?.value) || 1);
            const caveId = document.getElementById('scan-cave')?.value || state.caves[0]?.id || 'cave-1';

            const wineId = 'wine-' + Date.now();
            state.wines.unshift({
                id: wineId,
                name,
                producer,
                appellation,
                region: base.region || '',
                country: base.country || 'France',
                vintage,
                color,
                grapes: base.grapes || '',
                classification: base.classification || '',
                alcohol: base.alcohol || '',
                imageUrl: base.imageUrl || '',
                drinkFrom: Number(base.drinkFrom) || CURRENT_YEAR,
                drinkPeak: Number(base.drinkPeak) || (CURRENT_YEAR + 3),
                drinkTo: Number(base.drinkTo) || (CURRENT_YEAR + 8),
                price: { low: Math.round(price * 0.85), average: price, high: Math.round(price * 1.2) },
                tastingNotes: { eye: '', nose: '', palate: '' },
                pairings: Array.isArray(base.pairings) ? base.pairings : []
            });

            state.stockEntries.unshift({
                id: 'st-' + Date.now(),
                wineId,
                caveId,
                shelf: '',
                row: '',
                qty,
                purchaseYear: CURRENT_YEAR,
                purchasePrice: price,
                notes: 'Ajouté via Scanner IA'
            });

            window.__pendingScannedWine = null;
            saveState();
            closeModal();
            renderCurrentView();
            showToast(`${qty} bouteille(s) ajoutée(s) à votre cave`);
        }

        function handleCustomIconUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';
            const reader = new FileReader();
            reader.onload = (e) => {
                const rawUrl = String(e.target.result || '');
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    const minSide = Math.min(img.width, img.height);
                    const sx = (img.width - minSide) / 2;
                    const sy = (img.height - minSide) / 2;
                    ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 512, 512);
                    const squaredUrl = canvas.toDataURL('image/png');
                    state.customIconDataUrl = squaredUrl;
                    state.iconStyle = 'custom';
                    applyAppIcon(squaredUrl, 'custom');
                    saveState();
                    openSettingsModal();
                    showToast('Photo importée pour l’icône');
                };
                img.src = rawUrl;
            };
            reader.readAsDataURL(file);
        }

        function forceHardReloadApp() {
            try {
                if ('caches' in window) {
                    caches.keys().then(names => names.forEach(name => caches.delete(name)));
                }
            } catch (e) {}
            const baseUrl = window.location.origin + window.location.pathname;
            window.location.replace(`${baseUrl}?v=${Date.now()}`);
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (!container) return;
            if (state.currentView === 'sommelier') {
                container.innerHTML = renderSommelierPairingView();
            } else if (state.currentView === 'history') {
                container.innerHTML = renderHistoryView();
            } else if (state.currentView === 'cellar') {
                container.innerHTML = renderCellarView();
            } else if (state.currentView === 'detail') {
                container.innerHTML = renderWineDetailView();
            } else {
                container.innerHTML = renderHomeView();
            }
        }

        function exportCellarToExcelCsv() {
            try {
                const headers = ['Type', 'Nom / Cuvée', 'Domaine / Maison', 'Appellation', 'Millésime', 'Couleur', 'Cave', 'Quantité', 'Prix Unitaire (€)', 'Note /100', 'Date / Commentaire'];
                const rows = [headers];

                state.stockEntries.forEach(entry => {
                    const wine = state.wines.find(w => w.id === entry.wineId);
                    if (!wine) return;
                    const cave = state.caves.find(c => c.id === entry.caveId);
                    rows.push([
                        'En cave',
                        wine.name || '',
                        wine.producer || '',
                        wine.appellation || '',
                        wine.vintage || '',
                        wine.color || '',
                        cave ? cave.name : '',
                        entry.qty || 0,
                        wine.price?.average || entry.purchasePrice || 0,
                        '',
                        entry.notes || ''
                    ]);
                });

                (state.historyEntries || []).forEach(h => {
                    rows.push([
                        h.reason || 'Sortie de cave',
                        h.wineName || '',
                        h.producer || '',
                        '',
                        '',
                        h.color || '',
                        'Historique',
                        1,
                        h.priceAtConsumption || 0,
                        h.rating || '',
                        `${h.date || ''} ${h.comment || ''}`.trim()
                    ]);
                });

                const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `vin-sur-vin-${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('Export Excel (.csv) généré');
            } catch (e) {
                showToast('Erreur lors de l’export CSV');
            }
        }

        function handleExcelCsvImport(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = String(e.target.result || '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) {
                        showToast('Fichier CSV vide');
                        return;
                    }
                    const sep = lines[0].includes(';') ? ';' : ',';
                    let importedCount = 0;
                    const defaultCaveId = state.caves[0]?.id || 'cave-1';

                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                        const typeRow = cols[0] || 'En cave';
                        const name = cols[1] || '';
                        if (!name) continue;
                        if (typeRow.toLowerCase().includes('cave')) {
                            const wineId = 'wine-imp-' + Date.now() + '-' + i;
                            const priceNum = parseFloat(cols[8]) || 35;
                            const qtyNum = Math.max(1, parseInt(cols[7]) || 1);
                            state.wines.push({
                                id: wineId,
                                name,
                                producer: cols[2] || '',
                                appellation: cols[3] || '',
                                region: '',
                                country: 'France',
                                vintage: cols[4] || 'NV',
                                color: ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(cols[5]) ? cols[5] : 'Rouge',
                                grapes: '',
                                classification: '',
                                alcohol: '',
                                imageUrl: '',
                                drinkFrom: CURRENT_YEAR,
                                drinkPeak: CURRENT_YEAR + 2,
                                drinkTo: CURRENT_YEAR + 7,
                                price: { low: Math.round(priceNum * 0.85), average: priceNum, high: Math.round(priceNum * 1.2) },
                                tastingNotes: { eye: '', nose: '', palate: '' },
                                pairings: []
                            });
                            state.stockEntries.push({
                                id: 'stock-imp-' + Date.now() + '-' + i,
                                wineId,
                                caveId: defaultCaveId,
                                shelf: '',
                                row: '',
                                qty: qtyNum,
                                purchaseYear: CURRENT_YEAR,
                                purchasePrice: priceNum,
                                notes: cols[10] || ''
                            });
                            importedCount++;
                        }
                    }
                    saveState();
                    renderCurrentView();
                    showToast(`${importedCount} bouteille(s) importée(s)`);
                } catch (err) {
                    showToast('Format CSV non reconnu');
                }
            };
            reader.readAsText(file, 'utf-8');
        }

        function saveSettings() {

            state.apiKey = keyVal;

        async function testGeminiApiKey() {
            const keyVal = document.getElementById('settings-api-key')?.value.trim() || '';

            if (!keyVal) {
                if (statusEl) statusEl.innerHTML = '<span class="text-red-700 font-semibold">Collez d’abord votre clé API commençant par AIza...</span>';
                return;

            state.apiKey = keyVal;
            saveState();
            if (statusEl) statusEl.innerHTML = '<span class="text-bordeaux font-semibold">Vérification de la connexion IA en cours...</span>';
            try {
                const reply = await callGeminiText('Réponds uniquement par le mot OK.');
                if (reply) {
                    if (statusEl) statusEl.innerHTML = '<span class="text-sage font-semibold">✓ Clé API active ! L’IA Vision et la recherche Web sont prêtes.</span>';
                }
            } catch (err) {
                if (statusEl) statusEl.innerHTML = `<span class="text-red-700 font-semibold">Erreur API : ${err.message}. Vérifiez votre clé sur aistudio.google.com.</span>`;

        }

        function setupMobileFooterStabilizer() {
            const nav = document.getElementById('bottom-nav');
            if (!nav) return;

            const hideNav = () => nav.classList.add('translate-y-full', 'pointer-events-none');
            const showNav = () => nav.classList.remove('translate-y-full', 'pointer-events-none');

            document.addEventListener('focusin', (e) => {
                const tag = e.target?.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                    hideNav();
                }
            });

            document.addEventListener('focusout', () => {
                setTimeout(() => {
                    const activeTag = document.activeElement?.tagName;
                    if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
                        showNav();
                    }
                }, 120);
            });

            if (window.visualViewport) {
                const initialHeight = window.visualViewport.height;
                window.visualViewport.addEventListener('resize', () => {
                    if (window.visualViewport.height < initialHeight * 0.78) {
                        hideNav();
                    } else {
                        showNav();
                    }
                });
            }
        }
