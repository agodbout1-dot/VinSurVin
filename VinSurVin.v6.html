<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vin sur Vin — Gestion de Cave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif']
                    },
                    colors: {
                        cream: '#FBF9F5',
                        sand: '#F3EFE6',
                        card: '#FFFFFF',
                        borderline: '#E6DFD3',
                        ink: '#1E1A18',
                        inkmuted: '#6E655F',
                        bordeaux: '#6B1422',
                        gold: '#D4AF37',
                        'gold-dark': '#9E7B1C'
                    }
                }
            }
        };
    </script>

    <style>
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
        body {
            background-color: #FBF9F5;
            color: #1E1A18;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(92px + env(safe-area-inset-bottom));
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            background: rgba(251, 249, 245, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }
        .bottom-nav {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        @media (max-width: 380px) {
            html { font-size: 15px; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.22s ease-out forwards; }
    </style>
</head>
<body class="antialiased selection:bg-bordeaux selection:text-white">

    <!-- EN-TÊTE -->
    <header class="sticky top-0 z-30 glass-header border-b border-borderline px-4 pb-3">
        <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
            <button onclick="switchTab('home')" class="flex items-center gap-2.5 text-left min-w-0 active:opacity-80">
                <div class="w-9 h-9 rounded-xl bg-bordeaux text-white flex items-center justify-center shadow-sm shrink-0">
                    <i class="ph-fill ph-wine text-xl text-gold"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-serif text-2xl font-bold leading-none text-bordeaux tracking-tight truncate">Vin sur Vin</h1>
                </div>
            </button>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="exportCellarToExcelCsv()" title="Exporter en Excel (.csv)" class="px-3 h-9 rounded-full bg-emerald-50 border border-emerald-200 flex items-center gap-1.5 text-emerald-800 text-xs font-semibold active:scale-95 transition">
                    <i class="ph-bold ph-file-xls text-base"></i>
                    <span>Excel</span>
                </button>
                <button onclick="openSettingsModal()" title="Paramètres & Clé API" class="w-9 h-9 rounded-full bg-sand border border-borderline flex items-center justify-center text-ink active:scale-95 transition relative">
                    <i class="ph ph-gear text-lg"></i>
                    <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 border-2 border-cream absolute -top-0.5 -right-0.5"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main id="app-content" class="max-w-lg mx-auto px-4 pt-4 space-y-5"></main>

    <!-- ENTRÉES FICHIERS CACHÉES -->
    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
    <input type="file" id="gallery-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
    <input type="file" id="csv-import-input" accept=".csv,text/csv" class="hidden" onchange="handleExcelCsvImport(event)">

    <!-- NAVIGATION BASSE -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bottom-nav border-t border-borderline px-2 pt-2">
        <div class="max-w-lg mx-auto grid grid-cols-5 items-center text-center">
            <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-bordeaux">
                <i class="ph-fill ph-house text-xl"></i>
                <span class="text-[10px] font-semibold">Accueil</span>
            </button>
            <button onclick="switchTab('cellar')" id="nav-cellar" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-inkmuted">
                <i class="ph ph-wine text-xl"></i>
                <span class="text-[10px] font-medium">Ma Cave</span>
            </button>
            <div class="flex justify-center -mt-6">
                <button onclick="openScanChoiceModal()" aria-label="Scanner une bouteille" class="w-14 h-14 rounded-full bg-bordeaux text-white shadow-lg shadow-bordeaux/30 border-4 border-cream flex items-center justify-center active:scale-95 transition">
                    <i class="ph-bold ph-camera text-2xl text-gold"></i>
                </button>
            </div>
            <button onclick="switchTab('sommelier')" id="nav-sommelier" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-inkmuted">
                <i class="ph ph-sparkle text-xl"></i>
                <span class="text-[10px] font-medium">Sommelier</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center gap-0.5 py-1.5 text-inkmuted">
                <i class="ph ph-clock-counter-clockwise text-xl"></i>
                <span class="text-[10px] font-medium">Historique</span>
            </button>
        </div>
    </nav>

    <!-- MODALE GÉNÉRIQUE -->
    <div id="modal-overlay" onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-box" style="padding-bottom: max(1.75rem, env(safe-area-inset-bottom));" class="bg-cream w-full max-w-lg rounded-t-3xl sm:rounded-3xl border border-borderline shadow-2xl max-h-[88dvh] overflow-y-auto p-5 animate-fade-up"></div>
    </div>

    <!-- ZOOM PHOTO PLEIN ÉCRAN -->
    <div id="photo-zoom-overlay" onclick="closePhotoZoom()" class="fixed inset-0 z-[60] bg-black/90 hidden flex-col items-center justify-center p-4">
        <button onclick="closePhotoZoom()" class="self-end mb-3 w-10 h-10 rounded-full bg-white/15 text-white flex items-center justify-center text-xl">✕</button>
        <img id="photo-zoom-img" src="" alt="Photo bouteille" class="max-h-[80vh] max-w-full rounded-2xl object-contain shadow-2xl">
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[70] bg-ink text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90vw] text-center"></div>

    <script>
        // =========================================================================
        // 1. CONSTANTES, UTILITAIRES & STOCKAGE INDEXEDDB + MIROIR LOCALSTORAGE
        // =========================================================================
        const STORAGE_KEY = 'vin_sur_vin_state_v1';
        const IDB_NAME = 'VinSurVinDB';
        const IDB_STORE = 'appStateStore';
        const IDB_KEY = 'primaryState';
        const CURRENT_YEAR = new Date().getFullYear();

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatEuro(amount) {
            const num = Math.round(Number(amount) || 0);
            return num.toLocaleString('fr-FR') + ' €';
        }

        function showToast(message) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = message;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 3000);
        }

        function openModal(html) {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.innerHTML = html;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function openPhotoZoom(src) {
            if (!src) return;
            document.getElementById('photo-zoom-img').src = src;
            const ov = document.getElementById('photo-zoom-overlay');
            ov.classList.remove('hidden');
            ov.classList.add('flex');
        }

        function closePhotoZoom() {
            const ov = document.getElementById('photo-zoom-overlay');
            ov.classList.add('hidden');
            ov.classList.remove('flex');
        }

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error('IndexedDB indisponible'));
                    return;
                }
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function readFromIndexedDB() {
            try {
                const db = await openIndexedDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readonly');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.get(IDB_KEY);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (_) {
                return null;
            }
        }

        async function writeToIndexedDB(payload) {
            try {
                const db = await openIndexedDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.put(payload, IDB_KEY);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
                return true;
            } catch (_) {
                return false;
            }
        }

        // =========================================================================
        // 2. DONNÉES INITIALES & ÉTAT GLOBAL
        // =========================================================================
        function createDefaultState() {
            return {
                activeTab: 'home',
                apiKey: '',
                cachedWorkingModel: '',
                selectedCaveFilter: 'all',
                selectedColorFilter: 'all',
                searchQuery: '',
                sortBy: 'maturity',
                caves: [
                    { id: 'cave_sc', name: 'Saint-Cloud', subtitle: 'Cave principale' },
                    { id: 'cave_cq', name: 'Carqueiranne', subtitle: 'Cave d’été' }
                ],
                wines: [
                    {
                        id: 'wine_demo_1',
                        name: 'Château Léoville Barton',
                        domain: 'Famille Barton',
                        vintage: 2016,
                        color: 'Rouge',
                        format: 'Bouteille',
                        appellation: 'Saint-Julien (2e Cru Classé)',
                        estimatedPrice: 115,
                        parkerScore: '96/100',
                        vivinoScore: '4.4/5',
                        drinkFrom: 2024,
                        drinkTo: 2042,
                        notes: 'Grande structure tannique, cèdre et cassis noir. À carafer 2h avant service.',
                        photo: ''
                    },
                    {
                        id: 'wine_demo_2',
                        name: 'Puligny-Montrachet 1er Cru Les Folatières',
                        domain: 'Domaine Leflaive',
                        vintage: 2020,
                        color: 'Blanc',
                        format: 'Bouteille',
                        appellation: 'Puligny-Montrachet 1er Cru',
                        estimatedPrice: 280,
                        parkerScore: '95/100',
                        vivinoScore: '4.6/5',
                        drinkFrom: 2024,
                        drinkTo: 2033,
                        notes: 'Tension minérale remarquable, fleurs blanches et noisette grillée.',
                        photo: ''
                    },
                    {
                        id: 'wine_demo_3',
                        name: 'Clos Cibonne Cuvée Spéciale des Vignettes',
                        domain: 'Château Cibonne',
                        vintage: 2022,
                        color: 'Rosé',
                        format: 'Bouteille',
                        appellation: 'Côtes de Provence Cru Classé',
                        estimatedPrice: 36,
                        parkerScore: '92/100',
                        vivinoScore: '4.2/5',
                        drinkFrom: 2023,
                        drinkTo: 2028,
                        notes: 'Tibouren élevé sous voile, gastronomie méditerranéenne.',
                        photo: ''
                    },
                    {
                        id: 'wine_demo_4',
                        name: 'Cristal Brut',
                        domain: 'Champagne Louis Roederer',
                        vintage: 2015,
                        color: 'Champagne',
                        format: 'Bouteille',
                        appellation: 'Champagne',
                        estimatedPrice: 295,
                        parkerScore: '96/100',
                        vivinoScore: '4.6/5',
                        drinkFrom: 2024,
                        drinkTo: 2038,
                        notes: 'Bulle crayeuse d’une grande finesse, brioche fine et agrumes confits.',
                        photo: ''
                    }
                ],
                stockEntries: [
                    { id: 'st_1', wineId: 'wine_demo_1', caveId: 'cave_sc', quantity: 6 },
                    { id: 'st_2', wineId: 'wine_demo_2', caveId: 'cave_sc', quantity: 3 },
                    { id: 'st_3', wineId: 'wine_demo_3', caveId: 'cave_cq', quantity: 6 },
                    { id: 'st_4', wineId: 'wine_demo_4', caveId: 'cave_sc', quantity: 2 }
                ],
                historyEntries: [
                    {
                        id: 'hist_demo_1',
                        date: '2025-12-24',
                        reason: 'Bu / Dégusté',
                        wineName: 'Château Lynch-Bages',
                        vintage: 2015,
                        color: 'Rouge',
                        format: 'Bouteille',
                        caveName: 'Saint-Cloud',
                        quantity: 1,
                        unitPrice: 135,
                        parkerScore: '95/100',
                        vivinoScore: '4.4/5',
                        note: 'Réveillon de Noël — magnifique équilibre.'
                    }
                ],
                chatMessages: [
                    {
                        role: 'assistant',
                        text: 'Bonjour ! Je suis votre Sommelier personnel. Je connais chaque bouteille de vos caves de Saint-Cloud et Carqueiranne. Quel plat préparez-vous ou quelle bouteille souhaitez-vous ouvrir ?'
                    }
                ],
                pendingScanBatch: null
            };
        }

        function normalizeLoadedState(raw) {
            const def = createDefaultState();
            if (!raw || typeof raw !== 'object') return def;
            const merged = { ...def, ...raw };
            merged.caves = Array.isArray(raw.caves) && raw.caves.length ? raw.caves : def.caves;
            merged.wines = Array.isArray(raw.wines) ? raw.wines.map(w => ({ ...w, format: w.format === 'Magnum' ? 'Magnum' : 'Bouteille' })) : def.wines;
            merged.stockEntries = Array.isArray(raw.stockEntries) ? raw.stockEntries : def.stockEntries;
            merged.historyEntries = Array.isArray(raw.historyEntries) ? raw.historyEntries.map(h => ({ ...h, format: h.format === 'Magnum' ? 'Magnum' : 'Bouteille' })) : def.historyEntries;
            merged.chatMessages = Array.isArray(raw.chatMessages) && raw.chatMessages.length ? raw.chatMessages : def.chatMessages;
            merged.pendingScanBatch = null;
            return merged;
        }

        function loadInitialStateSync() {
            try {
                const rawStr = localStorage.getItem(STORAGE_KEY);
                if (rawStr) return normalizeLoadedState(JSON.parse(rawStr));
            } catch (_) {}
            return createDefaultState();
        }

        let state = loadInitialStateSync();

        function saveState() {
            const cleanToSave = { ...state, pendingScanBatch: null };
            writeToIndexedDB(cleanToSave);
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanToSave));
            } catch (_) {
                try {
                    const lightMirror = {
                        ...cleanToSave,
                        wines: cleanToSave.wines.map(w => ({ ...w, photo: '' }))
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(lightMirror));
                } catch (__) {}
            }
        }

        // =========================================================================
        // 3. MÉTRIQUES, MATURITÉ, OUVERTURE EN AVANCE & RÉPARTITION COULEURS
        // =========================================================================
        function getCaveName(caveId) {
            const c = state.caves.find(x => x.id === caveId);
            return c ? c.name : 'Saint-Cloud';
        }

        function getWineStockEntries(wineId) {
            return state.stockEntries.filter(s => s.wineId === wineId && Number(s.quantity) > 0);
        }

        function getWineTotalBottles(wineId) {
            return getWineStockEntries(wineId).reduce((acc, s) => acc + (Number(s.quantity) || 0), 0);
        }

        function getMaturityInfo(wine) {
            const from = Number(wine.drinkFrom) || CURRENT_YEAR;
            const to = Number(wine.drinkTo) || (from + 5);
            if (CURRENT_YEAR > to) {
                return {
                    status: 'past',
                    priority: 0,
                    label: `À boire vite (avant ${to})`,
                    badgeClass: 'bg-red-100 text-red-800 border-red-200'
                };
            }
            if (CURRENT_YEAR >= from && CURRENT_YEAR <= to) {
                const urgent = (to - CURRENT_YEAR) <= 1;
                return {
                    status: 'ready',
                    priority: urgent ? 1 : 2,
                    label: urgent ? `Apogée fin (${from}–${to})` : `À son apogée (${from}–${to})`,
                    badgeClass: urgent ? 'bg-amber-100 text-amber-900 border-amber-200' : 'bg-emerald-100 text-emerald-800 border-emerald-200'
                };
            }
            return {
                status: 'young',
                priority: 3,
                label: `À garder (${from}–${to})`,
                badgeClass: 'bg-stone-100 text-stone-700 border-stone-200'
            };
        }

        function getOpeningAdvice(wine) {
            const color = wine.color || 'Rouge';
            const vintageNum = Number(wine.vintage) || 0;
            const age = vintageNum > 0 ? Math.max(0, CURRENT_YEAR - vintageNum) : 0;
            const appText = `${wine.appellation || ''} ${wine.name || ''} ${wine.domain || ''}`.toLowerCase();

            if (color === 'Champagne') {
                if (age >= 12 || appText.includes('millésimé') || appText.includes('cuvée')) {
                    return {
                        shortLabel: 'Ouvrir 10–15 min avant',
                        detail: 'Laisser respirer 10 à 15 min dans un verre tulipe ou blanc à 10–12 °C ; éviter la carafe.'
                    };
                }
                return {
                    shortLabel: 'Ouvrir au service',
                    detail: 'À ouvrir au moment du service à 8–10 °C sans ouverture prolongée.'
                };
            }

            if (color === 'Rosé') {
                return {
                    shortLabel: 'Ouvrir au service',
                    detail: 'À ouvrir au moment du service bien frais (8–10 °C).'
                };
            }

            if (color === 'Blanc') {
                const isRichWhite = age >= 6 || /bourgogne|meursault|puligny|chassagne|corton|pessac|hermitage|condrieu|grand cru|1er cru/i.test(appText);
                if (isRichWhite) {
                    return {
                        shortLabel: 'Ouvrir 30–45 min avant',
                        detail: 'Ouvrir 30 à 45 min avant (ou carafer doucement si très jeune) à 11–13 °C.'
                    };
                }
                return {
                    shortLabel: 'Ouvrir 10–15 min avant',
                    detail: 'Ouvrir 10 à 15 min avant le service à 9–11 °C.'
                };
            }

            const mat = getMaturityInfo(wine);
            const isStructuredRed = /bordeaux|pauillac|saint-julien|margaux|saint-estèphe|pomerol|saint-émilion|pessac|rhône|côte-rôtie|hermitage|cornas|châteauneuf|barolo|rioja reserva|gran reserva/i.test(appText);

            if (mat.status === 'past' || age >= 18) {
                return {
                    shortLabel: 'Ouvrir 30–45 min avant (sans carafe)',
                    detail: 'Vin mature/évolué : ouvrir 30 à 45 min avant et servir délicatement sans brusquer ni carafer longuement.'
                };
            }
            if (isStructuredRed && age <= 10) {
                return {
                    shortLabel: 'Carafer / Ouvrir 1h30–2h avant',
                    detail: 'Rouge structuré encore jeune : ouvrir 1h30 à 2h avant ou carafer pour assouplir les tanins.'
                };
            }
            if (age <= 4) {
                return {
                    shortLabel: 'Ouvrir 45–60 min avant',
                    detail: 'Rouge fruité/jeune : ouvrir 45 à 60 min avant ou passer en carafe 30 min pour l’aérer.'
                };
            }
            return {
                shortLabel: 'Ouvrir 1h avant',
                detail: 'Ouvrir environ 1h avant le service (carafage léger si dépôt) à 16–17 °C.'
            };
        }

        function getColorDotHtml(color) {
            const map = {
                'Rouge': 'bg-[#7A1626]',
                'Blanc': 'bg-[#E5C158]',
                'Rosé': 'bg-[#F29CA3]',
                'Champagne': 'bg-[#D6B872] ring-1 ring-amber-500/40'
            };
            return `<span class="inline-block w-2.5 h-2.5 rounded-full ${map[color] || 'bg-stone-400'} shrink-0"></span>`;
        }

        function getFormatBadgeHtml(format) {
            if (format === 'Magnum') {
                return `<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100/90 text-amber-950 border border-amber-300/80 text-[10px] font-bold tracking-tight shrink-0">Magnum</span>`;
            }
            return '';
        }

        function computeCellarBreakdown(caveId = null) {
            const counts = { Rouge: 0, Blanc: 0, Rosé: 0, Champagne: 0, total: 0, value: 0 };
            state.stockEntries.forEach(st => {
                const qty = Number(st.quantity) || 0;
                if (qty <= 0) return;
                if (caveId && st.caveId !== caveId) return;
                const wine = state.wines.find(w => w.id === st.wineId);
                if (!wine) return;
                counts.total += qty;
                counts.value += qty * (Number(wine.estimatedPrice) || 0);
                if (counts[wine.color] !== undefined) {
                    counts[wine.color] += qty;
                } else {
                    counts.Rouge += qty;
                }
            });
            return counts;
        }

        function updateApiStatusDot() {
            const dot = document.getElementById('api-status-dot');
            if (!dot) return;
            if ((state.apiKey || '').trim().length > 10) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-cream absolute -top-0.5 -right-0.5';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 border-2 border-cream absolute -top-0.5 -right-0.5';
            }
        }

        // =========================================================================
        // 4. NAVIGATION & RENDU PRINCIPAL
        // =========================================================================
        function switchTab(tab, caveFilter = null) {
            state.activeTab = tab;
            if (caveFilter !== null) {
                state.selectedCaveFilter = caveFilter;
            }
            saveState();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderApp() {
            updateApiStatusDot();
            const tabs = ['home', 'cellar', 'sommelier', 'history'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (!btn) return;
                const icon = btn.querySelector('i');
                const label = btn.querySelector('span');
                const isActive = state.activeTab === t;
                btn.className = `nav-btn flex flex-col items-center gap-0.5 py-1.5 ${isActive ? 'text-bordeaux' : 'text-inkmuted'}`;
                if (icon) {
                    icon.className = icon.className.replace('ph-fill', 'ph');
                    if (isActive) icon.className = icon.className.replace('ph ', 'ph-fill ');
                }
                if (label) {
                    label.className = `text-[10px] ${isActive ? 'font-semibold' : 'font-medium'}`;
                }
            });

            const container = document.getElementById('app-content');
            if (state.activeTab === 'home') {
                container.innerHTML = renderHomeTab();
            } else if (state.activeTab === 'cellar') {
                container.innerHTML = renderCellarTab();
            } else if (state.activeTab === 'sommelier') {
                container.innerHTML = renderSommelierTab();
                scrollChatToBottom();
            } else if (state.activeTab === 'history') {
                container.innerHTML = renderHistoryTab();
            }
        }

        // =========================================================================
        // 6. ONGLET MA CAVE
        // =========================================================================
        function renderCellarTab() {
            const q = (state.searchQuery || '').trim().toLowerCase();
            const caveFilter = state.selectedCaveFilter || 'all';
            const colorFilter = state.selectedColorFilter || 'all';

            let items = state.wines.map(wine => {
                const entries = getWineStockEntries(wine.id);
                const filteredEntries = caveFilter === 'all' ? entries : entries.filter(e => e.caveId === caveFilter);
                const qty = filteredEntries.reduce((sum, e) => sum + (Number(e.quantity) || 0), 0);
                return { wine, entries, filteredEntries, qty, mat: getMaturityInfo(wine) };
            }).filter(item => item.qty > 0);

            if (colorFilter !== 'all') {
                items = items.filter(item => item.wine.color === colorFilter);
            }

            if (q) {
                items = items.filter(({ wine }) => {
                    const hay = `${wine.name} ${wine.domain} ${wine.appellation} ${wine.vintage} ${wine.color} ${wine.format || ''} ${wine.notes}`.toLowerCase();
                    return hay.includes(q);
                });
            }

            items.sort((a, b) => {
                if (state.sortBy === 'price_desc') return (Number(b.wine.estimatedPrice) || 0) - (Number(a.wine.estimatedPrice) || 0);
                if (state.sortBy === 'vintage_asc') return (Number(a.wine.vintage) || 9999) - (Number(b.wine.vintage) || 9999);
                if (state.sortBy === 'name_asc') return (a.wine.name || '').localeCompare(b.wine.name || '', 'fr');
                return a.mat.priority - b.mat.priority;
            });

            const totalShown = items.reduce((acc, i) => acc + i.qty, 0);
            const totalValueShown = items.reduce((acc, i) => acc + i.qty * (Number(i.wine.estimatedPrice) || 0), 0);

            const colors = ['all', 'Rouge', 'Blanc', 'Rosé', 'Champagne'];

            return `
                <!-- BARRE DE RECHERCHE & TRI -->
                <div class="space-y-2.5">
                    <div class="flex flex-col sm:flex-row gap-2">
                        <div class="relative flex-1 min-w-0">
                            <i class="ph ph-magnifying-glass text-inkmuted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                            <input type="text" value="${escapeHtml(state.searchQuery)}" oninput="state.searchQuery=this.value; renderApp();" placeholder="Château, millésime, appellation..." class="w-full bg-card border border-borderline rounded-2xl pl-9 pr-8 py-2.5 text-sm focus:outline-none focus:border-bordeaux">
                            ${q ? `<button onclick="state.searchQuery=''; renderApp();" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-inkmuted text-xs p-1">✕</button>` : ''}
                        </div>
                        <select onchange="state.sortBy=this.value; saveState(); renderApp();" class="bg-card border border-borderline rounded-2xl px-3 py-2.5 text-xs font-semibold text-ink focus:outline-none shrink-0">
                            <option value="maturity" ${state.sortBy === 'maturity' ? 'selected' : ''}>Tri : Apogée</option>
                            <option value="price_desc" ${state.sortBy === 'price_desc' ? 'selected' : ''}>Tri : Prix ↓</option>
                            <option value="vintage_asc" ${state.sortBy === 'vintage_asc' ? 'selected' : ''}>Tri : Millésime ↑</option>
                            <option value="name_asc" ${state.sortBy === 'name_asc' ? 'selected' : ''}>Tri : Nom A–Z</option>
                        </select>
                    </div>

                    <!-- FILTRE CAVES -->
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                        <button onclick="state.selectedCaveFilter='all'; saveState(); renderApp();" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0 transition ${caveFilter === 'all' ? 'bg-bordeaux text-white' : 'bg-card border border-borderline text-inkmuted'}">
                            Toutes les caves
                        </button>
                        ${state.caves.map(c => `
                            <button onclick="state.selectedCaveFilter='${c.id}'; saveState(); renderApp();" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0 transition ${caveFilter === c.id ? 'bg-bordeaux text-white' : 'bg-card border border-borderline text-inkmuted'}">
                                ${escapeHtml(c.name)}
                            </button>
                        `).join('')}
                    </div>

                    <!-- FILTRE COULEURS -->
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                        ${colors.map(col => `
                            <button onclick="state.selectedColorFilter='${col}'; saveState(); renderApp();" class="px-3 py-1.5 rounded-full text-xs font-medium shrink-0 flex items-center gap-1.5 transition ${colorFilter === col ? 'bg-ink text-white' : 'bg-sand/80 text-ink'}">
                                ${col !== 'all' ? getColorDotHtml(col) : ''}
                                <span>${col === 'all' ? 'Toutes couleurs' : col}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- RÉSUMÉ SÉLECTION -->

                    </div>
                </div>

                <!-- LISTE DES VINS -->
                <div class="space-y-3">
                    ${items.length === 0 ? `
                        <div class="bg-card border border-borderline rounded-3xl p-8 text-center space-y-3">
                            <i class="ph ph-wine text-4xl text-inkmuted/50"></i>
                            <p class="text-sm font-semibold text-ink">Aucune bouteille trouvée</p>
                            <p class="text-xs text-inkmuted">Modifiez vos filtres ou scannez une nouvelle étiquette.</p>
                            <button onclick="openScanChoiceModal()" class="px-4 py-2.5 rounded-xl bg-bordeaux text-white text-xs font-semibold">Scanner une bouteille</button>
                        </div>
                    ` : items.map(({ wine, filteredEntries, qty, mat }) => {
                        const opening = getOpeningAdvice(wine);
                        return `
                        <article class="bg-card border border-borderline rounded-2xl p-3.5 shadow-xs space-y-3">
                            <div onclick="openWineDetailModal('${wine.id}')" class="flex gap-3 cursor-pointer">
                                ${wine.photo ? `
                                    <img src="${wine.photo}" alt="${escapeHtml(wine.name)}" class="w-16 h-20 rounded-xl object-cover border border-borderline shrink-0 bg-sand">
                                ` : `
                                    <div class="w-16 h-20 rounded-xl bg-sand border border-borderline flex flex-col items-center justify-center shrink-0 text-bordeaux">
                                        <i class="ph-fill ph-wine text-2xl"></i>
                                        <span class="text-[10px] font-bold mt-0.5">${escapeHtml(wine.vintage || 'NV')}</span>
                                    </div>
                                `}
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-start justify-between gap-2">
                                        <div class="flex items-center gap-1.5 min-w-0 flex-wrap">
                                            ${getColorDotHtml(wine.color)}
                                            <h3 class="text-sm font-bold text-ink leading-snug truncate">${escapeHtml(wine.name)}</h3>
                                            ${getFormatBadgeHtml(wine.format)}
                                        </div>
                                        <span class="px-2 py-0.5 rounded-lg bg-bordeaux/10 text-bordeaux text-xs font-bold shrink-0">×${qty}</span>
                                    </div>
                                    <p class="text-xs text-inkmuted truncate mt-0.5">
                                        <strong class="text-ink">${escapeHtml(wine.vintage || 'NV')}</strong> • ${escapeHtml(wine.appellation || wine.domain || 'Appellation non précisée')}
                                    </p>
                                    <div class="flex flex-wrap items-center gap-1.5 mt-2">
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${mat.badgeClass}">${mat.label}</span>
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-sand text-ink">${formatEuro(wine.estimatedPrice)}/u</span>
                                        ${wine.parkerScore ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200">RP ${escapeHtml(wine.parkerScore)}</span>` : ''}
                                        ${wine.vivinoScore ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-rose-50 text-rose-900 border border-rose-200">Vivino ${escapeHtml(wine.vivinoScore)}</span>` : ''}
                                    </div>
                                    <div class="mt-2 flex items-center gap-1.5 text-[11px] text-inkmuted">
                                        <i class="ph-fill ph-clock text-bordeaux text-xs shrink-0"></i>
                                        <span class="font-medium text-ink">${escapeHtml(opening.shortLabel)}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- RÉPARTITION PAR CAVE & ACTIONS RAPIDES -->
                            <div class="pt-2.5 border-t border-borderline/70 flex items-center justify-between gap-2 flex-wrap">
                                <div class="flex flex-wrap gap-1.5">
                                    ${filteredEntries.map(st => `
                                        <span class="inline-flex items-center gap-1 text-[11px] bg-sand px-2.5 py-1 rounded-lg text-ink font-medium">
                                            <i class="ph-fill ph-map-pin text-bordeaux text-xs"></i>
                                            ${escapeHtml(getCaveName(st.caveId))} : <strong>${st.quantity}</strong>
                                        </span>
                                    `).join('')}
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="openConsumeWineModal('${wine.id}')" class="px-2.5 py-1.5 rounded-xl bg-bordeaux text-white text-[11px] font-semibold active:scale-95 transition">
                                        Sortir / Boire
                                    </button>
                                    <button onclick="quickIncrementStock('${wine.id}')" title="Ajouter 1 bouteille" class="w-8 h-8 rounded-xl bg-sand border border-borderline text-ink font-bold text-sm flex items-center justify-center active:scale-95 transition">
                                        +1
                                    </button>
                                </div>
                            </div>
                        </article>
                    `;}).join('')}
                </div>
            `;
        }

        function resetSommelierChat() {
            state.chatMessages = [
                {
                    role: 'assistant',

                }
            ];
            saveState();
            renderApp();

        function startVoiceInput() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                showToast('Dictée vocale non supportée sur ce navigateur.');
                return;
            }
            const rec = new SpeechRec();
            rec.lang = 'fr-FR';
            rec.interimResults = false;
            showToast('Parlez maintenant...');
            rec.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                const inp = document.getElementById('sommelier-input');
                if (inp) inp.value = transcript;
            };
            rec.onerror = () => showToast('Impossible de capter la voix.');
            rec.start();
        }

        async function sendSommelierMessage(rawText) {
            const text = (rawText || '').trim();
            if (!text) return;

            if (!(state.apiKey || '').trim()) {
                openSettingsModal();
                showToast('Veuillez renseigner votre clé API Gemini.');
                return;
            }

            state.chatMessages.push({ role: 'user', text });
            state.chatMessages.push({ role: 'assistant', text: '🍷 Consultation de vos caves et notes de dégustation en cours...' });
            renderApp();

            try {
                const inventoryLines = state.wines.map(w => {
                    const entries = getWineStockEntries(w.id);
                    const total = entries.reduce((a, b) => a + (Number(b.quantity) || 0), 0);
                    if (total <= 0) return null;
                    const loc = entries.map(e => `${getCaveName(e.caveId)}: ${e.quantity}`).join(', ');
                    const mat = getMaturityInfo(w);
                    const opening = getOpeningAdvice(w);
                    const formatTag = w.format === 'Magnum' ? ' [MAGNUM 1,5L]' : '';
                    return `- ${w.name}${formatTag} (${w.vintage || 'NV'}) | ${w.color} | ${w.appellation || w.domain || ''} | Stock total: ${total} (${loc}) | Prix: ${w.estimatedPrice}€ | Statut (${CURRENT_YEAR}): ${mat.label} | Service: ${opening.shortLabel} | RP: ${w.parkerScore || 'N/A'} | Vivino: ${w.vivinoScore || 'N/A'}${w.notes ? ` | Note perso: "${w.notes}"` : ''}`;
                }).filter(Boolean).join('\n');

                const recentHistoryLines = (state.historyEntries || []).slice(0, 12).map(h =>
                    `- ${h.date} : ${h.quantity}x ${h.wineName} (${h.format || 'Bouteille'}, ${h.vintage || 'NV'}, ${h.color}) [${h.reason}] depuis ${h.caveName}${h.note ? ` — "${h.note}"` : ''}`
                ).join('\n');

                const systemPrompt = `Tu es un chef sommelier étoilé français, chaleureux, concis et interactif, agissant comme l'agent sommelier personnel de l'utilisateur.
Nous sommes en ${CURRENT_YEAR}.

INVENTAIRE ACTUEL EN CAVE (Saint-Cloud & Carqueiranne) :
${inventoryLines || 'Aucune bouteille en cave actuellement.'}

DERNIÈRES DÉGUSTATIONS & SORTIES (MÉMOIRE DES GOÛTS) :
${recentHistoryLines || 'Aucun historique enregistré.'}

RÈGLES D'AGENT CONVERSATIONNEL :
1. Tiens rigoureusement compte de tout l'historique de cette conversation : ne propose jamais deux fois une bouteille que l'utilisateur a écartée, et adapte immédiatement tes suggestions selon ses retours (nombre de convives, plat, budget, cave où il se trouve : Saint-Cloud ou Carqueiranne, envie de Magnum ou bouteille).
2. Recommande en priorité des bouteilles réellement disponibles dans ses caves (en précisant le nom exact, le format Magnum si applicable, le millésime, la cave où elle se trouve, son statut d'apogée et le temps d'ouverture/carafage recommandé).
3. Si une bouteille évoque une dégustation passée de son historique, mentionne-le naturellement.
4. Termine toujours par une courte question ciblée et utile pour affiner la suite avec lui (ex. accord précis, cave où il dîne, ou envie d'une alternative).
5. Réponds en français élégant, structuré avec des puces claires et sans blabla inutile.`;

                const rawRecent = state.chatMessages.slice(0, -1).slice(-20);
                const firstUserIdx = rawRecent.findIndex(m => m.role === 'user');
                const validSlice = firstUserIdx >= 0 ? rawRecent.slice(firstUserIdx) : [];

                const contents = [];
                validSlice.forEach(m => {
                    const geminiRole = m.role === 'user' ? 'user' : 'model';
                    if (contents.length > 0 && contents[contents.length - 1].role === geminiRole) {
                        contents[contents.length - 1].parts[0].text += '\n\n' + m.text;
                    } else {
                        contents.push({
                            role: geminiRole,
                            parts: [{ text: m.text }]
                        });
                    }
                });

                const reply = await callGeminiChat(systemPrompt, contents);
                state.chatMessages[state.chatMessages.length - 1] = { role: 'assistant', text: reply };
            } catch (err) {
                state.chatMessages[state.chatMessages.length - 1] = {
                    role: 'assistant',
                    text: `Désolé, impossible de joindre le Sommelier IA : ${err.message || 'erreur réseau'}.`
                };
            }
            saveState();
            renderApp();
        }

        function saveEditedWine(wineId) {
            const wine = state.wines.find(w => w.id === wineId);

            wine.name = document.getElementById('edit-name').value.trim() || wine.name;
            wine.vintage = Number(document.getElementById('edit-vintage').value) || wine.vintage;
            wine.color = document.getElementById('edit-color').value;
            wine.format = document.getElementById('edit-format').value === 'Magnum' ? 'Magnum' : 'Bouteille';
            wine.appellation = document.getElementById('edit-appellation').value.trim();
            wine.estimatedPrice = Number(document.getElementById('edit-price').value) || 0;
            wine.parkerScore = document.getElementById('edit-parker').value.trim();
            wine.vivinoScore = document.getElementById('edit-vivino').value.trim();
            wine.drinkFrom = Number(document.getElementById('edit-from').value) || CURRENT_YEAR;
            wine.drinkTo = Number(document.getElementById('edit-to').value) || (wine.drinkFrom + 5);
            wine.notes = document.getElementById('edit-notes').value.trim();

            state.caves.forEach(c => {
                const inp = document.getElementById(`edit-qty-${c.id}`);
                const newQty = Math.max(0, Number(inp ? inp.value : 0) || 0);
                const idx = state.stockEntries.findIndex(s => s.wineId === wine.id && s.caveId === c.id);
                if (newQty > 0) {
                    if (idx >= 0) {
                        state.stockEntries[idx].quantity = newQty;
                    } else {
                        state.stockEntries.push({ id: 'st_' + Date.now() + '_' + c.id, wineId: wine.id, caveId: c.id, quantity: newQty });
                    }
                } else if (idx >= 0) {
                    state.stockEntries.splice(idx, 1);
                }
            });

            saveState();
            closeModal();
            renderApp();
            showToast('Fiche mise à jour.');
        }

        function findOrCreateWineAndAddStock(wineData, caveId, quantity, replaceMode = false) {
            const normName = (wineData.name || '').trim().toLowerCase();
            const normVintage = Number(wineData.vintage) || 0;
            const normFormat = wineData.format === 'Magnum' ? 'Magnum' : 'Bouteille';

            let existing = state.wines.find(w =>
                (w.name || '').trim().toLowerCase() === normName &&
                (Number(w.vintage) || 0) === normVintage &&
                (w.format || 'Bouteille') === normFormat
            );

            if (!existing) {
                existing = {
                    id: 'wine_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: wineData.name || 'Vin inconnu',
                    domain: wineData.domain || '',
                    vintage: normVintage || CURRENT_YEAR,
                    color: ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(wineData.color) ? wineData.color : 'Rouge',
                    format: normFormat,
                    appellation: wineData.appellation || '',
                    estimatedPrice: Number(wineData.estimatedPrice) || 0,
                    parkerScore: wineData.parkerScore || '',
                    vivinoScore: wineData.vivinoScore || '',
                    drinkFrom: Number(wineData.drinkFrom) || CURRENT_YEAR,
                    drinkTo: Number(wineData.drinkTo) || (CURRENT_YEAR + 8),
                    notes: wineData.notes || '',
                    photo: wineData.photo || ''
                };
                state.wines.unshift(existing);
            } else {
                if (wineData.photo && !existing.photo) existing.photo = wineData.photo;
                if (wineData.parkerScore && !existing.parkerScore) existing.parkerScore = wineData.parkerScore;
                if (wineData.vivinoScore && !existing.vivinoScore) existing.vivinoScore = wineData.vivinoScore;
                if (wineData.estimatedPrice && !existing.estimatedPrice) existing.estimatedPrice = Number(wineData.estimatedPrice);
            }

            const st = state.stockEntries.find(s => s.wineId === existing.id && s.caveId === caveId);
            if (st) {
                st.quantity = replaceMode ? quantity : (Number(st.quantity) || 0) + quantity;
            } else {
                state.stockEntries.push({
                    id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    wineId: existing.id,
                    caveId,
                    quantity
                });
            }
        }

        function compressImageToDataUrl(file, maxDim = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function fetchAvailableGeminiModels(cleanKey) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
                if (!res.ok) return [];
                const data = await res.json();
                const models = Array.isArray(data.models) ? data.models : [];
                return models
                    .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
                    .map(m => (m.name || '').replace(/^models\//, ''))
                    .filter(name => name && !name.includes('embedding') && !name.includes('aqa') && !name.includes('imagen') && !name.includes('tts'));
            } catch (_) {
                return [];
            }
        }

            const preferredOrder = [
                'gemini-2.5-flash',
                'gemini-flash-latest',
                'gemini-2.0-flash',
                'gemini-2.0-flash-lite',
                'gemini-2.5-flash-lite',
                'gemini-2.5-pro'
            ];

            const candidates = [];
            preferredOrder.forEach(p => {
                if (listedModels.includes(p)) candidates.push(p);
            });
            listedModels.forEach(m => {
                if (m.includes('flash') && !candidates.includes(m)) candidates.push(m);
            });
            preferredOrder.forEach(p => {
                if (!candidates.includes(p)) candidates.push(p);
            });

            let lastErr = '';
            for (const model of candidates) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: 'user', parts: [{ text: 'OK' }] }]
                        })
                    });
                    if (res.ok) {
                        return model;
                    }
                    const errJson = await res.json().catch(() => ({}));
                    lastErr = errJson?.error?.message || `HTTP ${res.status}`;
                    if (res.status === 400 || res.status === 403) {
                        throw new Error(lastErr);
                    }
                } catch (e) {
                    lastErr = e.message || lastErr;
                    if (lastErr.includes('API key not valid') || lastErr.includes('API_KEY_INVALID')) {
                        throw e;
                    }
                }
            }
            throw new Error(lastErr || 'Aucun modèle Gemini disponible avec du quota sur cette clé API.');
        }

        async function saveAndTestApiKey() {
            const input = document.getElementById('settings-api-key');
            const statusBox = document.getElementById('settings-api-status');
            const key = (input.value || '').trim();

            if (!key) {
                state.apiKey = '';
                state.cachedWorkingModel = '';
                saveState();
                updateApiStatusDot();
                statusBox.innerHTML = `<span class="text-amber-700">Clé supprimée.</span>`;
                return;
            }

            statusBox.innerHTML = `<span class="text-inkmuted">Test de connexion avec Google Gemini...</span>`;
            try {
                const workingModel = await detectBestGeminiModel(key);
                state.apiKey = key;
                state.cachedWorkingModel = workingModel;
                saveState();
                updateApiStatusDot();
                statusBox.innerHTML = `<span class="text-emerald-700 font-semibold">✓ Clé valide ! Modèle actif : ${escapeHtml(workingModel)}</span>`;
                showToast('Clé API Gemini enregistrée et vérifiée.');
            } catch (err) {
                state.apiKey = key;
                saveState();
                updateApiStatusDot();
                statusBox.innerHTML = `<span class="text-red-700 font-semibold">Erreur : ${escapeHtml(err.message)}</span>`;
            }
        }

                    </div>

                    <!-- CLÉ API GEMINI -->
                    <div class="bg-card border border-borderline rounded-2xl p-3.5 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-ink">Clé API Google Gemini</label>
                            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="text-[11px] font-semibold text-bordeaux underline">Obtenir une clé →</a>
                        </div>
                        <input id="settings-api-key" type="password" value="${escapeHtml(state.apiKey || '')}" placeholder="AIzaSy..." class="w-full bg-sand/60 border border-borderline rounded-xl px-3 py-2.5 text-sm">

                        <div class="grid grid-cols-2 gap-2">

        // =========================================================================
        // 12. APPELS API GEMINI (VISION & CHAT)
        // =========================================================================
        function extractJsonFromText(text) {
            const cleaned = (text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                return JSON.parse(cleaned);
            } catch (_) {
                const start = cleaned.indexOf('{');
                const end = cleaned.lastIndexOf('}');
                if (start !== -1 && end !== -1 && end > start) {
                    return JSON.parse(cleaned.slice(start, end + 1));
                }
                throw new Error('Réponse IA illisible.');
            }
        }

        function sleepMs(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function formatGeminiApiError(status, errJson, modelUsed) {
            const rawMsg = errJson?.error?.message || '';
            if (status === 429 || rawMsg.toLowerCase().includes('quota') || rawMsg.includes('RESOURCE_EXHAUSTED')) {
                if (rawMsg.includes('limit: 0')) {
                    return `Votre projet Google AI Studio a un quota gratuit à 0 sur ${modelUsed}. Vérifiez votre clé ou activez la facturation sur aistudio.google.com.`;
                }
                return `Quota Google Gemini atteint sur ${modelUsed} (${rawMsg.slice(0, 120)}). Attendez 30 secondes ou vérifiez vos quotas sur aistudio.google.com.`;
            }
            if (status === 400 && rawMsg.toLowerCase().includes('api key')) {
                return 'Clé API Gemini invalide. Vérifiez-la dans Paramètres.';
            }
            return rawMsg || `Erreur Gemini (${status})`;
        }

        async function getOrderedCandidateModels(cleanKey) {
            const listedModels = await fetchAvailableGeminiModels(cleanKey);
            const basePriority = [
                state.cachedWorkingModel,
                'gemini-2.5-flash',
                'gemini-flash-latest',
                'gemini-2.0-flash',
                'gemini-2.0-flash-lite',
                'gemini-2.5-flash-lite',
                'gemini-2.5-pro'
            ].filter(Boolean);

            const ordered = [];
            basePriority.forEach(m => {
                if (!ordered.includes(m) && (listedModels.length === 0 || listedModels.includes(m))) {
                    ordered.push(m);
                }
            });
            listedModels.forEach(m => {
                if (m.includes('flash') && !ordered.includes(m)) {
                    ordered.push(m);
                }
            });
            if (ordered.length === 0) {
                ordered.push('gemini-2.5-flash', 'gemini-2.0-flash');
            }
            return ordered;
        }

        async function callGeminiApi(promptText, base64Image = null, mimeType = 'image/jpeg') {
            const cleanKey = (state.apiKey || '').trim();
            if (!cleanKey) throw new Error('Clé API manquante.');

            const parts = [{ text: promptText }];
            if (base64Image) {
                parts.push({ inline_data: { mime_type: mimeType, data: base64Image } });
            }

            const modelsToTry = await getOrderedCandidateModels(cleanKey);
            let lastError = null;

            for (const model of modelsToTry) {
                for (let attempt = 0; attempt < 2; attempt++) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: 'user', parts }],
                            generationConfig: { temperature: 0.2 }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!text) throw new Error('Réponse vide de Gemini.');
                        state.cachedWorkingModel = model;
                        saveState();
                        return text;
                    }

                    const errJson = await res.json().catch(() => ({}));
                    const rawMsg = errJson?.error?.message || '';
                    lastError = new Error(formatGeminiApiError(res.status, errJson, model));

                    if (res.status === 429 && !rawMsg.includes('limit: 0') && attempt === 0) {
                        await sleepMs(2000);
                        continue;
                    }
                    break;
                }
            }
            throw lastError || new Error('Impossible de joindre Gemini.');
        }

        async function callGeminiChat(systemPrompt, conversationContents) {
            const cleanKey = (state.apiKey || '').trim();
            if (!cleanKey) throw new Error('Clé API manquante.');

            const modelsToTry = await getOrderedCandidateModels(cleanKey);
            let lastError = null;

            for (const model of modelsToTry) {
                for (let attempt = 0; attempt < 2; attempt++) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            system_instruction: { parts: [{ text: systemPrompt }] },
                            contents: conversationContents,
                            generationConfig: { temperature: 0.65 }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!text) throw new Error('Réponse vide du Sommelier.');
                        state.cachedWorkingModel = model;
                        saveState();
                        return text;
                    }

                    const errJson = await res.json().catch(() => ({}));
                    const rawMsg = errJson?.error?.message || '';
                    lastError = new Error(formatGeminiApiError(res.status, errJson, model));

                    if (res.status === 429 && !rawMsg.includes('limit: 0') && attempt === 0) {
                        await sleepMs(2000);
                        continue;
                    }
                    break;
                }
            }
            throw lastError || new Error('Impossible de joindre le Sommelier IA.');
        }

        // =========================================================================
        // 13. EXPORT & IMPORT CSV EXCEL COMPLET
        // =========================================================================
        function csvEscape(val) {
            const s = String(val ?? '').replace(/\r?\n/g, ' ');
            return `"${s.replace(/"/g, '""')}"`;
        }

        function exportCellarToExcelCsv() {
            const headers = [
                'Cave', 'Nom du vin', 'Domaine', 'Millésime', 'Couleur', 'Format', 'Appellation',
                'Quantité', 'Prix unitaire (€)', 'Valeur totale (€)', 'Note Parker',
                'Note Vivino', 'Apogée début', 'Apogée fin', 'Statut Apogée', 'Ouverture conseillée', 'Notes personnelles'
            ];

            const rows = ['sep=;', headers.map(csvEscape).join(';')];

            state.stockEntries.forEach(st => {
                const qty = Number(st.quantity) || 0;
                if (qty <= 0) return;
                const w = state.wines.find(x => x.id === st.wineId);
                if (!w) return;
                const mat = getMaturityInfo(w);
                const opening = getOpeningAdvice(w);
                const price = Number(w.estimatedPrice) || 0;

                rows.push([
                    getCaveName(st.caveId),
                    w.name,
                    w.domain || '',
                    w.vintage || '',
                    w.color || 'Rouge',
                    w.format || 'Bouteille',
                    w.appellation || '',
                    qty,
                    price,
                    qty * price,
                    w.parkerScore || '',
                    w.vivinoScore || '',
                    w.drinkFrom || '',
                    w.drinkTo || '',
                    mat.label,
                    opening.shortLabel,
                    w.notes || ''
                ].map(csvEscape).join(';'));
            });

            const bom = '\uFEFF';
            const blob = new Blob([bom + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `Vin_sur_Vin_Cave_${dateStr}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Fichier Excel (.csv) téléchargé !');
        }

        function parseCsvLine(line, sep) {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '"' && line[i + 1] === '"') {
                        cur += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        cur += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === sep) {
                        result.push(cur.trim());
                        cur = '';
                    } else {
                        cur += ch;
                    }
                }
            }
            result.push(cur.trim());
            return result;
        }

        function handleExcelCsvImport(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const buffer = e.target.result;
                let text = new TextDecoder('utf-8').decode(buffer);
                if (text.includes('\uFFFD')) {
                    text = new TextDecoder('windows-1252').decode(buffer);
                }

                const rawLines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim().length > 0);
                const lines = rawLines[0] && /^sep=/i.test(rawLines[0].trim()) ? rawLines.slice(1) : rawLines;

                if (lines.length < 2) {
                    showToast('Fichier CSV vide ou invalide.');
                    return;
                }

                const sep = lines[0].includes(';') ? ';' : ',';
                const headers = parseCsvLine(lines[0], sep).map(h => h.toLowerCase());

                const idxCave = headers.findIndex(h => h.includes('cave'));
                const idxName = headers.findIndex(h => h.includes('nom'));
                const idxDomain = headers.findIndex(h => h.includes('domaine'));
                const idxVintage = headers.findIndex(h => h.includes('mill'));
                const idxColor = headers.findIndex(h => h.includes('couleur'));
                const idxFormat = headers.findIndex(h => h.includes('format'));
                const idxApp = headers.findIndex(h => h.includes('appellation'));
                const idxQty = headers.findIndex(h => h.includes('quant'));
                const idxPrice = headers.findIndex(h => h.includes('prix'));
                const idxParker = headers.findIndex(h => h.includes('parker'));
                const idxVivino = headers.findIndex(h => h.includes('vivino'));
                const idxFrom = headers.findIndex(h => h.includes('début') || h.includes('debut'));
                const idxTo = headers.findIndex(h => h.includes('fin'));
                const idxNotes = headers.findIndex(h => h.includes('notes'));

                let importedBottles = 0;
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCsvLine(lines[i], sep);
                    const name = idxName >= 0 ? cols[idxName] : cols[1];
                    if (!name) continue;

                    const caveLabel = (idxCave >= 0 ? cols[idxCave] : cols[0]) || 'Saint-Cloud';
                    let cave = state.caves.find(c => c.name.toLowerCase() === caveLabel.toLowerCase());
                    if (!cave) {
                        cave = { id: 'cave_' + Date.now() + '_' + i, name: caveLabel, subtitle: 'Cave importée' };
                        state.caves.push(cave);
                    }

                    const qty = Math.max(1, Number(idxQty >= 0 ? cols[idxQty] : 1) || 1);
                    const vintage = Number(idxVintage >= 0 ? cols[idxVintage] : CURRENT_YEAR) || CURRENT_YEAR;
                    const price = Math.max(0, Number(String(idxPrice >= 0 ? cols[idxPrice] : 0).replace(/[^\d.,]/g, '').replace(',', '.')) || 0);
                    const rawFmt = idxFormat >= 0 ? (cols[idxFormat] || '') : '';
                    const format = rawFmt.toLowerCase().includes('magnum') ? 'Magnum' : 'Bouteille';

                    findOrCreateWineAndAddStock({
                        name,
                        domain: idxDomain >= 0 ? cols[idxDomain] : '',
                        vintage,
                        color: idxColor >= 0 ? cols[idxColor] : 'Rouge',
                        format,
                        appellation: idxApp >= 0 ? cols[idxApp] : '',
                        estimatedPrice: price,
                        parkerScore: idxParker >= 0 ? cols[idxParker] : '',
                        vivinoScore: idxVivino >= 0 ? cols[idxVivino] : '',
                        drinkFrom: Number(idxFrom >= 0 ? cols[idxFrom] : CURRENT_YEAR) || CURRENT_YEAR,
                        drinkTo: Number(idxTo >= 0 ? cols[idxTo] : (CURRENT_YEAR + 8)) || (CURRENT_YEAR + 8),
                        notes: idxNotes >= 0 ? cols[idxNotes] : '',
                        photo: ''
                    }, cave.id, qty, true);

                    importedBottles += qty;
                }

                saveState();
                closeModal();
                renderApp();
                showToast(`${importedBottles} bouteille${importedBottles > 1 ? 's' : ''} synchronisée${importedBottles > 1 ? 's' : ''} depuis le CSV !`);
            };
            reader.readAsArrayBuffer(file);
        }

        // =========================================================================
        // 14. INITIALISATION AU CHARGEMENT
        // =========================================================================
        renderApp();

        (async function hydrateFromIndexedDB() {
            const savedIdb = await readFromIndexedDB();
            if (savedIdb && typeof savedIdb === 'object') {
                state = normalizeLoadedState(savedIdb);
                renderApp();
            } else {
                saveState();
            }
        })();
    </script>
