<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Vin sur Vin — Designed &amp; Built by AGO</title>

    <!-- PWA & iOS Web App Manifest -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vin sur Vin">
    <meta name="theme-color" content="#FBF9F5">
    <link id="apple-touch-icon" rel="apple-touch-icon" href="">
    <link id="favicon-link" rel="icon" type="image/png" href="">

    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        ivory: '#FBF9F5',
                        cream: '#F4EFE6',
                        sand: '#E8DFD1',
                        bordeaux: '#5C1A2B',
                        bordeauxlight: '#7A243B',
                        gold: '#C5A059',
                        goldlight: '#DFC388',
                        ink: '#1E1A18',
                        inkmuted: '#6E645F',
                        sage: '#2F6F4E',
                        sagelight: '#EBF4EE',
                        amberwine: '#B4691E',
                        amberlight: '#FDF4E7'
                    },
                    boxShadow: {
                        'soft': '0 10px 32px -6px rgba(30, 26, 24, 0.06), 0 2px 10px -2px rgba(92, 26, 43, 0.04)',
                        'card': '0 4px 20px -2px rgba(30, 26, 24, 0.045), inset 0 1px 0 rgba(255, 255, 255, 0.85)',
                        'luxe': '0 18px 42px -12px rgba(92, 26, 43, 0.24), 0 4px 16px -4px rgba(197, 160, 89, 0.16)',
                    }
                }
            }
        }
    </script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: #FBF9F5;
            background-image:
                radial-gradient(circle at 12% 4%, rgba(197, 160, 89, 0.10) 0%, transparent 44%),
                radial-gradient(circle at 88% 18%, rgba(92, 26, 43, 0.05) 0%, transparent 48%),
                radial-gradient(circle at 50% 96%, rgba(197, 160, 89, 0.08) 0%, transparent 52%);
            color: #1E1A18;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            padding-top: var(--safe-top);
            padding-bottom: calc(88px + var(--safe-bottom));
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 0.7; }
            70% { transform: scale(1.25); opacity: 0; }
            100% { transform: scale(1.25); opacity: 0; }
        }
        .voice-pulse::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 9999px;
            border: 2px solid #5C1A2B;
            animation: pulseRing 1.5s infinite;
        }
        .card-glass {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.94) 0%, rgba(251, 249, 245, 0.86) 100%);
            border: 1px solid rgba(232, 223, 209, 0.9);
            box-shadow: 0 4px 20px -2px rgba(30, 26, 24, 0.045), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .gold-hairline {
            background: linear-gradient(90deg, transparent, rgba(197, 160, 89, 0.55), transparent);
            height: 1px;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-view {
            animation: fadeSlideUp 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="antialiased selection:bg-bordeaux selection:text-ivory">

    <!-- Top Sticky Luxury Header -->
    <header class="sticky top-0 z-30 bg-ivory/90 backdrop-blur-xl border-b border-sand/70 px-5 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
            <div class="relative w-10 h-10 rounded-full bg-gradient-to-br from-bordeaux to-[#3D0F1B] flex items-center justify-center shadow-sm border border-gold/40">
                <i class="ph-fill ph-wine text-goldlight text-lg"></i>
            </div>
            <div>
                <h1 class="font-serif text-[21px] font-semibold tracking-tight leading-none text-ink">Vin sur Vin</h1>
                <p class="text-[9.5px] uppercase tracking-[0.2em] text-gold font-bold mt-1">Designed &amp; built by AGO</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="exportCellarToExcelCsv()" title="Exporter / Sauvegarder Excel" class="px-3 py-1.5 rounded-full bg-sagelight/90 border border-sage/20 text-sage text-xs font-semibold flex items-center gap-1.5 hover:bg-sage hover:text-ivory transition cursor-pointer shadow-2xs">
                <i class="ph ph-microsoft-excel-logo text-sm"></i>
                <span>Excel</span>
            </button>
            <button onclick="openSettingsModal()" title="Paramètres &amp; Clé IA" class="w-9 h-9 rounded-full bg-cream/90 border border-sand flex items-center justify-center text-inkmuted hover:text-bordeaux transition cursor-pointer shadow-2xs">
                <i class="ph ph-sliders-horizontal text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Hidden Native Inputs -->
    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
    <input type="file" id="gallery-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
    <input type="file" id="excel-import-input" accept=".csv,text/csv" class="hidden" onchange="handleExcelCsvImport(event)">

    <!-- Main Content Container -->
    <main id="app-content" class="max-w-lg mx-auto px-4 pt-4 pb-6"></main>

    <!-- Bottom Tab Navigation -->
    <nav id="bottom-nav" style="-webkit-transform: translateZ(0); transform: translateZ(0);" class="fixed bottom-0 inset-x-0 z-30 bg-ivory/95 backdrop-blur-xl border-t border-sand/80 shadow-[0_-8px_24px_-8px_rgba(30,26,24,0.06)] pb-[var(--safe-bottom)] transition-transform duration-200">
        <div class="max-w-lg mx-auto grid grid-cols-4 h-16 px-2">
            <button onclick="navigateTo('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center gap-1 text-bordeaux cursor-pointer">
                <i class="ph-fill ph-house text-[22px]"></i>
                <span class="text-[10px] font-semibold tracking-wide">Home</span>
            </button>
            <button onclick="navigateTo('sommelier')" id="nav-sommelier" class="nav-btn flex flex-col items-center justify-center gap-1 text-inkmuted cursor-pointer">
                <i class="ph ph-sparkle text-[22px]"></i>
                <span class="text-[10px] font-medium tracking-wide">Conseil</span>
            </button>
            <button onclick="navigateTo('history')" id="nav-history" class="nav-btn flex flex-col items-center justify-center gap-1 text-inkmuted cursor-pointer">
                <i class="ph ph-clock-counter-clockwise text-[22px]"></i>
                <span class="text-[10px] font-medium tracking-wide">Historique</span>
            </button>
            <button onclick="navigateTo('cellar')" id="nav-cellar" class="nav-btn flex flex-col items-center justify-center gap-1 text-inkmuted cursor-pointer">
                <i class="ph ph-archive-box text-[22px]"></i>
                <span class="text-[10px] font-medium tracking-wide">Ma Cave</span>
            </button>
        </div>
    </nav>

    <!-- Modal Overlay Container -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 bg-ink/45 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeModalOnBackdrop(event)">
        <div id="modal-panel" class="w-full max-w-lg bg-ivory rounded-t-3xl sm:rounded-3xl border border-sand shadow-2xl max-h-[90vh] overflow-y-auto p-5 sm:p-6 transition-transform"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-ink text-ivory text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 flex items-center gap-2 max-w-[90vw] text-center">
        <i class="ph-fill ph-check-circle text-gold text-base shrink-0"></i>
        <span id="toast-msg">Action effectuée</span>
    </div>

    <script>
        // =========================================================================
        // 1. APP ICON GENERATOR & INITIAL STATE
        // =========================================================================
        function applyAppIcon() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#5C1A2B';
                ctx.fillRect(0, 0, 512, 512);
                ctx.strokeStyle = '#C5A059';
                ctx.lineWidth = 10;
                ctx.strokeRect(24, 24, 464, 464);
                ctx.fillStyle = '#DFC388';
                ctx.font = 'bold 180px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('V', 256, 268);
                const iconUrl = canvas.toDataURL('image/png');
                const appleIcon = document.getElementById('apple-touch-icon');
                const favIcon = document.getElementById('favicon-link');
                if (appleIcon) appleIcon.href = iconUrl;
                if (favIcon) favIcon.href = iconUrl;
            } catch (e) {}
        }

        const STORAGE_KEY = 'vin_sur_vin_ago_v3';
        const CURRENT_YEAR = new Date().getFullYear();

        const INITIAL_CAVES = [
            { id: 'cave-1', name: 'Cave Principale — Saint-Cloud', location: 'Sous-sol tempéré 12°C' },
            { id: 'cave-2', name: 'Cave Secondaire — Résidence Sud', location: 'Cellier climatisation 13°C' }
        ];

        const INITIAL_WINES = [
            {
                id: 'wine-1',
                name: 'Les Coteaux',
                producer: 'Domaine Durand',
                appellation: 'Saint-Joseph AOC',
                region: 'Vallée du Rhône',
                country: 'France',
                vintage: '2020',
                color: 'Rouge',
                grapes: 'Syrah',
                classification: '',
                alcohol: '13.5%',
                imageUrl: '',
                drinkFrom: 2023,
                drinkPeak: 2026,
                drinkTo: 2032,
                price: { low: 30, average: 36, high: 44 },
                tastingNotes: {
                    eye: 'Robe grenat profond aux reflets violacés.',
                    nose: 'Arômes intenses de mûre sauvage, violette et poivre noir.',
                    palate: 'Attaque souple et veloutée, tanins fins et finale épicée.'
                },
                pairings: ['Magret de canard', 'Côte de bœuf grillée', 'Saint-Marcellin affiné']
            },
            {
                id: 'wine-2',
                name: 'Belle Époque',
                producer: 'Champagne Perrier-Jouët',
                appellation: 'Champagne AOC',
                region: 'Champagne',
                country: 'France',
                vintage: '2014',
                color: 'Champagne',
                grapes: 'Chardonnay, Pinot Noir, Meunier',
                classification: 'Cuvée de Prestige',
                alcohol: '12.5%',
                imageUrl: '',
                drinkFrom: 2021,
                drinkPeak: 2026,
                drinkTo: 2034,
                price: { low: 210, average: 235, high: 270 },
                tastingNotes: {
                    eye: 'Or pâle lumineux, cordon de bulles d’une grande finesse.',
                    nose: 'Fleurs blanches d’acacia, poire fraîche, agrumes confits et brioche.',
                    palate: 'Texture soyeuse, tension minérale cristalline et finale persistante.'
                },
                pairings: ['Saint-Jacques snackées', 'Turbot sauce champagne', 'Comté 24 mois']
            },
            {
                id: 'wine-3',
                name: 'Auxey-Duresses',
                producer: 'Pierre & Louis Trapet',
                appellation: 'Auxey-Duresses AOC',
                region: 'Bourgogne',
                country: 'France',
                vintage: '2022',
                color: 'Rouge',
                grapes: 'Pinot Noir',
                classification: 'Village',
                alcohol: '13%',
                imageUrl: '',
                drinkFrom: 2024,
                drinkPeak: 2027,
                drinkTo: 2033,
                price: { low: 42, average: 48, high: 56 },
                tastingNotes: {
                    eye: 'Rubis brillant et limpide.',
                    nose: 'Griottes fraîches, framboise écrasée et touche boisée délicate.',
                    palate: 'Bouche croquante, élégante, tanins soyeux et belle fraîcheur.'
                },
                pairings: ['Volaille rôtie aux morilles', 'Filet mignon de veau', 'Brie de Meaux']
            }
        ];

        const INITIAL_STOCK = [
            { id: 'stock-1', wineId: 'wine-1', caveId: 'cave-1', shelf: '', row: '', qty: 3, purchaseYear: 2022, purchasePrice: 32, notes: '' },
            { id: 'stock-2', wineId: 'wine-2', caveId: 'cave-1', shelf: '', row: '', qty: 2, purchaseYear: 2021, purchasePrice: 215, notes: '' },
            { id: 'stock-3', wineId: 'wine-3', caveId: 'cave-2', shelf: '', row: '', qty: 4, purchaseYear: 2024, purchasePrice: 45, notes: '' }
        ];

        const INITIAL_HISTORY = [
            {
                id: 'hist-1',
                wineName: 'La Brulade (2018)',
                producer: 'Domaine de la Bégude',
                color: 'Rouge',
                priceAtConsumption: 68,
                reason: 'Bue / Dégustée',
                rating: 94,
                occasion: 'Dîner d’anniversaire',
                comment: 'Superbe Bandol à pleine maturité, notes de garrigue, cuir fin et fruits noirs confits. Longueur remarquable.',
                date: '2026-10-18'
            }
        ];

        let state = loadState();

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        currentView: parsed.currentView || 'home',
                        selectedWineId: null,
                        selectedCaveFilter: 'all',
                        selectedColorFilter: 'all',
                        cellarSearch: '',
                        sommelierCaveFilter: parsed.sommelierCaveFilter || 'all',
                        sommelierPrompt: '',
                        sommelierResults: null,
                        isAnalyzingPhoto: false,
                        isListeningVoice: false,
                        isSearchingSommelier: false,
                        expandedHistoryId: null,
                        apiKey: parsed.apiKey || '',
                        caves: Array.isArray(parsed.caves) && parsed.caves.length ? parsed.caves : INITIAL_CAVES,
                        wines: Array.isArray(parsed.wines) ? parsed.wines : INITIAL_WINES,
                        stockEntries: Array.isArray(parsed.stockEntries) ? parsed.stockEntries : INITIAL_STOCK,
                        historyEntries: Array.isArray(parsed.historyEntries) ? parsed.historyEntries : INITIAL_HISTORY
                    };
                }
            } catch (e) {}
            return {
                currentView: 'home',
                selectedWineId: null,
                selectedCaveFilter: 'all',
                selectedColorFilter: 'all',
                cellarSearch: '',
                sommelierCaveFilter: 'all',
                sommelierPrompt: '',
                sommelierResults: null,
                isAnalyzingPhoto: false,
                isListeningVoice: false,
                isSearchingSommelier: false,
                expandedHistoryId: null,
                apiKey: '',
                caves: INITIAL_CAVES,
                wines: INITIAL_WINES,
                stockEntries: INITIAL_STOCK,
                historyEntries: INITIAL_HISTORY
            };
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    currentView: state.currentView,
                    sommelierCaveFilter: state.sommelierCaveFilter,
                    apiKey: state.apiKey,
                    caves: state.caves,
                    wines: state.wines,
                    stockEntries: state.stockEntries,
                    historyEntries: state.historyEntries
                }));
            } catch (e) {}
        }

        // =========================================================================
        // 2. HELPERS & NAVIGATION
        // =========================================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            if (!toast || !toastMsg) return;
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function openModal(htmlContent) {
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');
            if (!backdrop || !panel) return;
            panel.innerHTML = htmlContent;
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            if (!backdrop) return;
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
        }

        function closeModalOnBackdrop(event) {
            if (event.target && event.target.id === 'modal-backdrop') {
                closeModal();
            }
        }

        function navigateTo(view, wineId = null) {
            state.currentView = view;
            if (wineId) state.selectedWineId = wineId;
            updateNavUI();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateNavUI() {
            const navMap = {
                home: { id: 'nav-home', icon: 'ph-house' },
                sommelier: { id: 'nav-sommelier', icon: 'ph-sparkle' },
                history: { id: 'nav-history', icon: 'ph-clock-counter-clockwise' },
                cellar: { id: 'nav-cellar', icon: 'ph-archive-box' }
            };
            const activeTab = state.currentView === 'detail' ? 'cellar' : state.currentView;
            Object.entries(navMap).forEach(([key, cfg]) => {
                const btn = document.getElementById(cfg.id);
                if (!btn) return;
                const isActive = key === activeTab;
                btn.className = `nav-btn flex flex-col items-center justify-center gap-1 cursor-pointer transition ${isActive ? 'text-bordeaux' : 'text-inkmuted'}`;
                const iconEl = btn.querySelector('i');
                const spanEl = btn.querySelector('span');
                if (iconEl) iconEl.className = `${isActive ? 'ph-fill' : 'ph'} ${cfg.icon} text-[22px]`;
                if (spanEl) spanEl.className = `text-[10px] tracking-wide ${isActive ? 'font-semibold' : 'font-medium'}`;
            });
        }

        function getMaturityInfo(wine) {
            const from = Number(wine.drinkFrom) || CURRENT_YEAR;
            const peak = Number(wine.drinkPeak) || from + 2;
            const to = Number(wine.drinkTo) || peak + 4;
            if (CURRENT_YEAR < from) {
                return { label: `À garder (${from})`, badgeClass: 'bg-amberlight text-amberwine border border-amberwine/20' };
            }
            if (CURRENT_YEAR >= peak - 1 && CURRENT_YEAR <= peak + 2) {
                return { label: 'À son apogée', badgeClass: 'bg-bordeaux text-ivory' };
            }
            if (CURRENT_YEAR <= to) {
                return { label: 'Prêt à boire', badgeClass: 'bg-sagelight text-sage border border-sage/20' };
            }
            return { label: 'À boire vite', badgeClass: 'bg-red-50 text-red-700 border border-red-200' };
        }

        function getColorPillHtml(color) {
            const map = {
                'Rouge': { dot: 'bg-[#6E1A2E]', bg: 'bg-[#6E1A2E]/10 text-[#5C1A2B] border-[#6E1A2E]/20' },
                'Blanc': { dot: 'bg-[#D9B650]', bg: 'bg-[#DFC388]/25 text-[#7A5B14] border-[#C5A059]/30' },
                'Rosé': { dot: 'bg-[#E58F9E]', bg: 'bg-[#E58F9E]/15 text-[#9C3B4E] border-[#E58F9E]/30' },
                'Champagne': { dot: 'bg-[#C5A059]', bg: 'bg-[#C5A059]/20 text-[#6F5212] border-[#C5A059]/40' }
            };
            const cfg = map[color] || map['Rouge'];
            return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${cfg.bg}"><span class="w-2 h-2 rounded-full ${cfg.dot}"></span>${color || 'Rouge'}</span>`;
        }

        function getTotalBottlesCount() {
            return state.stockEntries.reduce((sum, s) => sum + (Number(s.qty) || 0), 0);
        }

        function computeCellarBreakdown() {
            const globalCounts = { total: 0, value: 0, Rouge: 0, Blanc: 0, 'Rosé': 0, Champagne: 0 };
            const perCave = state.caves.map(cave => ({
                id: cave.id,
                name: cave.name,
                location: cave.location,
                total: 0,
                value: 0,
                Rouge: 0,
                Blanc: 0,
                'Rosé': 0,
                Champagne: 0
            }));

            state.stockEntries.forEach(entry => {
                const qty = Number(entry.qty) || 0;
                if (qty <= 0) return;
                const wine = state.wines.find(w => w.id === entry.wineId);
                if (!wine) return;
                const unitPrice = Number(wine.price?.average) || Number(entry.purchasePrice) || 0;
                const col = ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(wine.color) ? wine.color : 'Rouge';

                globalCounts.total += qty;
                globalCounts.value += qty * unitPrice;
                globalCounts[col] += qty;

                const caveObj = perCave.find(c => c.id === entry.caveId) || perCave[0];
                if (caveObj) {
                    caveObj.total += qty;
                    caveObj.value += qty * unitPrice;
                    caveObj[col] += qty;
                }
            });

            return { globalCounts, perCave };
        }

        // =========================================================================
        // 3. VIEW 1: HOME (SCANNER + SYNTHÈSE DES CAVES)
        // =========================================================================
        function renderHomeView() {
            const { globalCounts, perCave } = computeCellarBreakdown();

            if (state.isAnalyzingPhoto) {
                return `
                    <div class="animate-view space-y-5 pt-4">
                        <div class="card-glass rounded-3xl p-8 text-center space-y-4">
                            <div class="w-16 h-16 mx-auto rounded-full bg-bordeaux/10 border border-gold/40 flex items-center justify-center relative">
                                <i class="ph-fill ph-sparkle text-bordeaux text-3xl animate-pulse"></i>
                            </div>
                            <div class="space-y-1">
                                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-gold">Analyse Œnologique &amp; Recherche Web</p>
                                <h2 class="font-serif text-2xl font-semibold text-ink">Lecture &amp; recherche des flacons...</h2>
                                <p class="text-xs text-inkmuted max-w-xs mx-auto leading-relaxed">Identification des étiquettes, cépages, fenêtres d’apogée et cotes actuelles sur Internet.</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="animate-view space-y-5">
                    <!-- Hero Scanner Card -->
                    <section class="card-glass rounded-3xl p-6 text-center space-y-4 relative overflow-hidden">

        async function askSommelierAdvice() {
            const promptEl = document.getElementById('sommelier-prompt-input');
            const promptText = (promptEl ? promptEl.value : state.sommelierPrompt).trim();
            if (!promptText) {
                showToast('Décrivez votre plat ou votre envie');
                return;
            }
            state.sommelierPrompt = promptText;
            const selectedCaveId = state.sommelierCaveFilter || 'all';
            const availableEntries = state.stockEntries.filter(s => (Number(s.qty) || 0) > 0 && (selectedCaveId === 'all' || s.caveId === selectedCaveId));

            if (availableEntries.length === 0) {
                showToast('Aucune bouteille disponible dans cette cave');
                return;
            }

            const candidateWines = [];
            const seenIds = new Set();
            availableEntries.forEach(entry => {
                if (seenIds.has(entry.wineId)) return;
                const w = state.wines.find(item => item.id === entry.wineId);
                if (w) {
                    seenIds.add(w.id);
                    const totalQty = availableEntries.filter(s => s.wineId === w.id).reduce((a, b) => a + (Number(b.qty) || 0), 0);
                    candidateWines.push({
                        id: w.id,
                        name: w.name,
                        producer: w.producer,
                        appellation: w.appellation,
                        region: w.region,
                        vintage: w.vintage,
                        color: w.color,
                        grapes: w.grapes,
                        drinkPeak: w.drinkPeak,
                        pairings: w.pairings,
                        qtyAvailable: totalQty
                    });
                }
            });

            state.isSearchingSommelier = true;
            renderCurrentView();

            try {
                const systemPrompt = `Tu es un chef sommelier étoilé. Analyse la demande gastronomique de l'utilisateur et choisis les 1 à 3 meilleures bouteilles EXCLUSIVEMENT parmi la liste JSON des vins disponibles en cave fournie. Réponds UNIQUEMENT en JSON valide avec la structure : {"summary": "phrase courte de conseil", "recommendations": [{"wineId": "id exact", "reason": "explication précise de l'accord mets-vins et de la maturité"}]}.`;
                const userQuery = `Demande : "${promptText}"\n\nVins disponibles dans la cave sélectionnée :\n${JSON.stringify(candidateWines)}`;
                const rawResponse = await callGeminiText(userQuery, systemPrompt);
                const parsed = extractJsonPayloadFromText(rawResponse);
                if (parsed && Array.isArray(parsed.recommendations) && parsed.recommendations.length > 0) {
                    state.sommelierResults = parsed;
                    state.isSearchingSommelier = false;
                    renderCurrentView();
                    return;
                }
            } catch (e) {}

            // Fallback intelligent local si hors-ligne
            const q = promptText.toLowerCase();
            const scored = candidateWines.map(w => {
                let score = 1;
                const blob = `${w.name} ${w.appellation} ${w.region} ${w.color} ${w.grapes} ${(w.pairings || []).join(' ')}`.toLowerCase();
                if ((q.includes('champagne') || q.includes('apéritif') || q.includes('fête') || q.includes('huître') || q.includes('saint-jacques')) && w.color === 'Champagne') score += 10;
                if ((q.includes('viande') || q.includes('bœuf') || q.includes('boeuf') || q.includes('canard') || q.includes('agneau') || q.includes('gibier') || q.includes('fromage')) && w.color === 'Rouge') score += 8;
                if ((q.includes('poisson') || q.includes('crustacé') || q.includes('volaille') || q.includes('fruit de mer')) && (w.color === 'Blanc' || w.color === 'Champagne')) score += 8;
                if (q.includes('apogée') && Math.abs((Number(w.drinkPeak) || CURRENT_YEAR) - CURRENT_YEAR) <= 2) score += 7;
                q.split(/\s+/).forEach(word => {
                    if (word.length > 3 && blob.includes(word)) score += 4;
                });
                return { wine: w, score };
            }).sort((a, b) => b.score - a.score).slice(0, 3);

            state.sommelierResults = {
                summary: `Sélection établie parmi vos ${availableEntries.reduce((a, b) => a + Number(b.qty), 0)} bouteilles disponibles.`,
                recommendations: scored.map(item => ({
                    wineId: item.wine.id,
                    reason: `${item.wine.color} (${item.wine.grapes || item.wine.appellation}) du millésime ${item.wine.vintage}, parfaitement adapté à « ${promptText} ».`
                }))
            };
            state.isSearchingSommelier = false;
            renderCurrentView();
        }

        async function toggleVoiceSommelier() {
            if (state.isListeningVoice) {
                if (window.__speechRecognition) {
                    try { window.__speechRecognition.stop(); } catch (e) {}
                }
                if (window.__mediaRecorder && window.__mediaRecorder.state !== 'inactive') {
                    try { window.__mediaRecorder.stop(); } catch (e) {}
                }
                state.isListeningVoice = false;
                renderCurrentView();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'fr-FR';
                    recognition.interimResults = true;
                    recognition.maxAlternatives = 1;
                    window.__speechRecognition = recognition;
                    state.isListeningVoice = true;
                    renderCurrentView();

                    let finalTranscript = '';
                    recognition.onresult = (event) => {
                        let interim = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                finalTranscript += event.results[i][0].transcript;
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        const currentText = (finalTranscript || interim).trim();
                        state.sommelierPrompt = currentText;
                        const inputEl = document.getElementById('sommelier-prompt-input');
                        if (inputEl) inputEl.value = currentText;
                    };

                    recognition.onerror = () => {
                        state.isListeningVoice = false;
                        renderCurrentView();
                        startAudioRecordingFallback();
                    };

                    recognition.onend = () => {
                        state.isListeningVoice = false;
                        renderCurrentView();
                        if (state.sommelierPrompt.trim()) {
                            askSommelierAdvice();
                        }
                    };

                    recognition.start();
                    return;
                } catch (e) {}
            }

            startAudioRecordingFallback();
        }

        async function startAudioRecordingFallback() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('Micro non accessible sur ce navigateur');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                window.__mediaRecorder = mediaRecorder;
                state.isListeningVoice = true;
                renderCurrentView();
                showToast('Parlez maintenant, puis appuyez sur Écoute... pour valider');

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    state.isListeningVoice = false;
                    renderCurrentView();
                    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64Audio = reader.result.split(',')[1];
                        const mimeType = (mediaRecorder.mimeType || 'audio/webm').split(';')[0];
                        try {
                            showToast('Transcription vocale en cours...');
                            const payload = {
                                contents: [{
                                    parts: [
                                        { text: 'Transcris exactement en français ce que dit l’utilisateur dans cet audio. Réponds uniquement avec la phrase transcrite.' },
                                        { inlineData: { mimeType, data: base64Audio } }
                                    ]
                                }]
                            };
                            const data = await fetchGeminiWithRetry(payload, 1);
                            const transcript = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                            if (transcript) {
                                state.sommelierPrompt = transcript;
                                renderCurrentView();
                                askSommelierAdvice();
                            } else {
                                showToast('Aucune parole détectée');
                            }
                        } catch (err) {
                            showToast('Impossible de transcrire l’audio');
                        }
                    };
                    reader.readAsDataURL(blob);
                };

                mediaRecorder.start();
            } catch (err) {
                state.isListeningVoice = false;
                renderCurrentView();
                showToast('Autorisez l’accès au micro dans les réglages Safari');
            }
        }

        // =========================================================================
        // 6. VIEW 4: MA CAVE (INVENTAIRE SANS CLAYETTE, AVEC COULEUR)

            return `

        function adjustStockQuantity(stockId, delta) {
            const entry = state.stockEntries.find(s => s.id === stockId);
            if (!entry) return;
            entry.qty = Math.max(0, (Number(entry.qty) || 0) + delta);
            if (entry.qty === 0) {
                state.stockEntries = state.stockEntries.filter(s => s.id !== stockId);
            }
            saveState();
            renderCurrentView();
            showToast(delta > 0 ? '+1 bouteille ajoutée au stock' : 'Stock mis à jour');
        }

        function confirmConsumeBottle(stockId) {
            const entry = state.stockEntries.find(s => s.id === stockId);
            if (!entry) return;
            const wine = state.wines.find(w => w.id === entry.wineId);
            if (!wine) return;

            const reasonEl = document.querySelector('input[name="exit-reason"]:checked');
            const reason = reasonEl ? reasonEl.value : 'Bue / Dégustée';
            const occasion = document.getElementById('consume-occasion')?.value.trim() || '';
            const ratingVal = parseInt(document.getElementById('consume-rating')?.value);
            const comment = document.getElementById('consume-comment')?.value.trim() || '';

            state.historyEntries.unshift({
                id: 'hist-' + Date.now(),
                wineName: `${wine.name} (${wine.vintage})`,
                producer: wine.producer || '',
                color: wine.color || 'Rouge',
                priceAtConsumption: Number(wine.price?.average) || Number(entry.purchasePrice) || 0,
                reason,
                rating: !isNaN(ratingVal) ? Math.min(100, Math.max(1, ratingVal)) : null,
                occasion,
                comment,
                date: new Date().toISOString().split('T')[0]
            });

            entry.qty = Math.max(0, (Number(entry.qty) || 1) - 1);
            if (entry.qty === 0) {
                state.stockEntries = state.stockEntries.filter(s => s.id !== stockId);
            }

            saveState();
            closeModal();
            renderCurrentView();
            showToast('Bouteille archivée dans l’Historique');

        // =========================================================================
        // 8. PHOTO SCANNING, 2-STEP GEMINI VISION + GOOGLE SEARCH & VALIDATION
        // =========================================================================
        function resizeImageForVisionApi(dataUrl, maxDim = 1600) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w >= h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const resizedUrl = canvas.toDataURL('image/jpeg', 0.88);
                    resolve({
                        base64Data: resizedUrl.split(',')[1],
                        mimeType: 'image/jpeg'
                    });
                };
                img.onerror = () => {
                    const fallbackMime = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,/)?.[1] || 'image/jpeg';
                    resolve({
                        base64Data: dataUrl.split(',')[1],
                        mimeType: fallbackMime
                    });
                };
                img.src = dataUrl;
            });
        }

        function extractJsonPayloadFromText(rawText) {
            if (!rawText) return null;
            const cleaned = rawText
                .replace(new RegExp('\\x60{3}json', 'gi'), '')
                .replace(new RegExp('\\x60{3}', 'g'), '')
                .trim();
            try {
                return JSON.parse(cleaned);
            } catch (e) {}

            const arrayMatch = cleaned.match(/\[[\s\S]*\]/);
            if (arrayMatch) {
                try {
                    return JSON.parse(arrayMatch[0]);
                } catch (e) {}
            }
            const objMatch = cleaned.match(/\{[\s\S]*\}/);
            if (objMatch) {
                try {
                    return JSON.parse(objMatch[0]);
                } catch (e) {}
            }
            return null;
        }

        async function fetchGeminiWithRetry(payload, maxRetries = 2) {
            const apiKey = (state.apiKey || '').trim();
            if (!apiKey) {
                throw new Error('NO_API_KEY');
            }
            const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-3-flash-preview'];
            let lastErr = null;
            for (const model of models) {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
                for (let attempt = 0; attempt <= maxRetries; attempt++) {
                    try {
                        const res = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            return await res.json();
                        }
                        const errBody = await res.text().catch(() => '');
                        lastErr = new Error(`HTTP ${res.status}: ${errBody.slice(0, 120)}`);
                        if (res.status === 400 || res.status === 403 || res.status === 404) {
                            break;
                        }
                    } catch (e) {
                        lastErr = e;
                    }
                    if (attempt < maxRetries) {
                        await new Promise(r => setTimeout(r, 700 * Math.pow(2, attempt)));
                    }
                }
            }
            throw lastErr || new Error('API Error');
        }

        async function callGeminiText(userQuery, systemPrompt = '', useSearch = false) {
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }]
            };
            if (systemPrompt) {
                payload.systemInstruction = { parts: [{ text: systemPrompt }] };
            }
            if (useSearch) {
                payload.tools = [{ google_search: {} }];
            }
            const data = await fetchGeminiWithRetry(payload, 2);
            return data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        async function callGeminiVisionWithWebSearch(base64Data, mimeType) {
            // Étape 1 : Vision pure haute précision sur l'image (sans conflit d'outil)
            const visionPrompt = `Tu es un maître sommelier expert en lecture d'étiquettes de vin et champagne.
Analyse attentivement cette photo. Elle peut contenir UNE seule bouteille ou PLUSIEURS bouteilles différentes (carton, clayette, alignement).
Déchiffre avec la plus grande précision chaque bouteille visible (cuvée même en écriture cursive, domaine/château/maison, appellation, millésime, région, pays, couleur: "Rouge", "Blanc", "Rosé" ou "Champagne", cépages probables, classement, degré d'alcool, quantité de flacons identiques visibles, et une première estimation de prix en euros).

Réponds UNIQUEMENT avec un tableau JSON valide (sans markdown autour) :
[
  {
    "name": "Nom de la cuvée",
    "producer": "Nom du domaine, château ou maison",
    "appellation": "Appellation officielle",
    "region": "Région viticole",
    "country": "Pays",
    "vintage": "Millésime ou NV",
    "color": "Rouge | Blanc | Rosé | Champagne",
    "grapes": "Cépages principaux",
    "classification": "Classement éventuel",
    "alcohol": "Degré ex: 13.5%",
    "detectedQty": 1,
    "averagePrice": 40,
    "drinkFrom": 2024,
    "drinkPeak": 2027,
    "drinkTo": 2033,
    "pairings": ["Plat 1", "Plat 2"]
  }
]`;

            const visionPayload = {
                contents: [{
                    parts: [
                        { text: visionPrompt },
                        { inlineData: { mimeType, data: base64Data } }
                    ]
                }]
            };

            const visionData = await fetchGeminiWithRetry(visionPayload, 2);
            const visionRaw = visionData?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const detectedList = extractJsonPayloadFromText(visionRaw);

            if (!Array.isArray(detectedList) || detectedList.length === 0) {
                return null;
            }

            // Étape 2 : Enrichissement Internet via Google Search pour chaque bouteille détectée
            const enrichedList = [];
            for (const item of detectedList) {
                const queryLabel = [item.producer, item.name, item.appellation, item.vintage].filter(Boolean).join(' ');
                if (!queryLabel) {
                    enrichedList.push(item);
                    continue;
                }
                try {
                    const searchPrompt = `Recherche sur Internet les caractéristiques œnologiques exactes et le prix moyen actuel en euros (€) pour ce vin : "${queryLabel}".
Complète ou corrige les champs ci-dessous et réponds UNIQUEMENT avec un objet JSON valide :
{
  "name": "${(item.name || '').replace(/"/g, '\\"')}",
  "producer": "${(item.producer || '').replace(/"/g, '\\"')}",
  "appellation": "${(item.appellation || '').replace(/"/g, '\\"')}",
  "region": "${(item.region || '').replace(/"/g, '\\"')}",
  "country": "${(item.country || 'France').replace(/"/g, '\\"')}",
  "vintage": "${(item.vintage || 'NV').replace(/"/g, '\\"')}",
  "color": "${item.color || 'Rouge'}",
  "grapes": "Cépages exacts de cette cuvée",
  "classification": "Classement officiel",
  "alcohol": "Degré d'alcool exact",
  "averagePrice": 45,
  "drinkFrom": 2024,
  "drinkPeak": 2027,
  "drinkTo": 2033,
  "eye": "Description de la robe",
  "nose": "Description du nez",
  "palate": "Description de la bouche",
  "pairings": ["Accord 1", "Accord 2", "Accord 3"]
}`;
                    const searchRaw = await callGeminiText(searchPrompt, 'Tu es un expert en cotation des vins et recherche œnologique. Réponds uniquement en JSON valide.', true);
                    const enrichedObj = extractJsonPayloadFromText(searchRaw);
                    if (enrichedObj && typeof enrichedObj === 'object' && !Array.isArray(enrichedObj)) {
                        enrichedList.push({
                            ...item,
                            ...enrichedObj,
                            name: enrichedObj.name || item.name,
                            producer: enrichedObj.producer || item.producer,
                            appellation: enrichedObj.appellation || item.appellation,
                            vintage: enrichedObj.vintage || item.vintage,
                            detectedQty: item.detectedQty || 1
                        });
                    } else {
                        enrichedList.push(item);
                    }
                } catch (e) {
                    enrichedList.push(item);
                }
            }

            return enrichedList;
        }

        function buildDraftWineFromScan(aiItem, imageUrl = '', index = 0) {

        async function handleImageUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';

            if (!(state.apiKey || '').trim()) {
                showToast('Pensez à enregistrer votre clé API Gemini dans les réglages');
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const dataUrl = e.target.result;
                state.isAnalyzingPhoto = true;
                renderCurrentView();

                try {
                    const { base64Data, mimeType } = await resizeImageForVisionApi(dataUrl, 1600);
                    const analyzedList = await callGeminiVisionWithWebSearch(base64Data, mimeType);
                    if (analyzedList && analyzedList.length > 0) {
                        const drafts = analyzedList.map((item, idx) => buildDraftWineFromScan(item, dataUrl, idx));
                        state.isAnalyzingPhoto = false;
                        renderCurrentView();
                        startScanValidationQueue(drafts, true);
                        return;
                    }
                } catch (err) {
                    if (err && err.message && err.message !== 'NO_API_KEY') {
                        showToast('Vérifiez votre clé API Gemini dans les réglages');
                    }
                }

                state.isAnalyzingPhoto = false;
                renderCurrentView();
                const fallbackDraft = buildDraftWineFromScan(null, dataUrl, 0);
                startScanValidationQueue([fallbackDraft], false);
            };
            reader.readAsDataURL(file);
        }

            const caveId = document.getElementById('val-stock-cave')?.value || state.caves[0]?.id || 'cave-1';
            const qtyVal = Math.max(1, parseInt(document.getElementById('val-stock-qty')?.value) || 1);
            const buyPriceVal = parseFloat(document.getElementById('val-stock-price')?.value) || estPriceVal;

            const finalName = nameVal || appVal || prodVal || 'Cuvée sans nom';
            const wineId = draft.id || ('wine-' + Date.now());

            state.wines.unshift({
                ...draft,
                id: wineId,
                name: finalName,
                producer: prodVal,
                appellation: appVal,
                region: regVal,
                country: countryVal,
                vintage: vintVal,
                color: colorVal,
                grapes: grapesVal,
                classification: classVal,
                alcohol: alcVal,
                price: {
                    low: Math.round(estPriceVal * 0.85),
                    average: estPriceVal,
                    high: Math.round(estPriceVal * 1.2)
                }
            });

            state.stockEntries.unshift({
                id: 'stock-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
                wineId,
                caveId,
                shelf: '',
                row: '',
                qty: qtyVal,
                purchaseYear: CURRENT_YEAR,
                purchasePrice: buyPriceVal,
                notes: ''
            });

            saveState();
            showToast(`${finalName} (${qtyVal} btl) ajouté en cave`);
            advanceOrFinishScanQueue();
        }

        async function saveInlineApiKeyAndRetry() {
            const keyInput = document.getElementById('inline-scan-apikey')?.value.trim() || '';
            if (!keyInput) {
                showToast('Collez votre clé API Google Gemini');
                return;
            }
            state.apiKey = keyInput;
            saveState();
            showToast('Clé API enregistrée — relance de l’analyse...');
            const currentImg = window.__pendingScanDraft?.imageUrl || '';
            if (currentImg && currentImg.startsWith('data:image')) {
                closeModal();
                state.isAnalyzingPhoto = true;
                renderCurrentView();
                try {
                    const { base64Data, mimeType } = await resizeImageForVisionApi(currentImg, 1600);
                    const analyzedList = await callGeminiVisionWithWebSearch(base64Data, mimeType);
                    if (analyzedList && analyzedList.length > 0) {
                        const drafts = analyzedList.map((item, idx) => buildDraftWineFromScan(item, currentImg, idx));
                        state.isAnalyzingPhoto = false;
                        renderCurrentView();
                        startScanValidationQueue(drafts, true);
                        return;
                    }
                } catch (e) {}
                state.isAnalyzingPhoto = false;
                renderCurrentView();
            }
        }

        async function enrichDraftFromWebSearch() {
            const nameVal = document.getElementById('val-wine-name')?.value.trim() || '';
            const prodVal = document.getElementById('val-wine-producer')?.value.trim() || '';
            const appVal = document.getElementById('val-wine-appellation')?.value.trim() || '';
            const vintVal = document.getElementById('val-wine-vintage')?.value.trim() || '';
            const query = [prodVal, nameVal, appVal, vintVal].filter(Boolean).join(' ');
            if (!query) {
                showToast('Saisissez au moins un nom ou domaine');
                return;
            }
            showToast('Recherche Internet en cours...');
            try {
                const prompt = `Recherche sur Internet les informations exactes et la cote en euros pour ce vin : "${query}".
Réponds UNIQUEMENT en JSON valide :
{"name":"...","producer":"...","appellation":"...","region":"...","country":"France","vintage":"...","color":"Rouge|Blanc|Rosé|Champagne","grapes":"...","classification":"...","alcohol":"...","averagePrice":40,"drinkFrom":2024,"drinkPeak":2027,"drinkTo":2033}`;
                const raw = await callGeminiText(prompt, 'Expert sommelier. Réponds uniquement en JSON valide.', true);
                const obj = extractJsonPayloadFromText(raw);
                if (obj) {
                    const updated = buildDraftWineFromScan(obj, window.__pendingScanDraft?.imageUrl || '', 0);
                    openScanValidationModal(updated, (window.__scanQueueIndex || 0) + 1, window.__scanQueueTotal || 1, true);
                    showToast('Fiche complétée via Internet');
                } else {
                    showToast('Aucun complément trouvé');
                }
            } catch (e) {
                showToast('Erreur de recherche (vérifiez votre clé API)');
            }
        }

        // =========================================================================
        // 9. SETTINGS MODAL & EXCEL CSV EXPORT / IMPORT
        // =========================================================================
        function openSettingsModal() {
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-gold">Configuration &amp; Sauvegarde</p>
                            <h3 class="font-serif text-2xl font-semibold text-ink">Paramètres</h3>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-inkmuted cursor-pointer"><i class="ph ph-x"></i></button>
                    </div>

                    <div class="space-y-2 text-xs">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-inkmuted block">Clé API Google Gemini</label>
                        <div class="flex gap-1.5">
                            <input type="password" id="settings-api-key" value="${(state.apiKey || '').replace(/"/g, '&quot;')}" placeholder="AIzaSy..." class="flex-1 p-3 rounded-xl bg-ivory border border-sand text-ink">
                            <button onclick="testGeminiApiKey()" class="px-3.5 py-2.5 rounded-xl bg-cream border border-gold/40 text-bordeaux font-semibold shrink-0 cursor-pointer">Tester</button>
                        </div>
                        <p id="api-test-status" class="text-[11px] text-inkmuted leading-relaxed">Mémorisée localement sur votre iPhone pour activer la reconnaissance d’étiquettes et le sommelier IA sur Netlify.</p>
                    </div>

                    <div class="gold-hairline"></div>

                    <div class="space-y-2">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-inkmuted">Sauvegarde Excel / iCloud Drive</p>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportCellarToExcelCsv()" class="py-2.5 px-3 rounded-xl bg-sagelight border border-sage/25 text-sage text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer">
                                <i class="ph ph-download-simple"></i>
                                <span>Exporter CSV</span>
                            </button>
                            <button onclick="document.getElementById('excel-import-input').click()" class="py-2.5 px-3 rounded-xl bg-ivory border border-sand text-ink text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer">
                                <i class="ph ph-upload-simple"></i>
                                <span>Importer CSV</span>
                            </button>
                        </div>
                    </div>

                    <button onclick="saveSettings()" class="w-full py-3 rounded-xl bg-gradient-to-r from-bordeaux to-bordeauxlight text-ivory text-xs font-semibold cursor-pointer">Enregistrer les paramètres</button>

                    <button onclick="forceHardReloadApp()" class="w-full py-2.5 rounded-xl bg-cream border border-sand text-inkmuted text-xs font-semibold flex items-center justify-center gap-1.5 hover:text-bordeaux transition cursor-pointer">
                        <i class="ph ph-arrows-clockwise"></i>
                        <span>Forcer la mise à jour de l’app</span>
                    </button>

                    <p class="text-center text-[10px] uppercase tracking-[0.2em] text-inkmuted pt-1">Version v2.4 • Designed and built by AGO</p>
                </div>
            `);
        }

        function forceHardReloadApp() {
            try {
                if ('caches' in window) {
                    caches.keys().then(names => names.forEach(name => caches.delete(name)));
                }
            } catch (e) {}
            const baseUrl = window.location.origin + window.location.pathname;
            window.location.replace(`${baseUrl}?v=${Date.now()}`);
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (!container) return;
            if (state.currentView === 'sommelier') {
                container.innerHTML = renderSommelierPairingView();
            } else if (state.currentView === 'history') {
                container.innerHTML = renderHistoryView();
            } else if (state.currentView === 'cellar') {
                container.innerHTML = renderCellarView();
            } else if (state.currentView === 'detail') {
                container.innerHTML = renderWineDetailView();
            } else {
                container.innerHTML = renderHomeView();
            }
        }

        function exportCellarToExcelCsv() {
            try {
                const headers = ['Type', 'Nom / Cuvée', 'Domaine / Maison', 'Appellation', 'Millésime', 'Couleur', 'Cave', 'Quantité', 'Prix Unitaire (€)', 'Note /100', 'Date / Commentaire'];
                const rows = [headers];

                state.stockEntries.forEach(entry => {
                    const wine = state.wines.find(w => w.id === entry.wineId);
                    if (!wine) return;
                    const cave = state.caves.find(c => c.id === entry.caveId);
                    rows.push([
                        'En cave',
                        wine.name || '',
                        wine.producer || '',
                        wine.appellation || '',
                        wine.vintage || '',
                        wine.color || '',
                        cave ? cave.name : '',
                        entry.qty || 0,
                        wine.price?.average || entry.purchasePrice || 0,
                        '',
                        entry.notes || ''
                    ]);
                });

                (state.historyEntries || []).forEach(h => {
                    rows.push([
                        h.reason || 'Sortie de cave',
                        h.wineName || '',
                        h.producer || '',
                        '',
                        '',
                        h.color || '',
                        'Historique',
                        1,
                        h.priceAtConsumption || 0,
                        h.rating || '',
                        `${h.date || ''} ${h.comment || ''}`.trim()
                    ]);
                });

                const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `vin-sur-vin-${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('Export Excel (.csv) généré');
            } catch (e) {
                showToast('Erreur lors de l’export CSV');
            }
        }

        function handleExcelCsvImport(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = String(e.target.result || '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) {
                        showToast('Fichier CSV vide');
                        return;
                    }
                    const sep = lines[0].includes(';') ? ';' : ',';
                    let importedCount = 0;
                    const defaultCaveId = state.caves[0]?.id || 'cave-1';

                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                        const typeRow = cols[0] || 'En cave';
                        const name = cols[1] || '';
                        if (!name) continue;
                        if (typeRow.toLowerCase().includes('cave')) {
                            const wineId = 'wine-imp-' + Date.now() + '-' + i;
                            const priceNum = parseFloat(cols[8]) || 35;
                            const qtyNum = Math.max(1, parseInt(cols[7]) || 1);
                            state.wines.push({
                                id: wineId,
                                name,
                                producer: cols[2] || '',
                                appellation: cols[3] || '',
                                region: '',
                                country: 'France',
                                vintage: cols[4] || 'NV',
                                color: ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(cols[5]) ? cols[5] : 'Rouge',
                                grapes: '',
                                classification: '',
                                alcohol: '',
                                imageUrl: '',
                                drinkFrom: CURRENT_YEAR,
                                drinkPeak: CURRENT_YEAR + 2,
                                drinkTo: CURRENT_YEAR + 7,
                                price: { low: Math.round(priceNum * 0.85), average: priceNum, high: Math.round(priceNum * 1.2) },
                                tastingNotes: { eye: '', nose: '', palate: '' },
                                pairings: []
                            });
                            state.stockEntries.push({
                                id: 'stock-imp-' + Date.now() + '-' + i,
                                wineId,
                                caveId: defaultCaveId,
                                shelf: '',
                                row: '',
                                qty: qtyNum,
                                purchaseYear: CURRENT_YEAR,
                                purchasePrice: priceNum,
                                notes: cols[10] || ''
                            });
                            importedCount++;
                        }
                    }
                    saveState();
                    renderCurrentView();
                    showToast(`${importedCount} bouteille(s) importée(s)`);
                } catch (err) {
                    showToast('Format CSV non reconnu');
                }
            };
            reader.readAsText(file, 'utf-8');
        }

        function saveSettings() {
            const keyVal = document.getElementById('settings-api-key')?.value.trim() || '';
            state.apiKey = keyVal;
            saveState();
            closeModal();
            showToast('Paramètres enregistrés');
        }

        async function testGeminiApiKey() {
            const keyVal = document.getElementById('settings-api-key')?.value.trim() || '';
            const statusEl = document.getElementById('api-test-status');
            if (!keyVal) {
                if (statusEl) statusEl.innerHTML = '<span class="text-red-700 font-semibold">Collez d’abord votre clé API commençant par AIza...</span>';
                return;
            }
            state.apiKey = keyVal;
            saveState();
            if (statusEl) statusEl.innerHTML = '<span class="text-bordeaux font-semibold">Vérification de la connexion IA en cours...</span>';
            try {
                const reply = await callGeminiText('Réponds uniquement par le mot OK.');
                if (reply) {
                    if (statusEl) statusEl.innerHTML = '<span class="text-sage font-semibold">✓ Clé API active ! L’IA Vision et la recherche Web sont prêtes.</span>';
                }
            } catch (err) {
                if (statusEl) statusEl.innerHTML = `<span class="text-red-700 font-semibold">Erreur API : ${err.message}. Vérifiez votre clé sur aistudio.google.com.</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyAppIcon();
            updateNavUI();
            renderCurrentView();
            setupMobileFooterStabilizer();
        });

        // Empêche le menu du bas (footer) de remonter au-dessus du clavier sur iPhone
        function setupMobileFooterStabilizer() {
            const nav = document.getElementById('bottom-nav');
            if (!nav) return;

            const hideNav = () => nav.classList.add('translate-y-full', 'pointer-events-none');
            const showNav = () => nav.classList.remove('translate-y-full', 'pointer-events-none');

            document.addEventListener('focusin', (e) => {
                const tag = e.target?.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                    hideNav();
                }
            });

            document.addEventListener('focusout', () => {
                setTimeout(() => {
                    const activeTag = document.activeElement?.tagName;
                    if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
                        showNav();
                    }
                }, 120);
            });

            if (window.visualViewport) {
                const initialHeight = window.visualViewport.height;
                window.visualViewport.addEventListener('resize', () => {
                    if (window.visualViewport.height < initialHeight * 0.78) {
                        hideNav();
                    } else {
                        showNav();
                    }
                });
            }
        }
    </script>
