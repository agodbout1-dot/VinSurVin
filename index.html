        function applyAppIcon() {
            const headerEl = document.getElementById('header-app-icon');
            const touchLink = document.getElementById('app-touch-icon');
            const iconCfg = state.appIcon || { preset: 'wine', customUrl: '' };

            if (iconCfg.preset === 'custom' && iconCfg.customUrl) {
                if (headerEl) {
                    headerEl.innerHTML = `<img src="${iconCfg.customUrl}" alt="Icône Vin sur Vin" class="w-full h-full object-cover">`;
                }
                if (touchLink) {
                    touchLink.setAttribute('href', iconCfg.customUrl);
                }
                return;
            }

            const found = ICON_PRESETS.find(p => p.id === iconCfg.preset) || ICON_PRESETS[0];
            if (headerEl) {
                headerEl.innerHTML = found.id === 'vv'
                    ? `<span class="font-serif text-xs font-bold text-goldlight tracking-tighter">VV</span>`
                    : `<i data-lucide="${found.lucide}" class="w-4 h-4"></i>`;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            if (ctx && touchLink) {
                ctx.fillStyle = '#5C1826';
                ctx.fillRect(0, 0, 180, 180);
                ctx.strokeStyle = '#B39359';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(90, 90, 74, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#FBF9F5';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (found.id === 'vv') {
                    ctx.font = 'bold 62px Georgia, serif';
                    ctx.fillText('VV', 90, 94);
                } else {
                    ctx.font = '68px sans-serif';
                    ctx.fillText(found.symbol, 90, 94);
                }
                touchLink.setAttribute('href', canvas.toDataURL('image/png'));
            }
            if (window.lucide) lucide.createIcons();
        }

        function escapeCsvCell(val) {
            const str = String(val ?? '').replace(/\r?\n/g, ' ').trim();
            if (str.includes(';') || str.includes('"')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function exportCellarToExcelCsv() {
            const headers = [
                'Cave',
                'Clayette',
                'Rangee',
                'Quantite',
                'Domaine',
                'Cuvee',
                'Appellation',
                'Region',
                'Millesime',
                'Couleur',
                'Cepages',
                'Maturite',
                'Annee_Achat',
                'Prix_Achat_EUR',
                'Cote_Estimee_EUR',
                'Notes_Cave'
            ];

            const rows = state.stockEntries
                .filter(e => (parseInt(e.qty) || 0) > 0)
                .map(entry => {
                    const cave = state.caves.find(c => c.id === entry.caveId);
                    const wine = state.wines.find(w => w.id === entry.wineId) || {};
                    return [
                        cave ? cave.name : 'Cave 1',
                        entry.shelf || '',
                        entry.row || '',
                        parseInt(entry.qty) || 0,
                        wine.producer || '',
                        wine.name || '',
                        wine.appellation || '',
                        wine.region || '',
                        wine.vintage || '',
                        wine.color || '',
                        wine.grapes || '',
                        wine.maturity?.status || '',
                        entry.purchaseYear || CURRENT_YEAR,
                        parseFloat(entry.purchasePrice) || 0,
                        parseFloat(wine.price?.average) || 0,
                        entry.notes || ''
                    ].map(escapeCsvCell).join(';');
                });

            // UTF-8 BOM (\uFEFF) + séparateur ';' pour ouverture directe en colonnes propres dans Microsoft Excel & Numbers
            const csvContent = '\uFEFF' + [headers.join(';'), ...rows].join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Vin-sur-Vin-Cave-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            state.lastExcelExport = new Date().toLocaleDateString('fr-FR');
            saveState();
            showToast('Fichier Excel (.csv) généré — enregistrez-le sur iCloud Drive !');
        }

        function parseCsvLine(line, delimiter = ';') {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === delimiter && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        function handleImportExcelCsv(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            event.target.value = '';

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = (e.target.result || '').replace(/^\uFEFF/, '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                    if (lines.length < 2) {
                        showToast('Le fichier Excel semble vide.');

                    const delimiter = lines[0].includes(';') ? ';' : ',';
                    const newStockEntries = [];

                    for (let i = 1; i < lines.length; i++) {
                        const cols = parseCsvLine(lines[i], delimiter);

                            appellation, region, vintage, color, grapes,
                            maturityStatus, purchaseYearStr, purchasePriceStr,

                                },

                                },
                                pairings: {
                                    ideal: { dish: 'Accord à définir selon le millésime', reason: 'Importé depuis Excel.' },
                                    suggestions: [],
                                    original: ''
                                },
                                tasting: {
                                    aromas: 'Importé depuis votre fichier Excel.',
                                    structure: 'Non renseigné',
                                    intensity: 'Non renseigné',
                                    vintageQuality: 'Non renseigné',
                                    aiScore: '—',
                                    scoreExplanation: 'Importé depuis votre fichier Excel.',
                                    criticNotes: 'Non renseigné'

                                    domainStory: producer || 'Non renseigné',
                                    terroir: appellation || 'Non renseigné',

                                }
                            };
                            state.wines.push(wine);
                        }

                        newStockEntries.push({
                            id: 'stock-xl-' + Date.now() + '-' + i,
                            wineId: wine.id,
                            caveId: cave.id,

                    if (newStockEntries.length > 0) {

                    } else {
                        showToast('Aucune ligne valide trouvée dans le fichier Excel.');
                    }
                } catch (err) {
                    console.error('Erreur import Excel CSV:', err);

            reader.readAsText(file, 'UTF-8');

        async function callGeminiWithFallback(payload, useSearch = false) {
            const models = ['gemini-3-flash-preview', 'gemini-2.5-flash'];
            const trimmedKey = (state.apiKey || '').trim();
            const isOAuthOrExpressToken = trimmedKey.startsWith('AQ.') || trimmedKey.startsWith('ya29.');
            const keyParam = (!trimmedKey || isOAuthOrExpressToken) ? '?key=' : `?key=${encodeURIComponent(trimmedKey)}`;
            const headers = { 'Content-Type': 'application/json' };
            if (isOAuthOrExpressToken) {
                headers['Authorization'] = `Bearer ${trimmedKey}`;
            }

            let lastError = null;

            for (const model of models) {
                const requestBody = { ...payload };
                if (useSearch) {
                    requestBody.tools = [{ google_search: {} }];
                }

                for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent${keyParam}`, {
                            method: 'POST',
                            headers,
                            body: JSON.stringify(requestBody)
                        });
                        if (response.ok) {
                            return await response.json();
                        }
                        const errText = await response.text().catch(() => '');
                        lastError = new Error(`Erreur API (${response.status}) sur ${model}: ${errText}`);
                        if (response.status === 429 && attempt === 0) {
                            await new Promise(r => setTimeout(r, 1200));
                            continue;
                        }
                        break;
                    } catch (netErr) {
                        lastError = netErr;
                        if (attempt === 0) {
                            await new Promise(r => setTimeout(r, 1000));
                        }
                    }
                }
            }
            throw lastError;
        }

        async function compressImageFast(file, maxDimension = 1024, quality = 0.82) {
            try {
                if ('createImageBitmap' in window) {
                    const bitmap = await createImageBitmap(file);
                    let width = bitmap.width;
                    let height = bitmap.height;
                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(bitmap, 0, 0, width, height);
                    bitmap.close();
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    return {
                        dataUrl,
                        base64: dataUrl.split(',')[1],
                        mimeType: 'image/jpeg'
                    };
                }
            } catch (err) {
                console.warn('Repli FileReader standard:', err);
            }

            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            } else {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve({
                            dataUrl,
                            base64: dataUrl.split(',')[1],
                            mimeType: 'image/jpeg'
                        });
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleImageUpload(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            event.target.value = '';

            state.isAnalyzingPhoto = true;

        async function analyzeWineLabelWithGemini(base64Image, mimeType, previewDataUrl, manualHint = '') {
            const prompt = `Tu es un Maître Sommelier et expert en œnologie. Nous sommes en novembre 2026.
Analyse cette photographie ${manualHint ? `(précision utilisateur : ${manualHint})` : ''}.
IMPORTANT : La photo peut contenir UNE SEULE bouteille OU PLUSIEURS bouteilles (étagère, casier, table, caviste).
Identifie TOUTES les bouteilles de vin dont l'étiquette est lisible sur l'image (de 1 à 8 bouteilles maximum).
Utilise la recherche pour vérifier la cotation actuelle et l'histoire de chaque domaine.
RÈGLE ABSOLUE : N'invente jamais une information absente ou incertaine. Si une donnée (prix, cépage, critique) est introuvable, indique "Non renseigné".
Réponds UNIQUEMENT en JSON valide respectant strictement cette structure (un objet contenant un tableau "bottles") :
{
  "bottles": [
    {
      "name": "Nom de la cuvée ou du vin",
      "producer": "Domaine / Château / Maison",
      "appellation": "Appellation exacte",
      "region": "Région viticole",
      "country": "Pays",
      "vintage": "Année ou NV",
      "color": "Rouge | Blanc | Rosé | Champagne | Effervescent | Liquoreux",
      "grapes": "Cépages identifiés ou Non renseigné",
      "classification": "Grand Cru, Premier Cru, Village, etc. ou Non renseigné",
      "alcohol": "Degré d'alcool ou Non renseigné",
      "confidence": "Élevée | Moyenne | À vérifier",
      "price": {
        "low": 0,
        "average": 0,
        "high": 0,
        "cellarPremium": "Différence neuf vs cave",
        "sources": "Sources consultées",
        "date": "Novembre 2026",
        "reliability": "Élevée | Moyenne | Faible"
      },
      "maturity": {
        "status": "Trop jeune | À attendre | Prêt à boire | À son apogée | À boire rapidement",
        "windowStart": 2024,
        "peakStart": 2026,
        "peakEnd": 2030,
        "windowEnd": 2034,
        "remainingPotential": "Durée estimée",
        "idealMoment": "Conseil précis",
        "servingTemp": "Température idéale",
        "decanting": "Carafage / aération"
      },
      "pairings": {
        "ideal": { "dish": "Plat idéal", "reason": "Pourquoi cet accord fonctionne" },
        "suggestions": ["Plat 1", "Plat 2", "Plat 3"],
        "original": "Accord audacieux"
      },
      "tasting": {
        "aromas": "Profil aromatique",
        "structure": "Structure et équilibre",
        "intensity": "Intensité et complexité",
        "vintageQuality": "Qualité du millésime",
        "aiScore": 90,
        "scoreExplanation": "Explication argumentée (note estimée IA)",
        "criticNotes": "Notes critiques connues ou Non renseigné"
      },
      "history": {
        "domainStory": "Histoire du domaine",
        "terroir": "Particularités du terroir",
        "cuveeStory": "Histoire de la cuvée"
      }
    }
  ]
}`;

            const result = await callGeminiWithFallback({
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType, data: base64Image } }
                    ]
                }],
                generationConfig: {
                    temperature: 0.2,
                    responseMimeType: 'application/json'
                }
            }, true);

            const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
            const cleanedJson = rawText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
            const parsed = JSON.parse(cleanedJson);

            const list = Array.isArray(parsed.bottles) && parsed.bottles.length > 0
                ? parsed.bottles
                : (parsed.name ? [parsed] : []);

            return list.map((item, idx) => ({
                id: 'wine-' + Date.now() + '-' + idx,
                imageUrl: previewDataUrl,
                ...item
            }));
        }

        function renderMaturityTimeline(maturity) {
            if (!maturity || !maturity.windowStart || !maturity.windowEnd) return '';
            const start = parseInt(maturity.windowStart);
            const end = parseInt(maturity.windowEnd);
            const peakStart = parseInt(maturity.peakStart || start);
            const peakEnd = parseInt(maturity.peakEnd || end);
            const span = Math.max(1, end - start);

            const peakLeftPct = Math.max(0, Math.min(100, ((peakStart - start) / span) * 100));
            const peakWidthPct = Math.max(12, Math.min(100 - peakLeftPct, ((peakEnd - peakStart) / span) * 100));
            const nowPct = Math.max(0, Math.min(100, ((CURRENT_YEAR - start) / span) * 100));

            return `
            <div class="pt-3 pb-1 space-y-2">
                <div class="flex justify-between text-[10px] text-inkmuted font-medium">
                    <span>Ouverture : ${start}</span>
                    <span class="text-bordeaux font-semibold">Apogée : ${peakStart} – ${peakEnd}</span>
                    <span>Garde : ${end}</span>
                </div>
                <div class="relative h-3 rounded-full bg-sand/70 overflow-visible">
                    <div class="absolute top-0 bottom-0 rounded-full bg-bordeaux/80" style="left: ${peakLeftPct}%; width: ${peakWidthPct}%;"></div>
                    <div class="absolute -top-1.5 w-0.5 h-6 bg-gold" style="left: ${nowPct}%;">
                        <span class="absolute -top-4 -translate-x-1/2 text-[9px] font-bold text-gold bg-ink px-1.5 py-0.2 rounded">${CURRENT_YEAR}</span>
                    </div>
                </div>
            </div>
            `;

        function updatePairingSessionField(field, value) {
            state.pairingSession[field] = value;
            renderCurrentView();
        }

        function applyQuickCouncilPrompt(text) {
            state.pairingSession.promptText = text;
            renderCurrentView();
        }

        function toggleVoiceDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast('Dictée vocale non supportée sur ce navigateur. Utilisez le clavier.');
                return;
            }

            if (state.pairingSession.isListening && speechRecognitionInstance) {
                speechRecognitionInstance.stop();
                state.pairingSession.isListening = false;
                renderCurrentView();
                return;
            }

            speechRecognitionInstance = new SpeechRecognition();
            speechRecognitionInstance.lang = 'fr-FR';
            speechRecognitionInstance.continuous = false;
            speechRecognitionInstance.interimResults = false;

            speechRecognitionInstance.onstart = () => {
                state.pairingSession.isListening = true;
                renderCurrentView();
            };

            speechRecognitionInstance.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const current = state.pairingSession.promptText.trim();
                state.pairingSession.promptText = current ? `${current} ${transcript}` : transcript;
            };

            speechRecognitionInstance.onerror = () => {
                state.pairingSession.isListening = false;
                renderCurrentView();
                showToast('Micro interrompu ou permission refusée.');
            };

            speechRecognitionInstance.onend = () => {
                state.pairingSession.isListening = false;
                renderCurrentView();
            };

            speechRecognitionInstance.start();
        }

        async function runCellarPairingRecommendation() {
            const ps = state.pairingSession;
            if (!ps.promptText.trim()) {
                showToast('Décrivez ou dictez d’abord votre recette ou votre demande.');
                return;
            }

            const eligibleStocks = state.stockEntries.filter(e =>
                (ps.caveScope === 'all' || e.caveId === ps.caveScope) && (parseInt(e.qty) || 0) > 0
            );

            if (eligibleStocks.length === 0) {
                showToast('Aucune bouteille disponible dans la cave sélectionnée.');
                return;
            }

            ps.isAnalyzing = true;
            renderCurrentView();

            const inventorySummary = eligibleStocks.map(entry => {
                const wine = state.wines.find(w => w.id === entry.wineId);
                const cave = state.caves.find(c => c.id === entry.caveId);
                return {
                    stockEntryId: entry.id,
                    wineId: wine?.id,
                    name: wine?.name,
                    producer: wine?.producer,
                    appellation: wine?.appellation,
                    vintage: wine?.vintage,
                    color: wine?.color,
                    grapes: wine?.grapes,
                    maturity: wine?.maturity?.status,
                    decanting: wine?.maturity?.decanting,
                    servingTemp: wine?.maturity?.servingTemp,
                    caveName: cave?.name,
                    location: `${entry.shelf || ''} ${entry.row || ''}`.trim(),
                    qty: entry.qty
                };
            });

            try {
                const prompt = `Tu es un Maître Sommelier personnel. L'utilisateur a ${ps.guestsCount} convives et formule cette demande : "${ps.promptText}".
Voici l'inventaire RÉEL disponible dans sa cave : ${JSON.stringify(inventorySummary)}.
Choisis uniquement parmi ces bouteilles existantes. Réponds en JSON strict :
{
  "sommelierIntro": "Conseil personnalisé du sommelier (2 phrases max)",
  "bottlesToOpen": 1,
  "topPick": {
    "stockEntryId": "id exact de l'inventaire",
    "reason": "Pourquoi ce vin de sa cave est le meilleur choix pour sa recette et ses convives",
    "serviceAdvice": "Température et temps de carafage précis avant le repas"
  },
  "alternativePick": {
    "stockEntryId": "id exact d'une autre bouteille ou null",
    "reason": "Pourquoi cette alternative fonctionne"
  }
}`;

                const data = await callGeminiWithFallback({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
                }, false);

                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
                const cleanedJson = rawText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
                const parsed = JSON.parse(cleanedJson);

                const topItem = inventorySummary.find(i => i.stockEntryId === parsed.topPick?.stockEntryId) || inventorySummary[0];
                const altItem = parsed.alternativePick?.stockEntryId
                    ? inventorySummary.find(i => i.stockEntryId === parsed.alternativePick.stockEntryId)
                    : null;

                ps.recommendations = {
                    sommelierIntro: parsed.sommelierIntro || 'Voici ma sélection idéale tirée de votre cave.',
                    bottlesToOpen: parsed.bottlesToOpen || Math.max(1, Math.ceil(ps.guestsCount / 4)),
                    topPick: {
                        ...topItem,
                        reason: parsed.topPick?.reason || '',
                        serviceAdvice: parsed.topPick?.serviceAdvice || `${topItem.servingTemp} • ${topItem.decanting}`
                    },
                    alternativePick: altItem ? {
                        ...altItem,
                        reason: parsed.alternativePick?.reason || ''
                    } : null
                };
            } catch (err) {
                const textLower = ps.promptText.toLowerCase();
                let best = inventorySummary[0];
                if (textLower.includes('poisson') || textLower.includes('saint-jacques') || textLower.includes('apéritif') || textLower.includes('mer')) {
                    best = inventorySummary.find(i => i.color === 'Champagne' || i.color === 'Blanc') || inventorySummary[0];
                } else if (textLower.includes('agneau') || textLower.includes('gibier') || textLower.includes('bœuf') || textLower.includes('daube')) {
                    best = inventorySummary.find(i => i.appellation?.includes('Bandol')) || inventorySummary[0];
                }
                const alt = inventorySummary.find(i => i.stockEntryId !== best.stockEntryId) || null;
                const bottlesNeeded = Math.max(1, Math.ceil(ps.guestsCount / 4));

                ps.recommendations = {
                    sommelierIntro: `Pour ${ps.guestsCount} convive${ps.guestsCount > 1 ? 's' : ''}, voici ma recommandation sur-mesure à partir de vos flacons disponibles.`,
                    bottlesToOpen: bottlesNeeded,
                    topPick: {
                        ...best,
                        reason: `Ce ${best.name} ${best.vintage} (${best.maturity}) offre un équilibre idéal avec votre demande tout en valorisant l'évolution actuelle de votre cave.`,
                        serviceAdvice: `${best.servingTemp || '16°C'} — ${best.decanting || 'Ouverture 45 min avant'}`
                    },
                    alternativePick: alt ? {
                        ...alt,
                        reason: `Une alternative élégante pour varier les plaisirs ou accompagner un second service.`
                    } : null
                };
            } finally {
                ps.isAnalyzing = false;
                renderCurrentView();
            }
        }

        // ==========================================
        // 9. VUE MA CAVE (GESTION MULTI-CAVES)
        // ==========================================
        function renderCellarView() {
            const cf = state.cellarFilter;

            const filteredEntries = state.stockEntries.filter(entry => {
                if ((parseInt(entry.qty) || 0) <= 0) return false;
                if (cf.caveId !== 'all' && entry.caveId !== cf.caveId) return false;

                const wine = state.wines.find(w => w.id === entry.wineId);
                if (!wine) return false;

                if (cf.color !== 'all' && wine.color !== cf.color) return false;
                if (cf.maturity !== 'all' && wine.maturity?.status !== cf.maturity) return false;

                if (cf.search.trim()) {
                    const q = cf.search.toLowerCase();
                    const hay = `${wine.name} ${wine.producer} ${wine.appellation} ${wine.region} ${wine.vintage} ${entry.shelf} ${entry.row}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            const scopeEntries = state.stockEntries.filter(e => (parseInt(e.qty) || 0) > 0 && (cf.caveId === 'all' || e.caveId === cf.caveId));
            const totalBottles = scopeEntries.reduce((s, e) => s + (parseInt(e.qty) || 0), 0);
            const totalPurchase = scopeEntries.reduce((s, e) => s + ((parseInt(e.qty) || 0) * (parseFloat(e.purchasePrice) || 0)), 0);
            const totalEstimated = scopeEntries.reduce((s, e) => {
                const w = state.wines.find(item => item.id === e.wineId);
                const estPrice = parseFloat(w?.price?.average) || parseFloat(e.purchasePrice) || 0;
                return s + ((parseInt(e.qty) || 0) * estPrice);
            }, 0);
            const gain = totalEstimated - totalPurchase;
            const readyNowCount = scopeEntries.reduce((s, e) => {
                const w = state.wines.find(item => item.id === e.wineId);
                const st = w?.maturity?.status;
                return (st === 'À son apogée' || st === 'À boire rapidement') ? s + (parseInt(e.qty) || 0) : s;
            }, 0);

            const activeCaveObj = cf.caveId !== 'all' ? state.caves.find(c => c.id === cf.caveId) : null;
            const totalCapacity = activeCaveObj
                ? (parseInt(activeCaveObj.capacity) || 100)
                : state.caves.reduce((s, c) => s + (parseInt(c.capacity) || 0), 0);

            return `
            <div class="space-y-5 fade-in pb-6">
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.22em] text-gold font-semibold">Patrimoine Viticole</p>
                        <h2 class="font-serif text-3xl font-semibold text-ink">Ma Cave</h2>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="exportCellarToExcelCsv()" class="px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emeraldwine flex items-center gap-1.5 hover:bg-emerald-100 cursor-pointer">
                            <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Excel
                        </button>
                        <button onclick="openSettingsModal()" class="px-3 py-1.5 rounded-xl bg-offwhite border border-sand text-xs font-medium text-ink flex items-center gap-1.5 hover:border-gold cursor-pointer">
                            <i data-lucide="settings-2" class="w-3.5 h-3.5 text-bordeaux"></i> Configurer
                        </button>
                    </div>
                </div>

                <!-- Sélecteur de Cave (Toutes / Cave 1 / Cave 2) -->
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="setCellarFilter('caveId', 'all')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap border transition-all cursor-pointer ${cf.caveId === 'all' ? 'bg-bordeaux text-white border-bordeaux' : 'bg-offwhite text-ink border-sand'}">
                        Toutes les caves
                    </button>
                    ${state.caves.map(cave => `
                        <button onclick="setCellarFilter('caveId', '${cave.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap border transition-all cursor-pointer ${cf.caveId === cave.id ? 'bg-bordeaux text-white border-bordeaux' : 'bg-offwhite text-ink border-sand'}">
                            ${cave.name}
                        </button>
                    `).join('')}
                </div>

                ${activeCaveObj ? `
                <div class="px-3.5 py-2.5 rounded-xl bg-goldlight/70 border border-gold/30 flex items-center justify-between text-[11px] text-ink">
                    <span>${activeCaveObj.type} • ${activeCaveObj.shelves} clayettes</span>
                    <span class="font-semibold text-bordeaux">${activeCaveObj.temp}°C • ${activeCaveObj.humidity}% hygrométrie</span>
                </div>
                ` : ''}

                <!-- Tableau de Bord Patrimonial -->
                <section class="editorial-card p-4 grid grid-cols-3 gap-3 text-center">
                    <div>
                        <span class="text-[10px] uppercase tracking-wider text-inkmuted block">Stock</span>
                        <span class="font-serif text-2xl font-bold text-ink">${totalBottles}</span>
                        <span class="block text-[10px] text-inkmuted">/ ${totalCapacity} places</span>
                    </div>
                    <div class="border-x border-sand px-1">
                        <span class="text-[10px] uppercase tracking-wider text-inkmuted block">Valorisation</span>
                        <span class="font-serif text-2xl font-bold text-bordeaux">${Math.round(totalEstimated)} €</span>
                        <span class="block text-[10px] font-semibold ${gain >= 0 ? 'text-emeraldwine' : 'text-red-700'}">
                            ${gain >= 0 ? '+' : ''}${Math.round(gain)} € latent
                        </span>
                    </div>
                    <div>
                        <span class="text-[10px] uppercase tracking-wider text-inkmuted block">À ouvrir 2026</span>
                        <span class="font-serif text-2xl font-bold text-gold">${readyNowCount}</span>
                        <span class="block text-[10px] text-inkmuted">à l'apogée</span>
                    </div>
                </section>

                <!-- Recherche & Filtres -->
                <section class="space-y-2.5">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 text-inkmuted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="text" value="${cf.search}" oninput="setCellarFilter('search', this.value)" placeholder="Rechercher domaine, cuvée, clayette, millésime..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-offwhite border border-sand text-xs text-ink focus:outline-none focus:border-bordeaux">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select onchange="setCellarFilter('color', this.value)" class="px-3 py-2 rounded-xl bg-offwhite border border-sand text-xs text-ink">
                            <option value="all" ${cf.color === 'all' ? 'selected' : ''}>Toutes couleurs</option>
                            <option value="Rouge" ${cf.color === 'Rouge' ? 'selected' : ''}>Rouge</option>
                            <option value="Blanc" ${cf.color === 'Blanc' ? 'selected' : ''}>Blanc</option>
                            <option value="Rosé" ${cf.color === 'Rosé' ? 'selected' : ''}>Rosé</option>
                            <option value="Champagne" ${cf.color === 'Champagne' ? 'selected' : ''}>Champagne</option>
                            <option value="Liquoreux" ${cf.color === 'Liquoreux' ? 'selected' : ''}>Liquoreux</option>
                        </select>
                        <select onchange="setCellarFilter('maturity', this.value)" class="px-3 py-2 rounded-xl bg-offwhite border border-sand text-xs text-ink">
                            <option value="all" ${cf.maturity === 'all' ? 'selected' : ''}>Toutes maturités</option>
                            <option value="À son apogée" ${cf.maturity === 'À son apogée' ? 'selected' : ''}>À son apogée</option>
                            <option value="Prêt à boire" ${cf.maturity === 'Prêt à boire' ? 'selected' : ''}>Prêt à boire</option>
                            <option value="À attendre" ${cf.maturity === 'À attendre' ? 'selected' : ''}>À attendre</option>
                            <option value="Trop jeune" ${cf.maturity === 'Trop jeune' ? 'selected' : ''}>Trop jeune</option>
                            <option value="À boire rapidement" ${cf.maturity === 'À boire rapidement' ? 'selected' : ''}>À boire rapidement</option>
                        </select>
                    </div>
                </section>

                <!-- Liste des Lots en Cave -->
                <section class="space-y-3">
                    ${filteredEntries.length === 0 ? `
                        <div class="editorial-card p-6 text-center space-y-2">
                            <p class="font-serif text-lg font-semibold text-ink">Aucune bouteille trouvée</p>
                            <p class="text-xs text-inkmuted">Modifiez vos filtres ou ajoutez un vin scanné dans votre cave.</p>
                        </div>
                    ` : filteredEntries.map(entry => {
                        const wine = state.wines.find(w => w.id === entry.wineId);
                        const cave = state.caves.find(c => c.id === entry.caveId);
                        if (!wine) return '';

                        return `
                        <div class="editorial-card p-4 space-y-3">
                            <div onclick="navigateTo('detail', '${wine.id}')" class="flex items-start gap-3 cursor-pointer">
                                <img src="${wine.imageUrl}" onerror="this.src='https://placehold.co/150x200/5C1826/FBF9F5?text=Vin'" alt="${wine.name}" class="w-14 h-18 rounded-xl object-cover border border-sand shrink-0">
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between gap-2">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-bordeaux truncate">${cave ? cave.name : 'Cave'}</span>
                                        <span class="text-xs font-bold text-ink shrink-0">${entry.qty} btl</span>
                                    </div>
                                    <h4 class="font-serif text-lg font-bold text-ink leading-tight truncate mt-0.5">${wine.name} ${wine.vintage}</h4>
                                    <p class="text-xs text-inkmuted truncate">${wine.producer} • ${wine.appellation}</p>
                                    <div class="flex items-center gap-2 mt-2 flex-wrap">
                                        ${renderMaturityBadge(wine.maturity?.status)}
                                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-ivory border border-sand text-ink font-medium">
                                            📍 ${entry.shelf || 'Clayette N/C'}${entry.row ? ' · ' + entry.row : ''}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="pt-2.5 border-t border-sand flex items-center justify-between gap-2">
                                <button onclick="drinkOneBottle('${entry.id}')" class="px-3 py-1.5 rounded-lg bg-bordeaux text-white text-[11px] font-semibold flex items-center gap-1 hover:bg-bordeauxlight cursor-pointer">
                                    <i data-lucide="wine" class="w-3 h-3 text-goldlight"></i> -1 Boire
                                </button>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="openTransferModal('${entry.id}')" class="px-2.5 py-1.5 rounded-lg bg-ivory border border-sand text-[11px] font-medium text-ink hover:border-gold cursor-pointer">
                                        Transférer
                                    </button>
                                    <button onclick="incrementStockEntry('${entry.id}', 1)" class="px-2.5 py-1.5 rounded-lg bg-ivory border border-sand text-[11px] font-bold text-ink hover:border-gold cursor-pointer">
                                        +1
                                    </button>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </section>
            </div>
            `;
        }

        function setCellarFilter(key, value) {
            state.cellarFilter[key] = value;
            renderCurrentView();
        }

        // ==========================================
        // 10. ACTIONS STOCK & MODALES INTERACTIVES
        // ==========================================
        function incrementStockEntry(entryId, delta) {
            const entry = state.stockEntries.find(e => e.id === entryId);
            if (!entry) return;
            entry.qty = Math.max(0, (parseInt(entry.qty) || 0) + delta);
            saveState();
            renderCurrentView();
            showToast(delta > 0 ? 'Bouteille ajoutée au casier' : 'Stock mis à jour');
        }

        function drinkOneBottle(entryId) {
            const entry = state.stockEntries.find(e => e.id === entryId);
            if (!entry || (parseInt(entry.qty) || 0) <= 0) return;
            entry.qty = parseInt(entry.qty) - 1;
            saveState();
            renderCurrentView();
            openTastingNoteModal(entry.wineId, true);
        }

        function openModal(htmlContent) {
            const backdrop = document.getElementById('modal-backdrop');
            const container = document.getElementById('modal-container');
            if (!backdrop || !container) return;
            container.innerHTML = htmlContent;
            backdrop.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            if (backdrop) backdrop.classList.add('hidden');
        }

        function openAddStockModal(wineId) {
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;

            openModal(`
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gold font-semibold">Entrée en Cave</p>
                        <h3 class="font-serif text-2xl font-bold text-ink">${wine.name} ${wine.vintage}</h3>
                    </div>
                    <button onclick="closeModal()" class="p-1.5 rounded-full bg-ivory text-inkmuted cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>

                <form onsubmit="submitAddStock(event, '${wine.id}')" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold text-ink mb-1">Cave de destination</label>
                        <select name="caveId" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink font-medium">
                            ${state.caves.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-semibold text-ink mb-1">Clayette / Étagère</label>
                            <input type="text" name="shelf" value="Clayette 1" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Rangée / Colonne</label>
                            <input type="text" name="row" placeholder="Ex. Rangée avant" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2.5">
                        <div>
                            <label class="block font-semibold text-ink mb-1">Quantité</label>
                            <input type="number" name="qty" min="1" max="120" value="1" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink font-bold">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Année achat</label>
                            <input type="number" name="purchaseYear" value="${CURRENT_YEAR}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Prix unitaire (€)</label>
                            <input type="number" step="0.5" name="purchasePrice" value="${wine.price?.average || 0}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-ink mb-1">Commentaire personnel</label>
                        <input type="text" name="notes" placeholder="Ex. Acheté chez le caviste..." class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-bordeaux text-white font-semibold text-sm mt-2 cursor-pointer">
                        Enregistrer dans ma cave
                    </button>
                </form>
            </div>
            `);
        }

        function submitAddStock(event, wineId) {
            event.preventDefault();
            const fd = new FormData(event.target);
            state.stockEntries.unshift({
                id: 'stock-' + Date.now(),
                wineId,
                caveId: fd.get('caveId'),
                shelf: fd.get('shelf'),
                row: fd.get('row'),
                qty: parseInt(fd.get('qty')) || 1,
                purchaseYear: parseInt(fd.get('purchaseYear')) || CURRENT_YEAR,
                purchasePrice: parseFloat(fd.get('purchasePrice')) || 0,
                notes: fd.get('notes') || ''
            });
            saveState();
            closeModal();
            renderCurrentView();
            showToast('Flacon ajouté à votre cave');
        }

        function openTransferModal(entryId) {
            const entry = state.stockEntries.find(e => e.id === entryId);
            if (!entry) return;
            const wine = state.wines.find(w => w.id === entry.wineId);
            const otherCave = state.caves.find(c => c.id !== entry.caveId) || state.caves[0];

            openModal(`
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gold font-semibold">Mouvement de Stock</p>
                        <h3 class="font-serif text-2xl font-bold text-ink">Transférer ${wine?.name || 'ce lot'}</h3>
                    </div>
                    <button onclick="closeModal()" class="p-1.5 rounded-full bg-ivory text-inkmuted cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <form onsubmit="submitTransfer(event, '${entry.id}')" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold text-ink mb-1">Vers quelle cave ?</label>
                        <select name="targetCaveId" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink font-medium">
                            ${state.caves.map(c => `<option value="${c.id}" ${c.id === otherCave.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block font-semibold text-ink mb-1">Nb bouteilles</label>
                            <input type="number" name="qty" min="1" max="${entry.qty}" value="1" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink font-bold">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Nouvelle clayette</label>
                            <input type="text" name="shelf" value="Clayette 1" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Rangée</label>
                            <input type="text" name="row" placeholder="Avant" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-bordeaux text-white font-semibold text-sm cursor-pointer">
                        Confirmer le transfert
                    </button>
                </form>
            </div>
            `);
        }

        function submitTransfer(event, entryId) {
            event.preventDefault();
            const entry = state.stockEntries.find(e => e.id === entryId);
            if (!entry) return;
            const fd = new FormData(event.target);
            const moveQty = Math.min(parseInt(entry.qty), Math.max(1, parseInt(fd.get('qty')) || 1));

            entry.qty = parseInt(entry.qty) - moveQty;
            state.stockEntries.unshift({
                id: 'stock-' + Date.now(),
                wineId: entry.wineId,
                caveId: fd.get('targetCaveId'),
                shelf: fd.get('shelf'),
                row: fd.get('row'),
                qty: moveQty,
                purchaseYear: entry.purchaseYear,
                purchasePrice: entry.purchasePrice,
                notes: entry.notes
            });
            saveState();
            closeModal();
            renderCurrentView();
            showToast(`${moveQty} bouteille(s) transférée(s)`);
        }

        function openTastingNoteModal(wineId, fromDrinkAction = false) {
            const wine = state.wines.find(w => w.id === wineId);
            const today = new Date().toISOString().split('T')[0];

            openModal(`
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gold font-semibold">${fromDrinkAction ? 'Bouteille sortie de cave' : 'Carnet de Dégustation'}</p>
                        <h3 class="font-serif text-2xl font-bold text-ink">${wine?.name || 'Noter la dégustation'}</h3>
                    </div>
                    <button onclick="closeModal()" class="p-1.5 rounded-full bg-ivory text-inkmuted cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <form onsubmit="submitTastingNote(event, '${wineId}')" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-semibold text-ink mb-1">Date</label>
                            <input type="date" name="date" value="${today}" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Ma note (/100)</label>
                            <input type="number" name="score" min="50" max="100" value="92" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink font-bold">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-ink mb-1">Occasion / Accord dégusté</label>
                        <input type="text" name="occasion" placeholder="Ex. Dîner en famille, magret de canard..." class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                    </div>
                    <div>
                        <label class="block font-semibold text-ink mb-1">Impressions de dégustation</label>
                        <textarea name="comment" rows="3" required placeholder="Nez, équilibre, évolution en carafe..." class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink"></textarea>
                    </div>
                    <div class="flex gap-2">
                        ${fromDrinkAction ? `<button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-ivory border border-sand text-ink font-medium cursor-pointer">Plus tard</button>` : ''}
                        <button type="submit" class="flex-1 py-2.5 rounded-xl bg-bordeaux text-white font-semibold cursor-pointer">Enregistrer la note</button>
                    </div>
                </form>
            </div>
            `);
        }

        function submitTastingNote(event, wineId) {
            event.preventDefault();
            const fd = new FormData(event.target);
            state.tastingNotes.unshift({
                id: 'taste-' + Date.now(),
                wineId,
                date: fd.get('date'),
                score: parseInt(fd.get('score')) || 90,
                occasion: fd.get('occasion'),
                comment: fd.get('comment')
            });
            saveState();
            closeModal();
            renderCurrentView();
            showToast('Note de dégustation enregistrée');
        }

        function openCorrectionModal(wineId) {
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;

            openModal(`
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gold font-semibold">Vérification</p>
                        <h3 class="font-serif text-2xl font-bold text-ink">Corriger les informations</h3>
                    </div>
                    <button onclick="closeModal()" class="p-1.5 rounded-full bg-ivory text-inkmuted cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <form onsubmit="submitWineCorrection(event, '${wine.id}')" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold text-ink mb-1">Nom de la cuvée</label>
                        <input type="text" name="name" value="${wine.name}" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                    </div>
                    <div>
                        <label class="block font-semibold text-ink mb-1">Domaine / Producteur</label>
                        <input type="text" name="producer" value="${wine.producer}" required class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-semibold text-ink mb-1">Appellation</label>
                            <input type="text" name="appellation" value="${wine.appellation}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                        <div>
                            <label class="block font-semibold text-ink mb-1">Millésime</label>
                            <input type="text" name="vintage" value="${wine.vintage}" class="w-full p-2.5 rounded-xl bg-ivory border border-sand text-ink">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-bordeaux text-white font-semibold cursor-pointer">
                        Enregistrer les modifications
                    </button>
                </form>
            </div>
            `);
        }

        function submitWineCorrection(event, wineId) {
            event.preventDefault();
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;
            const fd = new FormData(event.target);
            wine.name = fd.get('name');
            wine.producer = fd.get('producer');
            wine.appellation = fd.get('appellation');
            wine.vintage = fd.get('vintage');
            saveState();
            closeModal();
            renderCurrentView();
            showToast('Fiche mise à jour');
        }

        // Modale : Configuration Excel, Clé API, Icône & Paramétrage des 2 Caves
        function openSettingsModal() {
            const c1 = state.caves[0] || DEFAULT_CAVES[0];
            const c2 = state.caves[1] || DEFAULT_CAVES[1];
            const activePreset = state.appIcon?.preset || 'wine';

            openModal(`
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gold font-semibold">Configuration</p>
                        <h3 class="font-serif text-2xl font-bold text-ink">Excel, IA & Caves</h3>
                    </div>
                    <button onclick="closeModal()" class="p-1.5 rounded-full bg-ivory text-inkmuted cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>

                <!-- Sauvegarde & Restauration Fichier Excel -->
                <div class="p-3.5 rounded-xl bg-emerald-50/80 border border-emerald-200 space-y-2.5 text-xs">
                    <div class="flex items-center justify-between">
                        <p class="font-bold text-emeraldwine flex items-center gap-1.5">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Livre de Cave Excel (.csv)
                        </p>
                        ${state.lastExcelExport ? `<span class="text-[10px] text-emeraldwine">Dernier : ${state.lastExcelExport}</span>` : ''}
                    </div>
                    <p class="text-[11px] text-inkmuted leading-relaxed">
                        Exportez votre cave dans un fichier Excel (.csv) à enregistrer sur <strong>iCloud Drive</strong>. Il s'ouvre directement dans Microsoft Excel, Numbers ou Google Sheets et permet de restaurer votre cave sur un nouvel iPhone.
                    </p>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="exportCellarToExcelCsv()" class="py-2.5 px-3 rounded-xl bg-emeraldwine text-white font-semibold text-[11px] flex items-center justify-center gap-1.5 cursor-pointer">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Exporter Excel
                        </button>
                        <button type="button" onclick="document.getElementById('import-excel-input').click()" class="py-2.5 px-3 rounded-xl bg-offwhite border border-emerald-300 text-emeraldwine font-semibold text-[11px] flex items-center justify-center gap-1.5 cursor-pointer">
                            <i data-lucide="upload" class="w-3.5 h-3.5"></i> Importer Excel
                        </button>
                    </div>
                </div>

                <!-- Choix de l'icône Vin sur Vin -->
                <div class="p-3.5 rounded-xl bg-ivory border border-sand space-y-2.5 text-xs">
                    <div class="flex items-center justify-between">
                        <p class="font-bold text-ink uppercase tracking-wider text-[10px]">Icône de l'application</p>
                        <button type="button" onclick="document.getElementById('custom-icon-input').click()" class="text-[10px] font-semibold text-bordeaux underline cursor-pointer">
                            + Importer une photo
                        </button>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        ${ICON_PRESETS.map(p => `
                            <button type="button" onclick="selectAppIconPreset('${p.id}')" class="p-2 rounded-xl border flex flex-col items-center gap-1 transition-all cursor-pointer ${activePreset === p.id ? 'bg-bordeaux text-white border-bordeaux shadow-xs' : 'bg-offwhite text-ink border-sand hover:border-gold'}">
                                <span class="w-7 h-7 rounded-full flex items-center justify-center ${activePreset === p.id ? 'bg-white/15 text-goldlight' : 'bg-bordeaux text-goldlight'}">
                                    ${p.id === 'vv' ? '<span class="font-serif text-[11px] font-bold">VV</span>' : `<i data-lucide="${p.lucide}" class="w-3.5 h-3.5"></i>`}
                                </span>
                                <span class="text-[9px] font-medium truncate w-full text-center">${p.label.split(' ')[0]}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>

                <form onsubmit="submitSettings(event)" class="space-y-4 text-xs">
                    <!-- Clé API Gemini -->
                    <div class="p-3.5 rounded-xl bg-goldlight/60 border border-gold/40 space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="block font-bold text-bordeaux">Clé API Google Gemini</label>
                            ${state.apiKey ? `<button type="button" onclick="clearApiKey()" class="text-[10px] font-semibold text-bordeaux underline cursor-pointer">Effacer la clé</button>` : ''}
                        </div>
                        <input type="password" id="settings-apikey-input" name="apiKey" value="${state.apiKey}" placeholder="Laisser vide dans Gemini Canvas (ou AIzaSy...)" class="w-full p-2.5 rounded-xl bg-offwhite border border-sand text-ink">
                        <p class="text-[10px] text-inkmuted leading-relaxed">
                            <strong>Hors Canvas (Netlify / iPhone) :</strong> renseignez votre clé gratuite <em>Google AI Studio</em> (<code>AIzaSy...</code>).
                        </p>
                    </div>

                    <!-- Cave 1 -->
                    <div class="p-3.5 rounded-xl bg-ivory border border-sand space-y-2.5">
                        <p class="font-bold text-ink uppercase tracking-wider text-[10px]">Cave 1</p>
                        <input type="text" name="c1_name" value="${c1.name}" required class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink font-medium">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[10px] text-inkmuted">Capacité</label>
                                <input type="number" name="c1_cap" value="${c1.capacity}" class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink">
                            </div>
                            <div>
                                <label class="text-[10px] text-inkmuted">Clayettes</label>
                                <input type="number" name="c1_shelves" value="${c1.shelves}" class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink">
                            </div>
                            <div>
                                <label class="text-[10px] text-inkmuted">Temp (°C)</label>
                                <input type="number" name="c1_temp" value="${c1.temp}" class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink">
                            </div>
                        </div>
                    </div>

                    <!-- Cave 2 -->
                    <div class="p-3.5 rounded-xl bg-ivory border border-sand space-y-2.5">
                        <p class="font-bold text-ink uppercase tracking-wider text-[10px]">Cave 2</p>
                        <input type="text" name="c2_name" value="${c2.name}" required class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink font-medium">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[10px] text-inkmuted">Capacité</label>
                                <input type="number" name="c2_cap" value="${c2.capacity}" class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink">
                            </div>
                            <div>
                                <label class="text-[10px] text-inkmuted">Clayettes</label>
                                <input type="number" name="c2_shelves" value="${c2.shelves}" class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink">
                            </div>
                            <div>
                                <label class="text-[10px] text-inkmuted">Temp (°C)</label>
                                <input type="number" name="c2_temp" value="${c2.temp}" class="w-full p-2 rounded-lg bg-offwhite border border-sand text-ink">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 rounded-xl bg-bordeaux text-white font-semibold text-sm cursor-pointer">
                        Enregistrer la configuration
                    </button>
                </form>

                <!-- Sauvegarde complète JSON & Export Application Autonome -->
                <div class="pt-3 border-t border-sand space-y-2">
                    <div class="flex items-center justify-between gap-2">
                        <button type="button" onclick="exportBackupJson()" class="flex-1 py-2 px-3 rounded-xl bg-ivory border border-sand text-[11px] font-semibold text-ink flex items-center justify-center gap-1.5 cursor-pointer hover:border-gold">
                            <i data-lucide="download" class="w-3.5 h-3.5 text-bordeaux"></i> Sauvegarde JSON
                        </button>
                        <button type="button" onclick="document.getElementById('import-json-input').click()" class="flex-1 py-2 px-3 rounded-xl bg-ivory border border-sand text-[11px] font-semibold text-ink flex items-center justify-center gap-1.5 cursor-pointer hover:border-gold">
                            <i data-lucide="upload" class="w-3.5 h-3.5 text-bordeaux"></i> Restaurer JSON
                        </button>
                    </div>
                    <button type="button" onclick="downloadStandaloneApp()" class="w-full py-2.5 px-3 rounded-xl bg-goldlight/80 border border-gold/40 text-[11px] font-semibold text-bordeaux flex items-center justify-center gap-1.5 cursor-pointer hover:border-bordeaux">
                        <i data-lucide="smartphone" class="w-3.5 h-3.5 text-bordeaux"></i> Télécharger le fichier de l'app (index.html)
                    </button>
                </div>
            </div>
            `);
        }

        function submitSettings(event) {
            event.preventDefault();
            const fd = new FormData(event.target);
            state.apiKey = (fd.get('apiKey') || '').trim();
            state.caves[0] = {
                ...state.caves[0],
                name: fd.get('c1_name'),
                capacity: parseInt(fd.get('c1_cap')) || 100,
                shelves: parseInt(fd.get('c1_shelves')) || 6,
                temp: parseInt(fd.get('c1_temp')) || 12
            };
            state.caves[1] = {
                ...state.caves[1],
                name: fd.get('c2_name'),
                capacity: parseInt(fd.get('c2_cap')) || 60,
                shelves: parseInt(fd.get('c2_shelves')) || 5,
                temp: parseInt(fd.get('c2_temp')) || 13
            };
            saveState();
            closeModal();
            renderCurrentView();
            showToast('Configuration enregistrée');
        }

        function clearApiKey() {
            state.apiKey = '';
            const input = document.getElementById('settings-apikey-input');
            if (input) input.value = '';
            saveState();
            showToast('Clé effacée — mode IA intégré activé');
        }

        function exportBackupJson() {
            const payload = {
                app: 'Vin sur Vin',
                exportedAt: new Date().toISOString(),
                caves: state.caves,
                wines: state.wines,
                stockEntries: state.stockEntries,
                tastingNotes: state.tastingNotes
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vin-sur-vin-cave-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Sauvegarde JSON de votre cave téléchargée');
        }

        function downloadStandaloneApp() {
            const htmlSource = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const blob = new Blob([htmlSource], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Fichier index.html téléchargé');
        }

        function handleImportBackup(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.caves) state.caves = parsed.caves;
                    if (parsed.wines) state.wines = parsed.wines;
                    if (parsed.stockEntries) state.stockEntries = parsed.stockEntries;
                    if (parsed.tastingNotes) state.tastingNotes = parsed.tastingNotes;
                    saveState();
                    closeModal();
                    renderCurrentView();
                    showToast('Cave restaurée avec succès');
                } catch (err) {
                    showToast('Fichier JSON invalide');
                }
            };
            reader.readAsText(file);
        }

        // Initialisation au chargement
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            applyAppIcon();
            updateCellarBadge();
            renderCurrentView();
        });
    </script>
</body>
</html>
