        const STORAGE_KEY = 'vin_sur_vin_ago_v2';
        const LEGACY_KEYS = ['vin_sur_vin_ago_v1', 'vinSurVinState'];
        const CURRENT_YEAR = new Date().getFullYear();
        let memoryFallbackStorage = {};

        function safeStorageGet(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (_) {
                return memoryFallbackStorage[key] || null;
            }
        }

        function safeStorageSet(key, val) {
            memoryFallbackStorage[key] = val;
            try {
                window.localStorage.setItem(key, val);
            } catch (_) {}
        }

        function applyAppIcon(overrideUrl = null, styleOverride = null) {
            try {
                const chosenStyle = styleOverride || (typeof state !== 'undefined' ? state.iconStyle : null) || 'glass-gold';
                const customUrl = overrideUrl || (typeof state !== 'undefined' ? state.customIconDataUrl : null);

                if (chosenStyle === 'custom' && customUrl) {
                    const appleIcon = document.getElementById('apple-touch-icon');
                    const favIcon = document.getElementById('favicon-link');
                    if (appleIcon) appleIcon.href = customUrl;
                    if (favIcon) favIcon.href = customUrl;
                    return customUrl;
                }

                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                if (!ctx) return '';

                const grad = ctx.createLinearGradient(0, 0, 512, 512);
                if (chosenStyle === 'ivory-bordeaux') {
                    grad.addColorStop(0, '#FBF9F5');
                    grad.addColorStop(1, '#EFE6D5');
                } else if (chosenStyle === 'noir-gold') {
                    grad.addColorStop(0, '#241E1C');
                    grad.addColorStop(1, '#120F0E');
                } else if (chosenStyle === 'champagne-gold') {
                    grad.addColorStop(0, '#DFC388');
                    grad.addColorStop(1, '#9E7B38');
                } else {
                    grad.addColorStop(0, '#6B1D32');
                    grad.addColorStop(1, '#360D18');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                const accentColor = chosenStyle === 'ivory-bordeaux'
                    ? '#5C1A2B'
                    : (chosenStyle === 'champagne-gold' ? '#1E1A18' : '#DFC388');
                const borderColor = chosenStyle === 'champagne-gold' ? '#5C1A2B' : '#C5A059';

                const drawRoundedRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 6;
                drawRoundedRect(64, 64, 384, 384, 72);
                ctx.stroke();

                ctx.lineWidth = 2;
                ctx.save();
                ctx.globalAlpha = 0.55;
                drawRoundedRect(82, 82, 348, 348, 58);
                ctx.stroke();
                ctx.restore();

                if (chosenStyle === 'monogram-ago') {
                    ctx.fillStyle = accentColor;
                    ctx.font = 'italic 700 132px "Cormorant Garamond", Georgia, serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('V·V', 256, 224);

                    ctx.fillStyle = borderColor;
                    ctx.font = '700 28px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('BY AGO', 256, 326);
                } else {
                    ctx.strokeStyle = accentColor;
                    ctx.fillStyle = accentColor;
                    ctx.lineWidth = 13;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    ctx.beginPath();
                    ctx.moveTo(182, 134);
                    ctx.lineTo(330, 134);
                    ctx.bezierCurveTo(330, 214, 294, 250, 256, 254);
                    ctx.bezierCurveTo(218, 250, 182, 214, 182, 134);
                    ctx.stroke();

                    ctx.save();
                    ctx.globalAlpha = 0.25;
                    ctx.beginPath();
                    ctx.moveTo(192, 186);
                    ctx.lineTo(320, 186);
                    ctx.bezierCurveTo(314, 226, 286, 246, 256, 250);
                    ctx.bezierCurveTo(226, 246, 198, 226, 192, 186);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    ctx.beginPath();
                    ctx.moveTo(256, 254);
                    ctx.lineTo(256, 360);
                    ctx.moveTo(204, 362);
                    ctx.lineTo(308, 362);
                    ctx.stroke();
                }

                const dataUrl = canvas.toDataURL('image/png');
                const appleIcon = document.getElementById('apple-touch-icon');
                const favIcon = document.getElementById('favicon-link');
                if (appleIcon) appleIcon.href = dataUrl;
                if (favIcon) favIcon.href = dataUrl;
                return dataUrl;
            } catch (err) {
                return '';
            }
        }

        function loadState() {
            const def = createDefaultState();
            try {
                let raw = safeStorageGet(STORAGE_KEY);
                if (!raw) {
                    for (const k of LEGACY_KEYS) {
                        const legacy = safeStorageGet(k);
                        if (legacy) {
                            raw = legacy;
                            break;
                        }
                    }
                }
                if (!raw) return def;
                const parsed = JSON.parse(raw);
                return {
                    ...def,
                    ...parsed,
                    caves: Array.isArray(parsed.caves) && parsed.caves.length ? parsed.caves : def.caves,
                    wines: Array.isArray(parsed.wines) ? parsed.wines : def.wines,
                    stockEntries: Array.isArray(parsed.stockEntries) ? parsed.stockEntries : def.stockEntries,
                    historyEntries: Array.isArray(parsed.historyEntries) ? parsed.historyEntries : def.historyEntries,
                    sommelierMessages: Array.isArray(parsed.sommelierMessages) && parsed.sommelierMessages.length ? parsed.sommelierMessages : def.sommelierMessages
                };
            } catch (e) {
                return def;
            }
        }

        let state = loadState();

        function saveState() {
            try {
                safeStorageSet(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Erreur sauvegarde:', e);
            }
        }

        // =========================================================================
        // 2. HELPERS & UTILITIES
        // =========================================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const label = document.getElementById('toast-msg');
            if (!toast || !label) return;
            label.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeHtmlAttr(str) {
            return escapeHtml(str).replace(/'/g, '&#39;');
        }

        function parseNumericScore(rawScore) {
            if (!rawScore) return -1;
            const match = String(rawScore).replace(',', '.').match(/(\d+(?:\.\d+)?)/);
            return match ? parseFloat(match[1]) : -1;
        }

        function parseCsvLineSemicolon(line) {
            const cols = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === ';' && !inQuotes) {
                    cols.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            cols.push(current.trim());
            return cols;
        }

        function getColorBadgeClass(color) {
            switch (color) {
                case 'Rouge': return 'bg-bordeaux/10 text-bordeaux border-bordeaux/20';
                case 'Blanc': return 'bg-amberlight text-amberwine border-gold/40';
                case 'Rosé': return 'bg-rose-50 text-rose-700 border-rose-200';
                case 'Champagne': return 'bg-gold/15 text-amberwine border-gold/40';
                default: return 'bg-cream text-inkmuted border-sand';
            }
        }

        function getReadinessStatus(wine) {
            const from = Number(wine.drinkFrom) || CURRENT_YEAR;
            const to = Number(wine.drinkTo) || (CURRENT_YEAR + 5);
            if (CURRENT_YEAR > to) {
                return { label: `Maturité dépassée (${to}) · À boire vite`, shortLabel: 'Maturité dépassée · À boire vite', tone: 'rose', ready: true, priority: 0 };
            }
            if (CURRENT_YEAR < from) {
                return { label: `À garder (${from})`, shortLabel: `À garder (${from})`, tone: 'amber', ready: false, priority: 2 };
            }
            return { label: 'À point', shortLabel: 'À point', tone: 'sage', ready: true, priority: 1 };
        }

        function getCellarMetrics() {
            let totalBottles = 0;
            let totalValue = 0;
            let readyCount = 0;

            state.stockEntries.forEach(entry => {
                const qty = Number(entry.qty) || 0;
                if (qty <= 0) return;
                const wine = state.wines.find(w => w.id === entry.wineId);
                if (!wine) return;
                const unitPrice = Number(wine.price?.average) || Number(entry.purchasePrice) || 0;
                totalBottles += qty;
                totalValue += qty * unitPrice;
                if (getReadinessStatus(wine).ready) {
                    readyCount += qty;
                }
            });

            const totalCapacity = state.caves.reduce((sum, c) => sum + (Number(c.capacity) || 0), 0);
            return { totalBottles, totalValue, readyCount, totalCapacity };
        }

        // =========================================================================
        // 3. GEMINI AI SERVICE (VISION + TEXT + FAST MODEL CACHING)
        // =========================================================================
        function extractJsonFromText(rawText) {
            if (!rawText) throw new Error('Réponse vide du modèle IA');
            const cleaned = rawText.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
            try {
                return JSON.parse(cleaned);
            } catch (_) {
                const firstBrace = cleaned.indexOf('{');
                const firstBracket = cleaned.indexOf('[');
                let start = -1;
                let end = -1;
                if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
                    start = firstBracket;
                    end = cleaned.lastIndexOf(']');
                } else if (firstBrace !== -1) {
                    start = firstBrace;
                    end = cleaned.lastIndexOf('}');
                }
                if (start !== -1 && end > start) {
                    return JSON.parse(cleaned.slice(start, end + 1));
                }
                throw new Error('Format JSON non reconnu dans la réponse IA');
            }
        }

        async function callGeminiApi(options) {
            const {
                prompt,
                imageBase64 = null,
                mimeType = 'image/jpeg',
                jsonMode = false,
                contents: customContents = null,
                systemInstruction = null
            } = options;

            const key = (state.apiKey || '').trim();
            if (!key) {
                throw new Error('Clé API Gemini manquante. Ajoutez-la dans les Paramètres (en haut à droite).');
            }

            const defaultModels = [
                'gemini-3.8-flash',
                'gemini-3.5-flash-lite',
                'gemini-3.5-flash',
                'gemini-3.6-flash',
                'gemini-2.5-flash',
                'gemini-4-hydrogen'
            ];
            const preferred = (state.preferredModel || 'auto').trim();
            const cached = (state.cachedWorkingModel || '').trim();

            let models;
            if (preferred && preferred !== 'auto') {
                models = [preferred, ...defaultModels.filter(m => m !== preferred)];
            } else if (cached) {
                models = [cached, ...defaultModels.filter(m => m !== cached)];
            } else {
                models = defaultModels;
            }

            const errors = [];

            for (const model of models) {
                try {
                    const parts = [{ text: prompt }];
                    if (imageBase64) {
                        parts.push({
                            inlineData: {
                                mimeType,
                                data: imageBase64
                            }
                        });
                    }

                    const generationConfig = {
                        temperature: 0.2
                    };
                    if (jsonMode) {
                        generationConfig.responseMimeType = 'application/json';
                    }

                    const contents = Array.isArray(customContents) && customContents.length
                        ? customContents
                        : [{ role: 'user', parts }];

                    const body = {
                        contents,
                        generationConfig
                    };
                    if (systemInstruction) {
                        body.systemInstruction = {
                            parts: [{ text: systemInstruction }]
                        };
                    }

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data?.error?.message || `HTTP ${res.status}`);
                    }
                    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n').trim();
                    if (!text) throw new Error('Réponse vide de Gemini');

                    if (state.cachedWorkingModel !== model) {
                        state.cachedWorkingModel = model;
                        saveState();
                    }
                    return text;
                } catch (err) {
                    if (state.cachedWorkingModel === model) {
                        state.cachedWorkingModel = '';
                        saveState();
                    }
                    errors.push(`${model}: ${err.message}`);
                }
            }

            const summary = errors.slice(0, 3).join(' | ');
            throw new Error(summary || 'Impossible de joindre Gemini.');
        }

                const active = state.currentView === tab || (tab === 'cellar' && state.currentView === 'detail');
                btn.className = `nav-btn flex flex-col items-center justify-center gap-1 cursor-pointer transition ${active ? 'text-bordeaux font-semibold' : 'text-inkmuted font-medium'}`;

                    ${history.length === 0 ? `

                                <p class="text-[10px] uppercase text-inkmuted font-semibold">Parker</p>

        // 6. SOMMELIER IA (TEXTE + MICRO VOCAL)

        function renderSommelierView() {
            return `
                <div class="space-y-3.5 animate-view">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-[10px] uppercase tracking-[0.18em] text-gold font-bold">Sommelier Personnel IA</p>
                            <h2 class="font-serif text-2xl font-semibold text-ink">Conseil &amp; Accords</h2>
                        </div>
                        <button onclick="resetSommelierChat()" class="text-[11px] font-semibold text-inkmuted hover:text-bordeaux px-2.5 py-1 rounded-full bg-cream border border-sand cursor-pointer">
                            Effacer
                        </button>
                    </div>

                    <div id="sommelier-chat-box" class="card-glass rounded-3xl p-4 space-y-3 max-h-[55vh] overflow-y-auto">
                        ${(state.sommelierMessages || []).map(m => `
                            <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl text-xs leading-relaxed ${m.role === 'user' ? 'bg-bordeaux text-ivory rounded-br-sm' : 'bg-ivory border border-sand text-ink rounded-bl-sm'}">
                                    ${formatSommelierMessage(m.text)}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                        <button onclick="quickSommelierRefine('Plutôt en blanc ou champagne')" class="px-2.5 py-1 rounded-full bg-cream border border-sand text-[11px] font-medium text-ink shrink-0 cursor-pointer hover:border-gold">Plutôt blanc / bulles</button>
                        <button onclick="quickSommelierRefine('Uniquement dans ma cave de Saint-Cloud')" class="px-2.5 py-1 rounded-full bg-cream border border-sand text-[11px] font-medium text-ink shrink-0 cursor-pointer hover:border-gold">Cave Saint-Cloud</button>
                        <button onclick="quickSommelierRefine('Une bouteille plus accessible')" class="px-2.5 py-1 rounded-full bg-cream border border-sand text-[11px] font-medium text-ink shrink-0 cursor-pointer hover:border-gold">Plus accessible</button>
                        <button onclick="quickSommelierRefine('À ouvrir absolument maintenant')" class="px-2.5 py-1 rounded-full bg-cream border border-sand text-[11px] font-medium text-ink shrink-0 cursor-pointer hover:border-gold">À boire vite</button>
                    </div>

                    <div class="card-glass rounded-3xl p-3 flex items-center gap-2">
                        <button id="voice-btn" onclick="toggleVoiceSommelier()" title="Dicter ma demande" class="relative w-10 h-10 rounded-full bg-cream border border-sand text-bordeaux flex items-center justify-center shrink-0 cursor-pointer transition">
                            <i class="ph-fill ph-microphone text-lg"></i>
                        </button>
                        <input id="sommelier-input" type="text" onkeydown="if(event.key==='Enter') sendSommelierPrompt()" placeholder="Ex : Côte de bœuf, ou affiner (blanc, Saint-Cloud...)" class="flex-1 bg-transparent text-xs focus:outline-none px-1">
                        <button onclick="sendSommelierPrompt()" class="px-4 py-2 rounded-2xl bg-bordeaux text-ivory text-xs font-semibold shrink-0 cursor-pointer">
                            Envoyer
                        </button>
                    </div>
                </div>
            `;
        }

        function formatSommelierMessage(rawText) {
            return escapeHtml(rawText || '')
                .replace(/\*\*(.+?)\*\*/g, '<strong class="font-bold text-bordeaux">$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function scrollSommelierToBottom() {
            const box = document.getElementById('sommelier-chat-box');
            if (box) {
                box.scrollTop = box.scrollHeight;
            }
        }

        function quickSommelierRefine(text) {
            const input = document.getElementById('sommelier-input');
            if (!input) return;
            input.value = text;
            sendSommelierPrompt();
        }

        function resetSommelierChat() {
            state.sommelierMessages = [
                {
                    role: 'assistant',
                    text: 'Bonjour ! Quel plat préparez-vous ou quelle occasion célébrez-vous ? Vous pouvez ensuite affiner librement (couleur, cave, budget, convives...).'
                }
            ];
            saveState();
            renderCurrentView();
        }

        function toggleVoiceSommelier() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                showToast('Dictée vocale non supportée sur ce navigateur');
                return;
            }
            const btn = document.getElementById('voice-btn');
            const recognition = new SpeechRec();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            if (btn) btn.classList.add('voice-pulse', 'bg-bordeaux', 'text-ivory');
            showToast('Parlez maintenant...');

            recognition.onresult = (event) => {
                const transcript = event.results?.[0]?.[0]?.transcript || '';
                const input = document.getElementById('sommelier-input');
                if (input && transcript) {
                    input.value = transcript;
                    sendSommelierPrompt();
                }
            };
            recognition.onerror = () => {
                showToast('Micro interrompu');
            };
            recognition.onend = () => {
                if (btn) btn.classList.remove('voice-pulse', 'bg-bordeaux', 'text-ivory');
            };
            recognition.start();
        }

        async function sendSommelierPrompt() {
            const input = document.getElementById('sommelier-input');
            const userText = input?.value.trim();
            if (!userText) return;

            input.value = '';
            const priorMessages = (state.sommelierMessages || []).filter(m =>
                m && m.text && m.text !== 'Analyse de votre cave en cours...'
            );

            state.sommelierMessages.push({ role: 'user', text: userText });
            state.sommelierMessages.push({ role: 'assistant', text: 'Analyse de votre cave en cours...' });
            renderCurrentView();
            scrollSommelierToBottom();

            const cellarSummary = state.stockEntries
                .filter(s => (Number(s.qty) || 0) > 0)
                .map(s => {
                    const w = state.wines.find(x => x.id === s.wineId);
                    const c = state.caves.find(x => x.id === s.caveId);
                    if (!w) return '';
                    const readiness = getReadinessStatus(w);
                    return `- ${w.name} ${w.vintage} | Couleur: ${w.color} | Appellation: ${w.appellation || w.region || 'N/A'} | Cépages: ${w.grapes || 'N/A'} | Cave: ${c?.name || 'N/A'} | Stock: ${s.qty} btl(s) | Statut maturité: ${readiness.label} (${w.drinkFrom}-${w.drinkTo}) | Parker: ${w.scores?.parker || 'N/A'} | Vivino: ${w.scores?.vivino || 'N/A'} | Cote: ${w.price?.average || 0}€`;
                })
                .filter(Boolean)
                .join('\n');

            const recentHistorySummary = (state.historyEntries || [])
                .slice(0, 8)
                .map(h => `- ${h.wineName} (${h.date || ''}, ${h.reason || 'Bue'})${h.comment ? ' : "' + h.comment + '"' : ''}`)
                .join('\n');

            const systemInstruction = `Tu es un chef sommelier personnel de très haut niveau. Tu dialogues avec le propriétaire de ces caves (année en cours : ${CURRENT_YEAR}).

INVENTAIRE ACTUEL EN CAVE :
${cellarSummary || '(Aucune bouteille actuellement en cave)'}

DERNIÈRES DÉGUSTATIONS (HISTORIQUE) :
${recentHistorySummary || '(Aucun historique)'}

RÈGLES STRICTES DE CONVERSATION :
1. Lis attentivement TOUT l'historique de la conversation ci-dessous et applique STRICTEMENT chaque contrainte ou affinement demandé par l'utilisateur (ex: changement de couleur, cave spécifique comme Saint-Cloud ou Carqueiranne, budget max, bouteille à boire en urgence, exclusion d'une proposition précédente).
2. Ne propose JAMAIS une bouteille qui n'est pas dans l'INVENTAIRE ACTUEL EN CAVE (sauf si l'utilisateur demande explicitement quoi acheter à l'extérieur).
3. Si aucune bouteille en cave ne correspond à un critère strict, dis-le honnêtement et propose l'alternative la plus proche réellement disponible dans sa cave en précisant dans quelle cave elle se trouve.
4. Sois concis, structuré et précis : cite le nom exact du vin, son millésime, sa cave, son statut d'apogée, la température de service et le temps d'ouverture/carafage.`;

            const conversationContents = [];
            const recentTurns = priorMessages.slice(-10);
            for (const msg of recentTurns) {
                const geminiRole = msg.role === 'user' ? 'user' : 'model';
                if (conversationContents.length === 0 && geminiRole === 'model') continue;
                conversationContents.push({
                    role: geminiRole,
                    parts: [{ text: msg.text }]
                });
            }
            conversationContents.push({
                role: 'user',
                parts: [{ text: userText }]
            });

            try {
                const reply = await callGeminiApi({
                    prompt: userText,
                    contents: conversationContents,
                    systemInstruction
                });
                state.sommelierMessages[state.sommelierMessages.length - 1] = { role: 'assistant', text: reply };
            } catch (err) {
                state.sommelierMessages[state.sommelierMessages.length - 1] = { role: 'assistant', text: `Erreur : ${err.message}` };
            }
            saveState();
            renderCurrentView();
            scrollSommelierToBottom();
        }

        function confirmConsumeBottle(stockEntryId) {
            const entry = state.stockEntries.find(s => s.id === stockEntryId);
            if (!entry) return;
            const wine = state.wines.find(w => w.id === entry.wineId);
            if (!wine) return;

            const currentQty = Math.max(1, Number(entry.qty) || 1);
            const qtyConsumed = Math.min(currentQty, Math.max(1, Number(document.getElementById('consume-qty')?.value) || 1));
            const reason = document.getElementById('consume-reason')?.value || 'Dégustée / Bue';
            const comment = document.getElementById('consume-comment')?.value.trim() || '';
            const unitPrice = Number(wine.price?.average) || Number(entry.purchasePrice) || 0;

            entry.qty = currentQty - qtyConsumed;
            if (entry.qty <= 0) {
                state.stockEntries = state.stockEntries.filter(s => s.id !== entry.id);
            }

            state.historyEntries.unshift({
                id: 'hist-' + Date.now(),
                wineId: wine.id,
                wineName: `${wine.name} ${wine.vintage || ''}`.trim(),
                producer: wine.producer || '',
                color: wine.color || 'Rouge',
                date: new Date().toLocaleDateString('fr-FR'),
                reason,
                qtyConsumed,
                priceAtConsumption: unitPrice,
                parkerScore: wine.scores?.parker || '',
                vivinoScore: wine.scores?.vivino || '',
                comment
            });

            saveState();
            closeModal();
            renderCurrentView();
            showToast(`${qtyConsumed} bouteille(s) enregistrée(s) dans l'Historique`);
        }

        async function refreshEditWineModalWithAi() {
            const name = document.getElementById('edit-wine-name')?.value.trim();
            const producer = document.getElementById('edit-wine-producer')?.value.trim() || '';
            const appellation = document.getElementById('edit-wine-appellation')?.value.trim() || '';
            const color = document.getElementById('edit-wine-color')?.value || 'Rouge';
            const vintage = document.getElementById('edit-wine-vintage')?.value.trim() || 'NV';
            if (!name) {
                showToast('Saisissez le nom du vin');
                return;
            }

            const statusEl = document.getElementById('edit-wine-ai-status');
            if (statusEl) {
                statusEl.classList.remove('hidden');
                statusEl.innerHTML = `<i class="ph-fill ph-sparkle animate-pulse"></i><span>Recherche IA en cours pour ${escapeHtml(name)} ${escapeHtml(vintage)}...</span>`;
            }

            try {
                const updated = await fetchVintageValuationFromAi({ name, producer, appellation, color, vintage });
                if (updated && typeof updated === 'object') {
                    if (updated.priceAverage !== undefined && !isNaN(Number(updated.priceAverage))) {
                        const pEl = document.getElementById('edit-wine-price');
                        if (pEl) pEl.value = Math.max(0, Math.round(Number(updated.priceAverage)));
                    }
                    if (updated.parkerScore) {
                        const pkEl = document.getElementById('edit-wine-parker');
                        if (pkEl) pkEl.value = String(updated.parkerScore);
                    }
                    if (updated.vivinoScore) {
                        const vvEl = document.getElementById('edit-wine-vivino');
                        if (vvEl) vvEl.value = String(updated.vivinoScore);
                    }
                    if (updated.drinkFrom) {
                        const dfEl = document.getElementById('edit-wine-drink-from');
                        if (dfEl) dfEl.value = Number(updated.drinkFrom);
                    }
                    if (updated.drinkTo) {
                        const dtEl = document.getElementById('edit-wine-drink-to');
                        if (dtEl) dtEl.value = Number(updated.drinkTo);
                    }
                }
                if (statusEl) {
                    statusEl.innerHTML = `<i class="ph-fill ph-check-circle text-sage"></i><span class="text-sage">Champs actualisés par l'IA — cliquez sur Enregistrer pour valider.</span>`;
                }
            } catch (err) {
                if (statusEl) {
                    statusEl.innerHTML = `<i class="ph-fill ph-warning-circle"></i><span>Erreur IA : ${escapeHtml(err.message)}</span>`;
                }
            }
        }

        function saveEditedWine(wineId, stockEntryId) {
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;

            const name = document.getElementById('edit-wine-name')?.value.trim();
            if (!name) {
                showToast('Le nom de la cuvée est requis');
                return;
            }

            wine.name = name;
            wine.producer = document.getElementById('edit-wine-producer')?.value.trim() || '';
            wine.vintage = document.getElementById('edit-wine-vintage')?.value.trim() || 'NV';
            wine.color = document.getElementById('edit-wine-color')?.value || 'Rouge';
            wine.appellation = document.getElementById('edit-wine-appellation')?.value.trim() || '';
            wine.grapes = document.getElementById('edit-wine-grapes')?.value.trim() || '';

            const avgPrice = Math.max(0, Number(document.getElementById('edit-wine-price')?.value) || 0);
            wine.price = {
                low: Math.round(avgPrice * 0.85),
                average: avgPrice,
                high: Math.round(avgPrice * 1.2)
            };

            wine.scores = {
                parker: document.getElementById('edit-wine-parker')?.value.trim() || '',
                vivino: document.getElementById('edit-wine-vivino')?.value.trim() || ''
            };

            const dFrom = Number(document.getElementById('edit-wine-drink-from')?.value) || CURRENT_YEAR;
            const dTo = Number(document.getElementById('edit-wine-drink-to')?.value) || (dFrom + 8);
            wine.drinkFrom = dFrom;
            wine.drinkTo = dTo;
            wine.drinkPeak = Math.round((dFrom + dTo) / 2);

            const pairingsRaw = document.getElementById('edit-wine-pairings')?.value || '';
            wine.pairings = pairingsRaw.split(',').map(s => s.trim()).filter(Boolean);

            if (stockEntryId) {
                const entry = state.stockEntries.find(s => s.id === stockEntryId);
                if (entry) {
                    const newCaveId = document.getElementById('edit-wine-cave')?.value;
                    if (newCaveId) entry.caveId = newCaveId;
                    const newQty = Math.max(1, Number(document.getElementById('edit-wine-qty')?.value) || 1);
                    entry.qty = newQty;
                    entry.notes = document.getElementById('edit-wine-notes')?.value.trim() || '';
                }
            }

            saveState();
            closeModal();
            renderCurrentView();
            showToast('Fiche du vin mise à jour');
        }

        function findOrCreateWineAndAddStock({
            name, producer, appellation, region, country, vintage, color,
            grapes, classification, alcohol, imageUrl, drinkFrom, drinkPeak, drinkTo,
            parkerScore, vivinoScore, price, pairings, caveId, qty, notes
        }) {
            const norm = (s) => String(s || '').trim().toLowerCase();
            let existingWine = state.wines.find(w =>
                norm(w.name) === norm(name) &&
                norm(w.producer) === norm(producer) &&
                norm(w.vintage) === norm(vintage)
            );

            if (existingWine) {
                if (parkerScore && !existingWine.scores?.parker) {
                    existingWine.scores = { ...(existingWine.scores || {}), parker: parkerScore };
                }
                if (vivinoScore && !existingWine.scores?.vivino) {
                    existingWine.scores = { ...(existingWine.scores || {}), vivino: vivinoScore };
                }
                if (imageUrl && !existingWine.imageUrl) {
                    existingWine.imageUrl = imageUrl;
                }
                const existingEntry = state.stockEntries.find(s => s.wineId === existingWine.id && s.caveId === caveId);
                if (existingEntry) {
                    existingEntry.qty = (Number(existingEntry.qty) || 0) + qty;
                    return { merged: true };
                }
                state.stockEntries.unshift({
                    id: 'st-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                    wineId: existingWine.id,
                    caveId,
                    shelf: '',
                    row: '',
                    qty,
                    purchaseYear: CURRENT_YEAR,
                    purchasePrice: price,
                    notes: notes || ''
                });
                return { merged: false };
            }

            const wineId = 'wine-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            state.wines.unshift({
                id: wineId,
                name: name || 'Cuvée',
                producer: producer || '',
                appellation: appellation || '',
                region: region || '',
                country: country || 'France',
                vintage: vintage || 'NV',
                color: color || 'Rouge',
                grapes: grapes || '',
                classification: classification || '',
                alcohol: alcohol || '',
                imageUrl: imageUrl || '',
                drinkFrom: Number(drinkFrom) || CURRENT_YEAR,
                drinkPeak: Number(drinkPeak) || (CURRENT_YEAR + 3),
                drinkTo: Number(drinkTo) || (CURRENT_YEAR + 8),
                scores: {
                    parker: parkerScore || '',
                    vivino: vivinoScore || ''
                },
                price: { low: Math.round(price * 0.85), average: price, high: Math.round(price * 1.2) },
                tastingNotes: { eye: '', nose: '', palate: '' },
                pairings: Array.isArray(pairings) ? pairings : []
            });
            state.stockEntries.unshift({
                id: 'st-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                wineId,
                caveId,
                shelf: '',
                row: '',
                qty,
                purchaseYear: CURRENT_YEAR,
                purchasePrice: price,
                notes: notes || ''
            });
            return { merged: false };
        }

        function compressImageToDataUrl(file, maxSide = 900, quality = 0.76) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Impossible de lire l’image'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Image invalide'));
                    img.onload = () => {
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSide || h > maxSide) {
                            if (w > h) {
                                h = Math.round((h * maxSide) / w);
                                w = maxSide;
                            } else {
                                w = Math.round((w * maxSide) / h);
                                h = maxSide;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

            openModal(`

            try {
                const imageDataUrl = await compressImageToDataUrl(file, 900, 0.76);
                const base64Data = imageDataUrl.split(',')[1];

                const prompt = `Analyse cette photo de bouteille(s) de vin ou de champagne. Identifie TOUTES les bouteilles visibles (1 ou plusieurs).

                const parsed = extractJsonFromText(rawResponse);

            const producer = document.getElementById('scan-producer')?.value.trim() || '';
            const appellation = document.getElementById('scan-appellation')?.value.trim() || '';
            const color = document.getElementById('scan-color')?.value || 'Rouge';
            const vintage = document.getElementById('scan-vintage')?.value.trim() || 'NV';
            if (!name || !state.apiKey) return;

            const statusEl = document.getElementById('scan-ai-status');
            if (statusEl) {
                statusEl.classList.remove('hidden');
                statusEl.innerHTML = `<i class="ph-fill ph-sparkle animate-pulse"></i><span>Actualisation IA pour le millésime ${escapeHtml(vintage)}...</span>`;
            }

            try {
                const updated = await fetchVintageValuationFromAi({ name, producer, appellation, color, vintage });
                if (updated && typeof updated === 'object') {
                    if (updated.priceAverage !== undefined && !isNaN(Number(updated.priceAverage))) {
                        const pEl = document.getElementById('scan-price');
                        if (pEl) pEl.value = Math.max(0, Math.round(Number(updated.priceAverage)));
                    }
                    if (updated.parkerScore) {
                        const pkEl = document.getElementById('scan-parker');
                        if (pkEl) pkEl.value = String(updated.parkerScore);
                    }
                    if (updated.vivinoScore) {
                        const vvEl = document.getElementById('scan-vivino');
                        if (vvEl) vvEl.value = String(updated.vivinoScore);
                    }
                    if (window.__scanBatch && window.__scanBatch.items[window.__scanBatch.currentIndex]) {
                        const cur = window.__scanBatch.items[window.__scanBatch.currentIndex];
                        if (updated.drinkFrom) cur.drinkFrom = Number(updated.drinkFrom);
                        if (updated.drinkTo) cur.drinkTo = Number(updated.drinkTo);
                    }
                }
                if (statusEl) {
                    statusEl.innerHTML = `<i class="ph-fill ph-check-circle text-sage"></i><span class="text-sage">Cote &amp; notes mises à jour pour ${escapeHtml(vintage)}.</span>`;
                }
            } catch (err) {
                if (statusEl) {
                    statusEl.innerHTML = `<i class="ph-fill ph-warning-circle"></i><span>${escapeHtml(err.message)}</span>`;
                }
            }
        }

        async function updateWineVintageWithAi(wineId, newVintageRaw) {
            const wine = state.wines.find(w => w.id === wineId);
            if (!wine) return;
            const newVintage = String(newVintageRaw || '').trim() || wine.vintage;
            wine.vintage = newVintage;
            saveState();

            const btn = document.getElementById('detail-vintage-ai-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="ph-fill ph-sparkle animate-pulse text-bordeaux"></i><span>Recherche IA...</span>`;
            }

            try {
                const updated = await fetchVintageValuationFromAi({
                    name: wine.name,
                    producer: wine.producer,
                    appellation: wine.appellation,
                    color: wine.color,
                    vintage: newVintage
                });
                if (updated && typeof updated === 'object') {
                    if (updated.priceAverage !== undefined && !isNaN(Number(updated.priceAverage))) {
                        const avg = Math.max(0, Math.round(Number(updated.priceAverage)));
                        wine.price = { low: Math.round(avg * 0.85), average: avg, high: Math.round(avg * 1.2) };
                    }
                    if (updated.parkerScore) {
                        wine.scores = { ...(wine.scores || {}), parker: String(updated.parkerScore) };
                    }
                    if (updated.vivinoScore) {
                        wine.scores = { ...(wine.scores || {}), vivino: String(updated.vivinoScore) };
                    }
                    if (updated.drinkFrom) wine.drinkFrom = Number(updated.drinkFrom);
                    if (updated.drinkTo) wine.drinkTo = Number(updated.drinkTo);
                    wine.drinkPeak = Math.round(((wine.drinkFrom || CURRENT_YEAR) + (wine.drinkTo || CURRENT_YEAR + 8)) / 2);
                }
                saveState();
                renderCurrentView();
                showToast(`Millésime ${newVintage} actualisé par l'IA`);
            } catch (err) {
                saveState();
                renderCurrentView();
                showToast(`Millésime enregistré (${err.message})`);
            }
        }

        function selectAppIconStyle(styleId) {
            state.iconStyle = styleId;
            saveState();
            const url = applyAppIcon(null, styleId);
            const preview = document.getElementById('settings-icon-preview');
            if (preview && url) preview.src = url;
            openSettingsModal();
            showToast('Style d’icône mis à jour');
        }

        function handleCustomIconUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    const minSide = Math.min(img.width, img.height);
                    const sx = (img.width - minSide) / 2;
                    const sy = (img.height - minSide) / 2;
                    ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 512, 512);
                    const squareUrl = canvas.toDataURL('image/png');
                    state.iconStyle = 'custom';
                    state.customIconDataUrl = squareUrl;
                    saveState();
                    applyAppIcon(squareUrl, 'custom');
                    const preview = document.getElementById('settings-icon-preview');
                    if (preview) preview.src = squareUrl;
                    showToast('Icône personnalisée appliquée');
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function openSettingsModal() {

                    </div>

                    <div class="p-3.5 rounded-2xl bg-cream/70 border border-sand space-y-2 text-xs">
                        <label class="text-[10px] font-bold uppercase text-bordeaux block">Clé API Google Gemini</label>
                        <input type="password" id="settings-api-key" value="${escapeHtmlAttr(state.apiKey || '')}" placeholder="AIza..." class="w-full p-2.5 rounded-xl bg-ivory border border-sand font-mono">

                            <select id="settings-model" class="w-full p-2 rounded-xl bg-ivory border border-sand text-xs font-semibold">
                                <option value="auto" ${(state.preferredModel || 'auto') === 'auto' ? 'selected' : ''}>Auto (rapide avec mémorisation)</option>
                                <option value="gemini-3.8-flash" ${state.preferredModel === 'gemini-3.8-flash' ? 'selected' : ''}>gemini-3.8-flash</option>
                                <option value="gemini-3.5-flash-lite" ${state.preferredModel === 'gemini-3.5-flash-lite' ? 'selected' : ''}>gemini-3.5-flash-lite</option>
                                <option value="gemini-3.5-flash" ${state.preferredModel === 'gemini-3.5-flash' ? 'selected' : ''}>gemini-3.5-flash</option>
                                <option value="gemini-3.6-flash" ${state.preferredModel === 'gemini-3.6-flash' ? 'selected' : ''}>gemini-3.6-flash</option>
                                <option value="gemini-2.5-flash" ${state.preferredModel === 'gemini-2.5-flash' ? 'selected' : ''}>gemini-2.5-flash</option>
                                <option value="gemini-4-hydrogen" ${state.preferredModel === 'gemini-4-hydrogen' ? 'selected' : ''}>gemini-4-hydrogen</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between gap-2 pt-0.5">
                            <span id="api-test-status" class="text-[11px] text-inkmuted">${state.cachedWorkingModel ? `Modèle actif : ${escapeHtml(state.cachedWorkingModel)}` : 'Stockée uniquement sur cet appareil.'}</span>
                            <button type="button" onclick="testAndSaveApiKey()" class="shrink-0 px-3 py-1.5 rounded-xl bg-gold/25 border border-gold/50 text-ink font-semibold text-[11px] cursor-pointer hover:bg-gold transition">
                                Tester la clé
                            </button>
                        </div>
                    </div>

                    <!-- Icône de l'application sur iPhone -->
                    <div class="p-3.5 rounded-2xl bg-cream/70 border border-sand space-y-2.5 text-xs">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase text-bordeaux">Icône écran d'accueil iPhone</span>
                            <img id="settings-icon-preview" src="${currentIconUrl}" alt="Aperçu icône" class="w-11 h-11 rounded-2xl border border-gold/50 shadow-sm object-cover">
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                            ${styles.map(st => `
                                <button onclick="selectAppIconStyle('${st.id}')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold border cursor-pointer ${state.iconStyle === st.id ? 'bg-bordeaux text-ivory border-bordeaux' : 'bg-ivory text-ink border-sand'}">
                                    ${st.label}

        function saveSettings() {
            const keyInput = document.getElementById('settings-api-key');
            const modelSelect = document.getElementById('settings-model');
            if (keyInput) {
                state.apiKey = keyInput.value.trim();
            }
            if (modelSelect) {
                state.preferredModel = modelSelect.value;
                state.cachedWorkingModel = '';
            }
            saveState();
            closeModal();
            renderCurrentView();
            showToast('Paramètres enregistrés');
        }

        async function testAndSaveApiKey() {
            const keyInput = document.getElementById('settings-api-key');
            const modelSelect = document.getElementById('settings-model');
            const statusEl = document.getElementById('api-test-status');
            const candidateKey = (keyInput?.value || '').trim();
            if (!candidateKey) {
                if (statusEl) statusEl.innerHTML = '<span class="text-bordeaux font-semibold">Veuillez saisir une clé API.</span>';
                showToast('Saisissez votre clé API Gemini');
                return;
            }
            state.apiKey = candidateKey;
            if (modelSelect) state.preferredModel = modelSelect.value;
            state.cachedWorkingModel = '';
            saveState();
            if (statusEl) statusEl.innerHTML = '<span class="text-inkmuted">Test de connexion en cours...</span>';
            try {
                await callGeminiApi({ prompt: 'OK' });
                if (statusEl) statusEl.innerHTML = `<span class="text-sage font-bold">✓ Clé valide (${escapeHtml(state.cachedWorkingModel)})</span>`;
                showToast('Clé API Gemini validée et enregistrée');
            } catch (err) {
                if (statusEl) statusEl.innerHTML = `<span class="text-rose-700 font-semibold">${escapeHtml(err.message)}</span>`;
                showToast('Échec du test de clé API');
            }
        }

        function exportCellarToExcelCsv() {
            try {
                const cleanCell = (val) => String(val ?? '')
                    .replace(/\r?\n+/g, ' · ')
                    .replace(/"/g, '""')
                    .trim();

                const headers = ['Type', 'Nom / Cuvée', 'Domaine / Maison', 'Appellation', 'Millésime', 'Couleur', 'Cave', 'Quantité', 'Prix Unitaire (€)', 'Note Parker', 'Note Vivino', 'Date / Commentaire'];
                const rows = [headers];
                const exportedWineIds = new Set();

                state.stockEntries.forEach(entry => {
                    const qty = Number(entry.qty) || 0;
                    if (qty <= 0) return;
                    const wine = state.wines.find(w => w.id === entry.wineId);
                    if (!wine) return;
                    exportedWineIds.add(wine.id);
                    const cave = state.caves.find(c => c.id === entry.caveId);
                    rows.push([
                        'En cave',
                        wine.name || '',
                        wine.producer || '',
                        wine.appellation || '',
                        wine.vintage || '',
                        wine.color || '',
                        cave ? cave.name : (state.caves[0]?.name || ''),
                        qty,
                        wine.price?.average || entry.purchasePrice || 0,
                        wine.scores?.parker || '',
                        wine.scores?.vivino || '',
                        entry.notes || ''
                    ]);
                });

                // Sécurité : exporte également toute cuvée présente dans la base sans entrée de stock active
                state.wines.forEach(wine => {
                    if (exportedWineIds.has(wine.id)) return;
                    const wasConsumedOnly = (state.historyEntries || []).some(h => h.wineId === wine.id);
                    if (wasConsumedOnly) return;
                    rows.push([
                        'En cave',
                        wine.name || '',
                        wine.producer || '',
                        wine.appellation || '',
                        wine.vintage || '',
                        wine.color || '',
                        state.caves[0]?.name || '',
                        1,
                        wine.price?.average || 0,
                        wine.scores?.parker || '',
                        wine.scores?.vivino || '',
                        ''
                    ]);
                });

                (state.historyEntries || []).forEach(h => {
                    const linkedWine = state.wines.find(w => w.id === h.wineId);
                    rows.push([
                        h.reason || 'Sortie de cave',
                        h.wineName || '',
                        h.producer || '',
                        linkedWine?.appellation || '',
                        linkedWine?.vintage || '',
                        h.color || '',
                        'Historique',
                        Number(h.qtyConsumed) || 1,
                        Number(h.priceAtConsumption) || 0,
                        h.parkerScore || linkedWine?.scores?.parker || '',
                        h.vivinoScore || linkedWine?.scores?.vivino || '',
                        `${h.date || ''} ${h.comment || ''}`.trim()
                    ]);
                });

                const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${cleanCell(v)}"`).join(';')).join('\r\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `VinSurVin_Cave_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 1500);
                showToast(`Export Excel prêt (${rows.length - 1} lignes)`);
            } catch (err) {
                showToast('Erreur lors de l’export CSV');
            }
        }

        function handleExcelCsvImport(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const text = String(reader.result || '').replace(/^\uFEFF/, '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) {
                        showToast('Fichier CSV vide');
                        return;
                    }
                    const defaultCaveId = state.caves[0]?.id || 'cave-1';
                    let importedCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const cols = parseCsvLineSemicolon(lines[i]);
                        const typeRow = cols[0] || 'En cave';
                        const name = cols[1];
                        if (!name) continue;

                        const priceNum = parseFloat(cols[8]) || 35;
                        const qtyNum = Math.max(1, parseInt(cols[7]) || 1);
                        const hasExtendedCols = cols.length >= 12;
                        const parkerScore = hasExtendedCols ? (cols[9] || '') : '';
                        const vivinoScore = hasExtendedCols ? (cols[10] || '') : '';
                        const noteText = hasExtendedCols ? (cols[11] || '') : (cols[10] || '');
                        const colorVal = ['Rouge', 'Blanc', 'Rosé', 'Champagne'].includes(cols[5]) ? cols[5] : 'Rouge';

                        if (typeRow.toLowerCase().includes('cave')) {
                            const caveNameRaw = (cols[6] || '').trim();
                            let matchedCave = state.caves.find(c => c.name.toLowerCase() === caveNameRaw.toLowerCase());
                            if (!matchedCave && caveNameRaw && caveNameRaw.toLowerCase() !== 'historique') {
                                matchedCave = {
                                    id: 'cave-' + Date.now() + '-' + i,
                                    name: caveNameRaw,
                                    location: '',
                                    capacity: 100
                                };
                                state.caves.push(matchedCave);
                            }
                            findOrCreateWineAndAddStock({
                                name,
                                producer: cols[2] || '',
                                appellation: cols[3] || '',
                                vintage: cols[4] || 'NV',
                                color: colorVal,
                                parkerScore,
                                vivinoScore,
                                price: priceNum,
                                qty: qtyNum,
                                caveId: matchedCave ? matchedCave.id : defaultCaveId,
                                notes: noteText
                            });
                            importedCount++;
                        } else {
                            const dateMatch = noteText.match(/^(\d{2}\/\d{2}\/\d{4})\s*(.*)$/);
                            const parsedDate = dateMatch ? dateMatch[1] : new Date().toLocaleDateString('fr-FR');
                            const parsedComment = dateMatch ? dateMatch[2] : noteText;
                            const alreadyExists = state.historyEntries.some(h =>
                                h.wineName === name &&
                                h.date === parsedDate &&
                                Number(h.qtyConsumed) === qtyNum &&
                                (h.comment || '') === parsedComment
                            );
                            if (!alreadyExists) {
                                state.historyEntries.push({
                                    id: 'hist-' + Date.now() + '-' + i,
                                    wineId: '',
                                    wineName: name,
                                    producer: cols[2] || '',
                                    color: colorVal,
                                    date: parsedDate,
                                    reason: typeRow,
                                    qtyConsumed: qtyNum,
                                    priceAtConsumption: priceNum,
                                    parkerScore,
                                    vivinoScore,
                                    comment: parsedComment
                                });
                                importedCount++;
                            }
                        }
                    }

                    saveState();
                    closeModal();
                    renderCurrentView();
                    showToast(`${importedCount} ligne(s) importée(s)`);
                } catch (err) {
                    showToast('Erreur lecture CSV');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Initialisation immédiate ou au chargement DOM
        function initVinSurVinApp() {
            applyAppIcon();
            renderCurrentView();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVinSurVinApp);
        } else {
            initVinSurVinApp();
        }
    </script>
