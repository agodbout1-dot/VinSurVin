        async function detectBestGeminiModel(apiKey) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data?.error?.message || `HTTP ${res.status}`);
            }
            const available = (data.models || [])
                .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
                .map(m => m.name.replace(/^models\//, ''));

            const preferredOrder = [
                'gemini-3-flash-preview',
                'gemini-2.5-flash',
                'gemini-2.5-flash-lite',
                'gemini-2.0-flash',
                'gemini-1.5-flash'
            ];
            for (const p of preferredOrder) {
                if (available.includes(p)) return p;
            }
            const anyFlash = available.find(name => name.includes('flash') && !name.includes('image') && !name.includes('tts') && !name.includes('live'));
            return anyFlash || available[0] || 'gemini-2.5-flash';
        }

        async function saveAndTestApiKey() {
            const key = document.getElementById('settings-api-key').value.trim().replace(/\s+/g, '');
            state.apiKey = key;
            state.cachedWorkingModel = '';
            saveState();
            updateHeaderAndNav();

            if (!key) {
                showToast('Clé API effacée');
                return;
            }

            showToast('Vérification de la clé auprès de Google Gemini...');
            try {
                const bestModel = await detectBestGeminiModel(key);
                state.cachedWorkingModel = bestModel;
                state.selectedModel = bestModel;
                saveState();
                const res = await callGeminiApi('Réponds OK.');
                if (res) {
                    showToast(`Clé valide · Modèle ${state.cachedWorkingModel}`);
                    closeModal();
                }
            } catch (e) {
                showToast(`Erreur clé API : ${e.message}`);
            }
        }

        async function runMemoryDiagnosticAndRecovery() {
            let recovered = 0;
            try {
                for (let i = 0; i < window.localStorage.length; i++) {
                    const k = window.localStorage.key(i);
                    if (!k) continue;
                    const raw = window.localStorage.getItem(k);
                    if (!raw || !raw.startsWith('{')) continue;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed?.wines)) {
                        parsed.wines.forEach(w => {
                            if (w?.id && !state.wines.some(existing => existing.id === w.id)) {
                                state.wines.push(w);
                                recovered++;
                            }
                        });
                    }
                    if (Array.isArray(parsed?.stockEntries)) {
                        parsed.stockEntries.forEach(st => {
                            if (st?.wineId && st.quantity > 0 && !state.stockEntries.some(x => x.wineId === st.wineId && x.caveId === st.caveId)) {
                                state.stockEntries.push(st);
                                recovered++;
                            }
                        });
                    }
                }
            } catch (_) {}

            state.wines.forEach(w => {
                const hasStock = state.stockEntries.some(s => s.wineId === w.id);
                if (!hasStock) {
                    state.stockEntries.push({ id: 'st_rec_' + Date.now() + Math.random(), wineId: w.id, caveId: state.caves[0].id, quantity: 1 });
                    recovered++;
                }
            });

            saveState();
            renderApp();
            showToast(recovered > 0 ? `${recovered} élément(s) restauré(s) !` : `Base IndexedDB saine (${state.wines.length} cuvées actives)`);
        }

        // =========================================================================
        // 12. APPELS API GEMINI RAPIDES (DÉTECTION AUTOMATIQUE DU MODÈLE)
        // =========================================================================
        function extractJsonFromText(text) {
            if (!text) return null;
            const cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try { return JSON.parse(cleaned); } catch (_) {}
            const match = cleaned.match(/\{[\s\S]*\}/);
            if (match) {
                try { return JSON.parse(match[0]); } catch (_) {}
            }
            return null;
        }

        async function callGeminiApi(prompt, imageObj = null) {
            const cleanKey = (state.apiKey || '').trim().replace(/\s+/g, '');
            if (!cleanKey) throw new Error('Clé API manquante');

            if (!state.cachedWorkingModel) {
                try {
                    state.cachedWorkingModel = await detectBestGeminiModel(cleanKey);
                    saveState();
                } catch (_) {}
            }

            const modelsToTry = Array.from(new Set([
                state.cachedWorkingModel,
                'gemini-3-flash-preview',
                'gemini-2.5-flash',
                'gemini-2.5-flash-lite',
                'gemini-2.0-flash'
            ].filter(Boolean)));

            const parts = [{ text: prompt }];
            if (imageObj?.base64Data) {
                parts.push({
                    inlineData: {
                        mimeType: imageObj.mimeType || 'image/jpeg',
                        data: imageObj.base64Data
                    }
                });
            }

            let lastErr = null;
            for (const model of modelsToTry) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts }],
                            generationConfig: { temperature: 0.2 }
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        lastErr = new Error(data?.error?.message || `HTTP ${res.status}`);
                        continue;
                    }
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        state.cachedWorkingModel = model;
                        saveState();
                        return text;
                    }
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('Impossible de joindre Gemini');
        }

        async function callGeminiChat(systemInstruction, contents) {
            const cleanKey = (state.apiKey || '').trim().replace(/\s+/g, '');
            if (!cleanKey) throw new Error('Clé API manquante');

            if (!state.cachedWorkingModel) {
                try {
                    state.cachedWorkingModel = await detectBestGeminiModel(cleanKey);
                    saveState();
                } catch (_) {}
            }

            const modelsToTry = Array.from(new Set([
                state.cachedWorkingModel,
                'gemini-3-flash-preview',
                'gemini-2.5-flash',
                'gemini-2.5-flash-lite',
                'gemini-2.0-flash'
            ].filter(Boolean)));

            let lastErr = null;
            for (const model of modelsToTry) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cleanKey)}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            systemInstruction: { parts: [{ text: systemInstruction }] },
                            contents,
                            generationConfig: { temperature: 0.4 }
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        lastErr = new Error(data?.error?.message || `HTTP ${res.status}`);
                        continue;
                    }
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        state.cachedWorkingModel = model;
                        saveState();
                        return text;
                    }
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('Impossible de joindre Gemini');
        }

        // =========================================================================
        // 13. EXPORT & IMPORT CSV EXCEL COMPLET
        // =========================================================================
        function sanitizeCsvCell(val) {
            const str = String(val ?? '').replace(/[\r\n]+/g, ' ').replace(/"/g, '""');
            return `"${str}"`;
        }

        function exportCellarToExcelCsv() {
            const headers = [
                'Statut', 'Cave', 'Cuvée', 'Domaine', 'Millésime', 'Couleur',
                'Appellation', 'Quantité', 'Prix Unitaire (€)', 'Valeur Totale (€)',
                'Parker', 'Vivino', 'Apogée Début', 'Apogée Fin', 'Date Sortie', 'Notes'
            ];
            const rows = [headers.map(sanitizeCsvCell).join(';')];

            state.wines.forEach(w => {
                const stocks = state.stockEntries.filter(s => s.wineId === w.id && s.quantity > 0);
                if (stocks.length === 0) {
                    rows.push([
                        'En cave (0)', getCaveName(state.caves[0].id), w.name, w.domain, w.vintage, w.color,
                        w.appellation, 0, w.estimatedPrice || 0, 0,
                        w.parkerScore, w.vivinoScore, w.drinkFrom, w.drinkTo, '', w.notes
                    ].map(sanitizeCsvCell).join(';'));
                } else {
                    stocks.forEach(st => {
                        const qty = Number(st.quantity) || 0;
                        const price = Number(w.estimatedPrice) || 0;
                        rows.push([
                            'En cave', getCaveName(st.caveId), w.name, w.domain, w.vintage, w.color,
                            w.appellation, qty, price, qty * price,
                            w.parkerScore, w.vivinoScore, w.drinkFrom, w.drinkTo, '', w.notes
                        ].map(sanitizeCsvCell).join(';'));
                    });
                }
            });

            state.historyEntries.forEach(h => {
                const qty = Number(h.quantity) || 1;
                const price = Number(h.unitPrice) || 0;
                rows.push([
                    'Historique', h.caveName, h.wineName, '', h.vintage, h.color,
                    '', qty, price, qty * price,
                    h.parkerScore, h.vivinoScore, '', '', h.date, h.note
                ].map(sanitizeCsvCell).join(';'));
            });

            const csvContent = '\uFEFF' + rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Vin_sur_Vin_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 800);

            showToast(`Export Excel prêt (${rows.length - 1} lignes)`);
        }

        function handleExcelCsvImport(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            event.target.value = '';

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = String(e.target.result || '').replace(/^\uFEFF/, '');
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) { showToast('Fichier CSV vide'); return; }

                    const sep = lines[0].includes(';') ? ';' : ',';
                    let importedCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                        if (cols.length < 8) continue;

                        const [statut, caveName, cuvee, domaine, millesime, couleur, appellation, qtyStr, priceStr, , parker, vivino, drinkFrom, drinkTo, dateSortie, notes] = cols;
                        if (!cuvee) continue;

                        let cave = state.caves.find(c => c.name.toLowerCase() === (caveName || '').toLowerCase());
                        if (!cave && caveName) {
                            cave = { id: 'cave_' + Date.now() + '_' + i, name: caveName, subtitle: 'Importée' };
                            state.caves.push(cave);
                        }
                        const targetCaveId = cave ? cave.id : state.caves[0].id;
                        const qty = Number(qtyStr) || 0;
                        const price = Number(priceStr) || 0;

                        if ((statut || '').toLowerCase().includes('historique')) {
                            const exists = state.historyEntries.some(h => h.wineName === cuvee && h.date === dateSortie && String(h.vintage) === String(millesime));
                            if (!exists) {
                                state.historyEntries.push({
                                    id: 'hist_imp_' + Date.now() + '_' + i,
                                    date: dateSortie || new Date().toISOString().slice(0, 10),
                                    wineName: cuvee,
                                    vintage: millesime || '',
                                    color: couleur || 'Rouge',
                                    caveName: caveName || getCaveName(targetCaveId),
                                    quantity: qty || 1,
                                    unitPrice: price,
                                    parkerScore: parker || '',
                                    vivinoScore: vivino || '',
                                    note: notes || ''
                                });
                                importedCount++;
                            }
                        } else if (qty > 0) {
                            findOrCreateWineAndAddStock({
                                name: cuvee,
                                domain: domaine || '',
                                vintage: Number(millesime) || '',
                                color: couleur || 'Rouge',
                                appellation: appellation || '',
                                estimatedPrice: price,
                                parkerScore: parker || '',
                                vivinoScore: vivino || '',
                                drinkFrom: Number(drinkFrom) || CURRENT_YEAR,
                                drinkTo: Number(drinkTo) || (CURRENT_YEAR + 6),
                                notes: notes || ''
                            }, targetCaveId, qty);
                            importedCount++;
                        }
                    }

                    saveState();
                    closeModal();
                    renderApp();
                    showToast(`${importedCount} ligne(s) importée(s) depuis Excel`);
                } catch (err) {
                    showToast('Erreur de lecture du fichier CSV');
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // =========================================================================
        // 14. INITIALISATION ASYNCHRONE INDEXEDDB + RENDU IMMÉDIAT
        // =========================================================================
        async function initVinSurVinApp() {
            renderApp();
            const idbState = await readFromIndexedDB();
            if (idbState) {
                state = normalizeLoadedState(idbState);
                renderApp();
            } else {
                await writeToIndexedDB(state);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVinSurVinApp);
        } else {
            initVinSurVinApp();
        }
    </script>
